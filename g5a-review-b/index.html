<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>5A 小步走複習站 B組</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* VOICE: 溫和、一步一步，像老師在旁邊陪著做。
   IDEA: 方格練習簿上的「動畫小劇場」：左邊演出生活情境，右邊回答問題，答對才翻下一頁。
   PICTURE: 每一步一張會動的圖（餅乾、披薩、巧克力、停車格、蛋糕），佔畫面左半。
   COLOUR and TYPE: 松綠為主色，單元各有一色；黃、綠、橘塗色；霞鶩文楷標題＋思源黑體內文。
   LAYOUT: 平板橫放左右兩欄；窄螢幕上下排。 */
:root{color-scheme:light;
  --paper:#F2F6F1;--grid:#DFE9DE;--card:#fff;--ink:#1C2B21;--mute:#55695B;--line:#C8D7C9;
  --accent:#2E6B3F;--accent-soft:#E2EFE4;--on:#fff;
  --hl:#F6D35B;--hl2:#A9D5A0;--hl3:#EFA77A;
  --ok:#1F7A4A;--ok-bg:#E1F2E7;--warn:#A84E00;--warn-bg:#FFEFD9;--star:#E8A317;
  --u6:#3D6A86;--u7:#7A4E6B;--u8:#5B7F47;--u9:#A0522D;--u10:#41604F;
  --display:"LXGW WenKai TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --u:var(--accent);
}
:root[data-theme=dark]{color-scheme:dark;--paper:#111A14;--grid:#18241B;--card:#17231B;--ink:#E4EEE6;--mute:#9CB3A2;--line:#30453A;--accent:#74C38A;--accent-soft:#183222;--on:#0C1A10;--hl:#C9A23A;--hl2:#3F7A48;--hl3:#A8643E;--ok:#6CCB93;--ok-bg:#16301F;--warn:#F2A35A;--warn-bg:#3A2913;--star:#F0C24F}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--paper:#111A14;--grid:#18241B;--card:#17231B;--ink:#E4EEE6;--mute:#9CB3A2;--line:#30453A;--accent:#74C38A;--accent-soft:#183222;--on:#0C1A10;--hl:#C9A23A;--hl2:#3F7A48;--hl3:#A8643E;--ok:#6CCB93;--ok-bg:#16301F;--warn:#F2A35A;--warn-bg:#3A2913;--star:#F0C24F}}
*{box-sizing:border-box;min-width:0}
html{font-size:21px;-webkit-text-size-adjust:100%}
body{margin:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font-family:var(--body);line-height:1.6;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:8px}
h1,h2{font-family:var(--display);line-height:1.2;margin:0;text-wrap:balance}
b{font-weight:700}
[hidden]{display:none!important}
.wrap{max-width:1240px;margin:0 auto;padding:16px}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr);gap:1.2rem;align-items:center;padding:1rem 0 1.2rem}
.hero h1{font-size:2.2rem}
.hero p{color:var(--mute);margin:.4rem 0 0;font-size:1rem}
.flow{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.9rem}
.flow span{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:.2rem .9rem;font-weight:700;font-size:.9rem}
.flow i{font-style:normal;color:var(--accent);align-self:center}
.hero svg{width:100%;height:auto}
.units{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.9rem}
.unit{display:flex;flex-direction:column;text-align:left;border:0;padding:0;border-radius:20px;overflow:hidden;background:var(--card);box-shadow:0 4px 0 color-mix(in srgb,var(--u) 60%,#000);min-height:15rem;transition:transform .15s}
.unit:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--u) 60%,#000)}
.unit .top{background:var(--u);color:#fff;padding:.8rem 1rem;display:flex;align-items:baseline;gap:.5rem}
.unit .no{font-size:.85rem;font-weight:700;opacity:.9}
.unit .nm{font-family:var(--display);font-weight:700;font-size:1.3rem;line-height:1.25;padding:0 1rem .3rem;margin-top:.6rem}
.unit .gl{padding:.2rem 1rem;color:var(--u);font-weight:700;font-size:1.05rem;min-height:2.4rem;display:flex;align-items:center}
.unit .gl svg{height:2.2rem;width:auto}
.unit ul{margin:.2rem 0 0;padding:0 1rem 0 2.1rem;color:var(--mute);font-size:.82rem;line-height:1.5}
.unit .go{margin:auto 1rem 1rem;display:flex;justify-content:space-between;align-items:center;font-weight:700;color:var(--u);padding-top:.7rem}
.stars{display:inline-flex;gap:.1rem}
.stars svg{width:1.5rem;height:1.5rem;color:var(--line)}
.stars svg.on{color:var(--star)}
.foot{color:var(--mute);font-size:.8rem;margin-top:1.4rem}

/* ---------- lesson ---------- */
.bar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.bar .in{max-width:1240px;margin:0 auto;padding:.45rem 16px;display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.ib{display:grid;place-items:center;width:2.8rem;height:2.8rem;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--accent);flex:none}
.ib svg{width:1.4rem;height:1.4rem}
.badge{background:var(--u);color:#fff;border-radius:10px;padding:.15rem .7rem;font-weight:700;font-size:.9rem;white-space:nowrap}
.utitle{font-family:var(--display);font-weight:700;font-size:1.2rem}
.dots{display:flex;gap:.3rem;flex-wrap:wrap;margin-left:auto}
.dots i{width:.85rem;height:.85rem;border-radius:50%;background:var(--line)}
.dots i.done{background:var(--u)}
.dots i.cur{background:var(--hl);box-shadow:0 0 0 3px color-mix(in srgb,var(--u) 45%,transparent)}
.dots i.drill{border-radius:3px}
.stage{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:1.1rem;align-items:start;padding-top:1rem}
.artbox{position:sticky;top:4.4rem;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:1rem;display:flex;flex-direction:column;gap:.6rem}
.art{display:grid;place-items:center;min-height:16rem}
.art svg.vis{width:100%;height:auto;max-height:62vh}
.art .formula{font-family:var(--display);font-size:2.4rem;font-weight:700;text-align:center;padding:1.4rem .6rem;line-height:1.5}
.artfoot{display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap}
.kind{font-weight:700;color:var(--u);font-size:.9rem}
.talk{display:flex;flex-direction:column;gap:.8rem}
.talk h2{font-size:1.65rem;color:var(--ink)}
.story{display:flex;gap:.7rem;align-items:flex-start;font-size:1.15rem;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:.8rem 1rem}
.story .t{flex:1}
.say{flex:none;width:2.6rem;height:2.6rem;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--accent);padding:0}
.say svg{width:1.25rem;height:1.25rem}
.q{background:var(--card);border:3px dashed var(--line);border-radius:16px;padding:.8rem 1rem;animation:rise .35s ease-out}
.q.done{border-style:solid;border-color:var(--ok);background:var(--ok-bg)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.qp{display:flex;gap:.7rem;align-items:flex-start}
.qp .t{flex:1;font-size:1.2rem;font-weight:500}
.qa{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-top:.7rem;font-size:1.3rem;font-weight:700}
.part{display:inline-flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.box{min-width:3.6rem;height:2.9rem;border:3px solid var(--line);border-radius:10px;background:var(--card);font-weight:700;font-size:1.35rem;padding:0 .4rem;display:inline-grid;place-items:center}
.box.act{border-color:var(--u);box-shadow:0 0 0 4px color-mix(in srgb,var(--u) 22%,transparent)}
.box.act:empty::after{content:'';width:2px;height:1.4rem;background:var(--u);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.box.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.box.bad{border-color:var(--warn);background:var(--warn-bg);color:var(--warn);animation:shake .4s}
@keyframes shake{25%,75%{transform:translateX(-5px)}50%{transform:translateX(5px)}}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.12;margin:0 .12em;font-weight:700}
.fr>span:first-child,.fr>.box:first-child{border-bottom:2.5px solid currentColor;padding:0 .2em}
.fr>.box:first-child{border-bottom-width:3px;margin-bottom:3px}
.fr .box{min-width:3rem;height:2.5rem;font-size:1.15rem}
.opt{min-height:3.1rem;min-width:4.4rem;padding:.4rem 1.1rem;border:3px solid var(--line);background:var(--card);border-radius:14px;font-size:1.15rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:.3rem}
.opt svg{width:130px;height:auto}
.opt.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opt.bad{border-color:var(--warn);background:var(--warn-bg);color:var(--warn);animation:shake .4s}
.opt.show{border-color:var(--ok);border-style:dashed;animation:glow 1.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--ok) 25%,transparent)}}
.pad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.4rem;margin-top:.7rem;max-width:340px;padding:.5rem;border:2px solid var(--line);border-radius:14px;background:var(--paper)}
.pad button{min-height:3.1rem;border-radius:11px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:1.35rem}
.pad button:active{background:var(--accent-soft)}
.pad .z{grid-column:span 2}
.pad .go{grid-column:1/-1;background:var(--u);border-color:var(--u);color:#fff;font-size:1.05rem}
.fb{margin-top:.6rem}
.fb>div{padding:.55rem .9rem;border-radius:10px;font-weight:700;display:flex;gap:.5rem;align-items:flex-start}
.fb .ok{background:var(--ok-bg);color:var(--ok)}
.fb .bad{background:var(--warn-bg);color:var(--warn)}
.fb .info{background:var(--accent-soft);color:var(--ink);font-weight:500}
.fb svg{width:1.3rem;height:1.3rem;flex:none;margin-top:.15rem}
.key{border:3px solid var(--u);border-radius:16px;padding:.7rem 1rem;background:var(--card);font-family:var(--display);font-size:1.25rem;animation:rise .4s ease-out}
.key b.lab{display:block;color:var(--u);font-size:.95rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-height:3.2rem;padding:.5rem 1.4rem;border-radius:16px;border:2px solid var(--u);background:var(--u);color:#fff;font-weight:700;font-size:1.15rem;box-shadow:0 3px 0 color-mix(in srgb,var(--u) 55%,#000)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.ghost{background:var(--card);color:var(--u);box-shadow:none}
.btn.small{min-height:2.6rem;font-size:.95rem;padding:.25rem 1rem;box-shadow:none}
.btn svg{width:1.15em;height:1.15em}
.next{animation:rise .4s ease-out;align-self:flex-start}
.endcard{max-width:640px;margin:2rem auto;text-align:center;background:var(--card);border:3px solid var(--star);border-radius:26px;padding:1.6rem 1.4rem}
.endcard h2{font-size:2rem;margin:.4rem 0}
.endcard .big{display:flex;justify-content:center;gap:.4rem}
.endcard .big svg{width:3.4rem;height:3.4rem;color:var(--line);animation:pop .5s cubic-bezier(.3,1.6,.6,1) both}
.endcard .big svg.on{color:var(--star)}
.endcard .big svg:nth-child(2){animation-delay:.15s}.endcard .big svg:nth-child(3){animation-delay:.3s}
.endcard p{color:var(--mute)}
.endcard .row{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap;margin-top:1rem}

/* ---------- svg drawing ---------- */
.vis .t{fill:var(--ink);font-family:var(--body);font-weight:700;font-size:18px}
.vis .tm{fill:var(--mute);font-family:var(--body);font-size:15px}
.vis .tw{fill:#fff;font-family:var(--body);font-weight:700;font-size:17px}
.vis .fa{fill:var(--hl)}.vis .fb{fill:var(--hl2)}.vis .fc{fill:var(--hl3)}.vis .fp{fill:var(--card)}.vis .fi{fill:var(--ink)}.vis .fu{fill:var(--u)}
.vis .st{stroke:var(--ink);stroke-width:2.2}.vis .st1{stroke:var(--ink);stroke-width:1.4}
.vis .no{fill:none}
.vis .ln{stroke:var(--ink);stroke-width:2.2;fill:none}
.vis .gl{stroke:var(--grid);stroke-width:1.2}
.vis .dash{fill:none;stroke:var(--mute);stroke-width:2;stroke-dasharray:6 5}
.vis .hi{fill:none;stroke:var(--u);stroke-width:5;stroke-linecap:round}
/* animations */
.vis *{transform-box:fill-box;transform-origin:center}
.pop{animation:pop .55s cubic-bezier(.3,1.6,.6,1) var(--d,0s) both}
@keyframes pop{from{opacity:0;transform:scale(.3)}}
.fade{animation:fade .7s ease var(--d,0s) both}
@keyframes fade{from{opacity:0}}
.gone{animation:gone .7s ease var(--d,0s) forwards}
@keyframes gone{to{opacity:.12;transform:scale(.6)}}
.vanish{animation:vanish .7s ease var(--d,0s) forwards}
@keyframes vanish{to{opacity:0}}
.mv{animation:mv 1.1s ease-in-out var(--d,0s) both}
@keyframes mv{to{transform:translate(var(--tx,0px),var(--ty,0px))}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .8s ease var(--d,0s) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.rot{transform-box:view-box;transform-origin:var(--ox) var(--oy);animation:rot 1.5s ease-in-out var(--d,0s) both}
@keyframes rot{from{opacity:.4}to{transform:rotate(180deg);opacity:1}}
.pulse{animation:pulse 1.3s ease-in-out var(--d,0s) infinite}
@keyframes pulse{50%{opacity:.45}}
.calm .vis *,.calm .vis{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}
@media (prefers-reduced-motion:reduce){.vis *{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}}


.toprow{display:flex;gap:.6rem;flex-wrap:wrap}.toprow a.btn{text-decoration:none}
.herotop{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap}
.rec .who{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;margin:1rem 0}
.rec .who label{font-weight:700}
.rec input{font:inherit;font-size:1.1rem;padding:.4rem .8rem;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);min-height:2.8rem;width:12rem}
.muted{color:var(--mute);font-size:.85rem}
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.7rem;margin-bottom:1rem}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.6rem 1rem;display:flex;flex-direction:column}
.sum b{font-size:1.7rem;color:var(--accent);line-height:1.2}
.sum span{color:var(--mute);font-size:.85rem}
.ucards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:.8rem}
.ucard{background:var(--card);border:1px solid var(--line);border-top:6px solid var(--u);border-radius:16px;padding:.8rem 1rem;display:flex;flex-direction:column;gap:.45rem}
.ucard .uh{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.ucard .uh .stars{margin-left:auto}
.ucard .btn{align-self:flex-start;margin-top:auto}
.meter{height:.6rem;background:var(--grid);border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;background:var(--u)}
.weak{color:var(--warn);font-size:.9rem}.good{color:var(--ok);font-size:.9rem;font-weight:700}
.rh{font-size:1.3rem;margin:1.4rem 0 .6rem}
.scroll{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px}
table.log{border-collapse:collapse;width:100%;font-size:.85rem}
table.log th,table.log td{padding:.45rem .7rem;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.log td:last-child{white-space:normal;min-width:12rem}
table.log th{background:var(--accent-soft)}
table.log td.n{text-align:right}
.recbtns{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;margin-top:1rem}
.btn.danger{background:var(--warn);border-color:var(--warn);color:#fff}
.rtxt{width:100%;margin-top:.6rem;font:inherit;font-size:.85rem;border:2px solid var(--line);border-radius:12px;padding:.6rem;background:var(--card);color:var(--ink)}
@media (max-width:600px){.sum{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:1000px){.units{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:860px){.stage{grid-template-columns:minmax(0,1fr)}.artbox{position:static}.art{min-height:0}.hero{grid-template-columns:minmax(0,1fr)}}
@media (max-width:600px){html{font-size:18px}.units{grid-template-columns:minmax(0,1fr)}.unit{min-height:0}.hero h1{font-size:1.8rem}.dots{margin-left:0;width:100%}}
</style>
</head>

window.__bootErr=function(msg){var a=document.getElementById('app');if(a&&!a.children.length){a.innerHTML='<div style="max-width:640px;margin:3rem auto;padding:1.4rem;border:3px solid #A84E00;border-radius:18px;background:#FFEFD9;color:#5a2a00;font-size:1.05rem;line-height:1.7"><b style="font-size:1.3rem">教材沒有順利打開</b><br>請重新整理一次。如果還是一樣，請把這個畫面截圖給老師。<br><small style="word-break:break-all">'+String(msg).replace(/</g,'&lt;')+'<br>'+navigator.userAgent+'</small></div>';}};
window.addEventListener('error',function(e){window.__bootErr(e.message+(e.lineno?' (line '+e.lineno+')':''));});
window.addEventListener('load',function(){setTimeout(function(){window.__bootErr('畫面沒有內容');},1500);});
</script>

{

  const step=now=>{if(!el.isConnected)return;const e=now-t0;let a=359.9;for(let i=1;i<keys.length;i++){if(e<keys[i][1]){const [a0,s0]=keys[i-1],[a1,s1]=keys[i];a=a0+(a1-a0)*(e-s0)/(s1-s0);break;}}
   set(e>=6000?359.9:r2(a));if(e<6000)id=requestAnimationFrame(step);};
  id=requestAnimationFrame(step);}

function trapV(a,b,hh){return S(360,215,`<path d="M30 170 L320 170 L240 60 L100 60Z" class="fb st"/><line x1="100" y1="60" x2="100" y2="170" class="dash"/><path d="M100 158 h12 v12" class="st1 no"/>${T(170,48,a)}${T(175,196,b)}<text x="90" y="122" class="t" text-anchor="end">${hh}</text>`,'梯形');}

/* question kinds: choice {opts,a} · num {a,unit} · multi {parts:[{pre,a,den,post}]} · frac {n,d,simplest} */
const C=(p,opts,a,hint)=>({t:'choice',p,opts,a,hint});
const N=(p,a,unit,hint)=>({t:'num',p,a,unit,hint});
const M=(p,parts,hint)=>({t:'multi',p,parts,hint});
const FQ=(p,n,dd,simplest,hint,exact)=>({t:'frac',p,n,d:dd,simplest,hint,exact});
const sh=(opts,a)=>{const idx=G.shuffle(opts.map((_,i)=>i));return [idx.map(i=>opts[i]),idx.indexOf(a)];};
const CS=(p,opts,a,hint)=>{const [o,k]=sh(opts,a);return C(p,o,k,hint);};

function toSpeech(el){const c=el.cloneNode(true);c.querySelectorAll('svg,button').forEach(x=>x.remove());c.querySelectorAll('.fr').forEach(f=>f.replaceWith(f.getAttribute('aria-label')||''));c.querySelectorAll('.box').forEach(b=>b.replaceWith('多少'));
  return c.textContent.replace(/×/g,'乘').replace(/÷/g,'除以').replace(/[＝=]/g,'等於').replace(/−/g,'減').replace(/[+＋]/g,'加').replace(/○/g,'圈圈').replace(/＞/g,'大於').replace(/＜/g,'小於').replace(/\?/g,'多少').replace(/°/g,'度').replace(/→/g,'，再').replace(/\s+/g,' ');}
function speak(t){try{const s=speechSynthesis;s.cancel();const u=new SpeechSynthesisUtterance(t.replace(/乘/g,'成').replace(/長方形/g,'常方形'));u.lang='zh-TW';u.rate=.82;const v=s.getVoices().find(v=>/zh[-_]TW/i.test(v.lang))||s.getVoices().find(v=>/^zh/i.test(v.lang));if(v)u.voice=v;s.speak(u);}catch(e){}}
const sayBtn=el=>{const b=h(`<button class="say" type="button" aria-label="唸給我聽">${ICON.say}</button>`);b.onclick=()=>speak(toSpeech(el));return b;};

/* ================= question widget ================= */
let keyHandler=null;
document.addEventListener('keydown',e=>{if(keyHandler)keyHandler(e);});
const ansText=q=>q.t==='choice'?q.opts[q.a]:q.t==='num'?`${q.a}${q.unit?' '+q.unit:''}`:q.t==='frac'?F(q.n,q.d):q.parts.map(p=>`${p.pre||''} ${p.den?F(p.a,p.den):p.a}`).join('　');
function ask(q,host,u,done){
  const w=h(`<div class="q"><div class="qp"><div class="t">${q.p}</div></div><div class="qa"></div><div class="fb" aria-live="polite"></div></div>`);
  $('.qp',w).prepend(sayBtn($('.qp .t',w)));host.append(w);
  const qa=$('.qa',w),fb=$('.fb',w);let tries=0,over=false;
  const msg=(c,t)=>{fb.innerHTML=`<div class="${c}">${c==='ok'?ICON.check:ICON.bulb}<span>${t}</span></div>`;};
  const win=()=>{over=true;keyHandler=null;w.classList.add('done');const p=$('.pad',w);if(p)p.remove();msg('ok',OK[Math.floor(Math.random()*OK.length)]);setTimeout(()=>done(tries===0),650);};
  const lose=choice=>{tries++;if(tries===1)msg('bad','再想一想。'+(q.hint?'<br>提示：'+q.hint:''));else msg('bad',`答案是 <b>${ansText(q)}</b>，${choice?'請點它。':'請你把它填進去。'}`);};
  if(q.t==='choice'){
    q.opts.forEach((o,i)=>{const b=h(`<button class="opt" type="button">${o}</button>`);b.onclick=()=>{if(over)return;if(i===q.a){b.classList.add('ok');$$('.opt',qa).forEach(x=>x.classList.remove('show'));win();}else{b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');lose(true);if(tries>=2)$$('.opt',qa)[q.a].classList.add('show');}};qa.append(b);});
    keyHandler=null;w.scrollIntoView({block:'nearest',behavior:'smooth'});return;}
  /* typed answers: slots shown as boxes, filled with the on-screen pad */
  const slots=[];const box=()=>{slots.push('');return `<button type="button" class="box" data-i="${slots.length-1}" aria-label="答案格"></button>`;};
  if(q.t==='num')qa.innerHTML=`<span class="part">${box()}${q.unit?`<span>${q.unit}</span>`:''}</span>`;
  else if(q.t==='multi')qa.innerHTML=q.parts.map(p=>`<span class="part">${p.pre?`<span>${p.pre}</span>`:''}${p.den?`<span class="fr">${box()}<span>${p.den}</span></span>`:box()}${p.post?`<span>${p.post}</span>`:''}</span>`).join('');
  else qa.innerHTML=`<span class="part"><span class="fr">${box()}${box()}</span></span>`;
  const boxes=$$('.box',qa);let act=0;
  const paint=()=>boxes.forEach((b,i)=>{b.textContent=slots[i];b.classList.toggle('act',i===act&&!over);});
  boxes.forEach((b,i)=>b.onclick=()=>{if(over)return;act=i;paint();});
  const pad=h(`<div class="pad">${[7,8,9].map(n=>`<button type="button" data-k="${n}">${n}</button>`).join('')}<button type="button" data-k="del" aria-label="刪掉">⌫</button>${[4,5,6].map(n=>`<button type="button" data-k="${n}">${n}</button>`).join('')}<button type="button" data-k="nx" aria-label="下一格">→</button>${[1,2,3].map(n=>`<button type="button" data-k="${n}">${n}</button>`).join('')}<button type="button" data-k="0">0</button><button type="button" class="go" data-k="go">檢查</button></div>`);
  w.insertBefore(pad,fb);
  const press=k=>{if(over)return;const b=boxes[act];
    if(/^\d$/.test(k)){if(b.classList.contains('bad')||b.classList.contains('ok')){slots[act]='';b.classList.remove('bad','ok');}if(slots[act].length<4)slots[act]+=k;}
    else if(k==='del'){slots[act]=slots[act].slice(0,-1);b.classList.remove('bad');}
    else if(k==='nx'){act=(act+1)%boxes.length;}
    else if(k==='go')check();
    paint();};
  $$('button',pad).forEach(b=>b.onclick=()=>press(b.dataset.k));
  keyHandler=e=>{if(/^\d$/.test(e.key))press(e.key);else if(e.key==='Backspace')press('del');else if(e.key==='Tab'){e.preventDefault();press('nx');}else if(e.key==='Enter')press('go');};
  function check(){
    if(slots.some(s=>s==='')){const i=slots.findIndex(s=>s==='');act=i;paint();msg('info','還有空格喔，先填好再按「檢查」。');return;}
    const v=slots.map(Number);let ok;boxes.forEach(b=>b.classList.remove('ok','bad'));
    if(q.t==='num'){ok=v[0]===q.a;boxes[0].classList.add(ok?'ok':'bad');}
    else if(q.t==='multi'){ok=true;q.parts.forEach((p,i)=>{const o=v[i]===p.a;if(!o)ok=false;boxes[i].classList.add(o?'ok':'bad');});}
    else{ok=q.exact?(v[0]===q.n&&v[1]===q.d):(v[1]!==0&&v[0]*q.d===q.n*v[1]&&(!q.simplest||gcd(v[0],v[1])===1));boxes.forEach(b=>b.classList.add(ok?'ok':'bad'));
      if(!ok&&q.simplest&&v[1]!==0&&v[0]*q.d===q.n*v[1]){tries++;msg('bad','大小對了，但還可以再約分喔！');return;}}
    if(ok)win();else{boxes.forEach(b=>{if(b.classList.contains('bad')){b.style.animation='none';void b.offsetWidth;b.style.animation='';}});act=Math.max(0,boxes.findIndex(b=>b.classList.contains('bad')));lose(false);paint();}
  }
  paint();w.scrollIntoView({block:'nearest',behavior:'smooth'});
}

  <div class="wrap rec">
   <div class="who"><label for="nm">練習的人</label><input id="nm" type="text" maxlength="12" placeholder="寫名字" value="${esc(store.name||'')}" autocomplete="off"><span class="muted">紀錄存在這台平板上</span></div>
   <div class="sum"><div><b>${all.length}</b><span>練習次數</span></div><div><b>${tot}</b><span>做過的題目</span></div><div><b>${pct(ok,tot)}%</b><span>一次就答對</span></div><div><b>${Math.round(sec/60)}</b><span>練習分鐘</span></div></div>
   <div class="ucards">${UNITS.map(u=>{const S2=unitStats(u.no);return `<div class="ucard" style="--u:${u.color}"><div class="uh"><span class="badge">第 ${u.no} 單元</span><b>${u.name}</b>${starsHTML(store['u'+u.no]||0)}</div>
     ${S2.ss.length?`<div class="meter"><i style="width:${pct(S2.ok,S2.n)}%"></i></div><div class="muted">練習 ${S2.ss.length} 次（完成 ${S2.done} 次）・一次答對 ${pct(S2.ok,S2.n)}%・最近 ${fmtT(S2.last.t)}</div>
     ${S2.weak.length?`<div class="weak"><b>要再練：</b>${S2.weak.map(([k,v])=>`${esc(k)}（${v.ok}/${v.n}）`).join('、')}</div>`:(Object.keys(S2.sk).length?'<div class="good">最近的計算題都一次答對！</div>':'')}
     ${S2.good.length?`<div class="muted">已經很熟：${S2.good.map(esc).join('、')}</div>`:''}
     <button class="btn small" type="button" data-go="${u.no}">${S2.weak.length?'去練這個單元':'再練一次'}</button>`:`<div class="muted">還沒有練習</div><button class="btn small" type="button" data-go="${u.no}">開始</button>`}</div>`;}).join('')}</div>
   <h2 class="rh">最近的練習</h2>
   ${all.length?`<div class="scroll"><table class="log"><thead><tr><th>時間</th><th>單元</th><th>方式</th><th>題數</th><th>一次答對</th><th>笑臉</th><th>用時</th><th>錯比較多的</th></tr></thead><tbody>${all.slice(-30).reverse().map(x=>{const u=UNITS.find(v=>v.no===x.u);const miss=Object.entries(x.sk||{}).filter(([,v])=>v.ok<v.n).map(([k])=>k);return `<tr><td>${fmtT(x.t)}</td><td>第 ${x.u} 單元 ${u?u.name:''}</td><td>${x.full?'看動畫＋練習':'只練計算'}${x.done?'':'（未完成）'}</td><td class="n">${x.n}</td><td class="n">${x.ok}（${pct(x.ok,x.n)}%）</td><td>${x.done?starsHTML(x.st):'—'}</td><td class="n">${fmtD(x.sec)}</td><td>${miss.length?miss.map(esc).join('、'):'—'}</td></tr>`;}).join('')}</tbody></table></div>`:'<p class="muted">還沒有練習紀錄。做完一個單元就會出現在這裡。</p>'}
   <div class="row recbtns"><button class="btn ghost" type="button" id="copy">複製紀錄文字</button><button class="btn ghost" type="button" id="clr">清除紀錄</button><span id="msg" class="muted" aria-live="polite"></span></div>
  </div>`;
  $('#home').onclick=home;
  $('#nm').oninput=e=>{store.name=e.target.value.trim();save();};
  $$('[data-go]',app).forEach(b=>b.onclick=()=>start(UNITS.findIndex(u=>u.no===+b.dataset.go)));
  $('#copy').onclick=()=>{const lines=[`5A 小步走複習站 B組 學習紀錄${store.name?'－'+store.name:''}`];
    UNITS.forEach(u=>{const S2=unitStats(u.no);if(!S2.ss.length)return;lines.push(`第${u.no}單元 ${u.name}：練習${S2.ss.length}次，一次答對${pct(S2.ok,S2.n)}%，最好${store['u'+u.no]||0}個笑臉${S2.weak.length?'；要再練：'+S2.weak.map(([k,v])=>`${k}(${v.ok}/${v.n})`).join('、'):''}`);});
    lines.push('','時間｜單元｜題數｜一次答對｜用時');all.slice(-30).forEach(x=>lines.push(`${fmtT(x.t)}｜第${x.u}單元｜${x.n}題｜${x.ok}題｜${fmtD(x.sec)}${x.done?'':'（未完成）'}`));
    const txt=lines.join('\n');const m=$('#msg');
    try{navigator.clipboard.writeText(txt).then(()=>m.textContent='已複製，可以貼到紀錄表或 IEP。',()=>{m.textContent='這裡不能自動複製，請改用下方文字。';showTxt(txt);});}catch(e){showTxt(txt);}};
  const showTxt=t=>{if($('#rtxt'))return;$('.recbtns').after(h(`<textarea id="rtxt" class="rtxt" readonly rows="8">${esc(t)}</textarea>`));};
  let armed=false;$('#clr').onclick=e=>{const b=e.currentTarget;if(!armed){armed=true;b.textContent='確定要清除全部紀錄？再按一次';b.classList.add('danger');setTimeout(()=>{armed=false;if(b.isConnected){b.textContent='清除紀錄';b.classList.remove('danger');}},4000);return;}
    store.log=[];UNITS.forEach(u=>delete store['u'+u.no]);save();records();};
  window.scrollTo({top:0});
}
function route(){if(location.hash==='#records'){records();return;}const m=location.hash.match(/^#u(\d+)$/);const i=m?UNITS.findIndex(u=>u.no===+m[1]):-1;if(i>=0)start(i);else home();}
window.addEventListener('hashchange',()=>{if(!L||location.hash!=='#u'+L.u.no)route();});
window.__T={UNITS,get L(){return L;},start,home,go:(ui,i)=>{start(ui);L.i=i;card();}};
route();
}
</script>
</body>
</html>
