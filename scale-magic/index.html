<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>放大圖、縮圖與比例尺</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/*
VOICE: 探險家筆記本，親切、大字、一次一題（資源班平板個別複習）
IDEA: 方格紙練習簿——左邊是會動的方格圖解，右邊是重點＋題目，答對才往下
PICTURE: 精準方格動畫：格子、倍數、面積、比例尺都可以數得出來
COLOUR and TYPE: 牛皮紙棕 + 方格紙白 + 冰藍；重點黃；Noto Sans TC 粗體
LAYOUT: 選單→三節課；橫式平板左圖右卡，直式上圖下卡
*/
:root{color-scheme:light dark;
  --bg:light-dark(#cfae80,#241b14);--bg2:light-dark(#bf9a68,#1b140f);
  --paper:light-dark(#fffdf5,#33281f);--grid:light-dark(#d9e8f5,#40362c);
  --ink:light-dark(#2b2118,#f6ecdc);--soft:light-dark(#6d5a45,#c9b79f);
  --blue:light-dark(#1f6fb8,#7cc0f5);--blueBg:light-dark(#e2f1fc,#1f3346);
  --yel:#ffd93b;--ok:light-dark(#21985a,#5fd391);--okBg:light-dark(#dcf6e7,#173a28);
  --no:light-dark(#d2453b,#ff8a80);--noBg:light-dark(#fde3e0,#46201d)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;color:var(--ink);font:18px/1.55 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;overflow-x:clip;
  background:radial-gradient(circle at 20% 10%,rgba(255,255,255,.18),transparent 40%),radial-gradient(circle at 80% 90%,rgba(0,0,0,.12),transparent 45%),var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.app{max-width:1400px;margin:0 auto;padding:12px clamp(10px,2vw,24px) 16px;min-height:100%;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{font-size:20px;font-weight:900;margin:0;flex:1 1 220px;line-height:1.2}
.bar{flex:2 1 200px;height:18px;border-radius:99px;background:var(--bg2);box-shadow:inset 0 2px 4px rgba(0,0,0,.25);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(45deg,var(--blue) 0 12px,#3d8fd6 12px 24px);border-radius:99px;transition:width .6s cubic-bezier(.3,1.4,.5,1)}
.pill{min-height:44px;border-radius:99px;border:0;background:var(--paper);display:flex;align-items:center;gap:6px;padding:0 14px;font-weight:700;font-size:16px;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.pill svg{width:22px;height:22px}
.pill[aria-pressed=false]{opacity:.45}
.stars{font-weight:900;font-size:20px}
.stars.bump{animation:bump .5s}
main{flex:1;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:clamp(12px,1.6vw,22px);align-items:center}
.photo{position:relative;background:#fff;padding:10px;border-radius:6px;box-shadow:0 12px 28px rgba(0,0,0,.3);transform:rotate(-.5deg)}
.photo::before,.photo::after{content:"";position:absolute;width:100px;height:28px;background:rgba(170,215,240,.75);top:-12px;z-index:2}
.photo::before{left:-16px;transform:rotate(-28deg)}.photo::after{right:-16px;transform:rotate(26deg)}
.figt{margin:0 0 6px;font-weight:900;font-size:clamp(18px,1.8vw,22px);text-align:center;color:#2b2118}
.frame{aspect-ratio:16/9;background:#fffdf5;border-radius:3px;overflow:hidden}
.frame svg{width:100%;height:100%;display:block}
.replay{display:flex;justify-content:center;margin-top:8px}
.replay button{border:0;background:var(--blueBg);color:var(--blue);font-weight:700;font-size:16px;border-radius:99px;padding:0 16px;min-height:44px}
.enter{animation:in0 .7s cubic-bezier(.2,1.2,.4,1) both}
.card{background:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px;border-radius:14px;padding:clamp(16px,2vw,24px);box-shadow:0 10px 0 var(--bg2),0 14px 30px rgba(0,0,0,.25);position:relative}
.card.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
.tag{display:inline-block;background:var(--yel);color:#3b2b00;font-weight:900;font-size:15px;padding:3px 12px;border-radius:6px;transform:rotate(-2deg);margin-bottom:8px}
.key{background:var(--blueBg);border-radius:12px;padding:10px 14px;margin:0 0 14px;font-weight:700;font-size:clamp(17px,1.7vw,20px);line-height:1.5;border-left:6px solid var(--blue)}
.key em{font-style:normal;font-weight:900;color:var(--blue);margin-right:6px}
.row{display:flex;gap:10px;align-items:flex-start}
.row>*:first-child{flex:1}
.q{font-size:clamp(20px,2vw,25px);font-weight:900;line-height:1.45;margin:0 0 14px}
.q b,.key b{color:var(--blue)}
.say{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--blueBg);color:var(--blue);display:grid;place-items:center}
.say svg{width:22px;height:22px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.78em;line-height:1.08;margin:0 3px}
.fr i{font-style:normal}.fr i:first-child{border-bottom:2px solid currentColor;padding:0 3px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 16px;border-radius:12px;border:3px solid var(--ink);background:var(--paper);font-size:clamp(19px,1.9vw,23px);font-weight:700;text-align:left;box-shadow:0 4px 0 var(--ink);transition:transform .12s,box-shadow .12s,background .2s}
.fresh .opt{animation:slide .45s cubic-bezier(.2,1.3,.4,1) both}
.opt>b{flex:none;width:34px;height:34px;border-radius:50%;background:var(--blueBg);color:var(--blue);display:grid;place-items:center;font-size:18px}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.opt.ok{background:var(--okBg);border-color:var(--ok);box-shadow:0 4px 0 var(--ok);animation:yes .5s}
.opt.ok>b{background:var(--ok);color:#fff}
.opt.no{background:var(--noBg);border-color:var(--no);box-shadow:none;opacity:.6}
.opt.no span{text-decoration:line-through}
.opt.no.just{animation:shake .45s}
.opt.no>b{background:var(--no);color:#fff}
.opt.cue{border-color:#d4a800;box-shadow:0 4px 0 #d4a800,0 0 0 5px rgba(255,217,59,.55);animation:pulse 1.2s ease-in-out infinite}
.opt:disabled{cursor:default}
.hint,.praise{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:18px;font-weight:700;line-height:1.45;animation:pop .4s cubic-bezier(.2,1.4,.4,1) both}
.hint{background:#fff6cc;color:#5a4200;border:2px dashed #d4a800}
.praise{background:var(--okBg);color:var(--ok);border:2px solid var(--ok)}
.stamp{position:absolute;right:14px;top:-22px;width:80px;height:80px;border-radius:50%;border:5px solid var(--no);color:var(--no);display:grid;place-items:center;font-weight:900;font-size:20px;transform:rotate(-14deg);background:var(--paper);animation:stamp .45s cubic-bezier(.3,1.6,.5,1) both;line-height:1.1;text-align:center}
nav{display:flex;gap:12px;margin-top:16px}
.btn{flex:1;min-height:58px;border-radius:14px;border:0;font-weight:900;font-size:21px;padding:8px 16px;box-shadow:0 5px 0 rgba(0,0,0,.3)}
.btn:active{transform:translateY(3px)}
.back{flex:0 0 auto;background:var(--bg2);color:var(--ink)}
.next{background:var(--blue);color:#fff}
.next.go{animation:pulse 1.1s ease-in-out infinite}
.next:disabled{background:#9a8b78;color:#eee;cursor:not-allowed;box-shadow:none;opacity:.7;animation:none}
.lock{font-size:15px;color:var(--soft);text-align:center;margin:8px 0 0;font-weight:700}
/* menu */
main.m{grid-template-columns:minmax(0,1fr)}
.menu{max-width:1100px;margin:0 auto;width:100%;display:grid;gap:18px;grid-template-columns:repeat(3,minmax(0,1fr));align-items:stretch;padding:8px 0}
.menu h2{grid-column:1/-1;margin:0;font-size:clamp(26px,3vw,40px);font-weight:900;line-height:1.15;text-align:center}
.menu p.sub{grid-column:1/-1;margin:-8px 0 4px;text-align:center;font-weight:700;color:var(--ink);opacity:.8}
.lesson{border:0;text-align:left;background:var(--paper);border-radius:16px;padding:14px 14px 18px;box-shadow:0 8px 0 var(--bg2),0 12px 24px rgba(0,0,0,.2);display:flex;flex-direction:column;gap:8px;transition:transform .15s}
.lesson:hover{transform:translateY(-4px) rotate(-.5deg)}
.lesson svg{width:100%;aspect-ratio:16/9;background:#fffdf5;border-radius:8px;border:2px solid #e6dccb}
.lesson .no{font-size:15px;font-weight:900;background:var(--yel);color:#3b2b00;align-self:flex-start;padding:2px 12px;border-radius:6px}
.lesson .nm{font-size:clamp(21px,2.2vw,28px);font-weight:900;line-height:1.2}
.lesson .ds{font-size:16px;font-weight:700;color:var(--soft);line-height:1.45}
.lesson .res{font-size:16px;font-weight:900;color:var(--ok)}
.big{font-size:clamp(24px,2.6vw,32px);font-weight:900;line-height:1.3;margin:0 0 10px}
.endstars{display:flex;justify-content:center;gap:6px;margin:10px 0}
.endstars svg{width:44px;height:44px;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
/* svg */
.gl{stroke:#cddff0;stroke-width:1}
.sh{stroke:#2b2118;stroke-width:3.5;fill:rgba(31,111,184,.08);stroke-linejoin:round}
.sh.b{stroke:#1f6fb8;fill:rgba(31,111,184,.15)}
.sh.o{stroke:#c2410c;fill:rgba(232,121,46,.18)}
.ol{fill:none;stroke:#1f6fb8;stroke-width:3.5;stroke-dasharray:9 7}
.tile{fill:#e8792e;stroke:#8a3f0c;stroke-width:2.5}
.tile.l{fill:#f6c08f}
.edge{stroke:#1f6fb8;stroke-width:7;stroke-linecap:round;fill:none}
.hl{stroke:#d2453b;stroke-width:8;stroke-linecap:round;fill:none}
.hlf{fill:rgba(255,217,59,.45);stroke:#d4a800;stroke-width:3}
.arc{fill:none;stroke:#d2453b;stroke-width:4}
.ra{fill:none;stroke:#2b2118;stroke-width:2}
.dot{fill:#d2453b}
.ring{fill:none;stroke:#d2453b;stroke-width:3;animation:ring 1.3s ease-out infinite;transform-box:fill-box;transform-origin:center}
.num{font:700 14px "Noto Sans TC",sans-serif;fill:#6d5a45;text-anchor:middle}
.cn{font:900 16px "Noto Sans TC",sans-serif;fill:#8a3f0c;text-anchor:middle}
.lab{font:900 21px "Noto Sans TC",sans-serif;fill:#2b2118;text-anchor:middle;paint-order:stroke;stroke:#fffdf5;stroke-width:6px;stroke-linejoin:round}
.lab.s{font-size:17px}.lab.xl{font-size:46px}.lab.bl{fill:#1f6fb8}.lab.rd{fill:#c0392b}.lab.st{text-anchor:start}.lab.gr{fill:#9a8b78}
.ban rect{fill:#ffd93b;stroke:#8a6a00;stroke-width:2}.ban text{font:900 21px "Noto Sans TC",sans-serif;fill:#3b2b00;text-anchor:middle}
.tn{fill:#fff;font:900 20px "Noto Sans TC",sans-serif;text-anchor:middle}
.tc{fill:#8a3f0c}
.arr{stroke:#2b2118;stroke-width:3.5;fill:none;stroke-linecap:round}.arrh{fill:#2b2118}
.pa{fill:none;stroke:#d2453b;stroke-width:3;stroke-dasharray:7 6}
.fade{opacity:.3}
.n-pop{animation:sgrow .55s cubic-bezier(.2,1.4,.4,1) both;transform-box:fill-box;transform-origin:center}
.n-fade{animation:fade .6s both}
.n-draw{stroke-dasharray:1;animation:draw .9s ease-out both}
@keyframes in0{from{opacity:0;transform:translateY(24px) rotate(2deg)}}
@keyframes pop{from{opacity:0;transform:scale(.88)}}
@keyframes slide{from{opacity:0;transform:translateX(30px)}}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
@keyframes yes{40%{transform:scale(1.05)}}
@keyframes bump{40%{transform:scale(1.3)}}
@keyframes stamp{from{opacity:0;transform:rotate(-14deg) scale(2.4)}}
@keyframes pulse{50%{transform:scale(1.03)}}
@keyframes sgrow{from{opacity:0;transform:scale(.2)}}
@keyframes fade{from{opacity:0}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes ring{from{transform:scale(.6);opacity:1}to{transform:scale(1.9);opacity:0}}
@media (max-width:860px),(orientation:portrait){main{grid-template-columns:minmax(0,1fr);align-items:start}.menu{grid-template-columns:minmax(0,1fr)}}
@media (max-width:600px){header h1{font-size:17px}.pill span{display:none}.stamp{width:64px;height:64px;font-size:16px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="pill" id="home" aria-label="回選單"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg><span>選單</span></button>
    <h1 id="ttl">放大圖、縮圖與比例尺</h1>
    <div class="bar" aria-label="進度"><i id="prog" style="width:0"></i></div>
    <div class="pill stars" aria-label="星星"><svg viewBox="0 0 24 24"><path fill="#f5b800" stroke="#a87400" stroke-width="1.2" d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg><span id="starN">0</span></div>
    <button class="pill" id="readT" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg><span>自動朗讀</span></button>
    <button class="pill" id="sfxT" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3" fill="currentColor"/><circle cx="17" cy="16" r="3" fill="currentColor"/></svg><span>音效</span></button>
  </header>
  <main id="main"></main>
</div>
<canvas id="fx"></canvas>
<script>
{
const $=id=>document.getElementById(id);
const fr=(n,d)=>`<span class="fr" data-s="${d}分之${n}"><i>${n}</i><i>${d}</i></span>`;

/* ---------- SVG 小工具（單位：格，1 格 = 32px） ---------- */
const C=32,GW=20,GH=11.25;
const P=v=>+(v*C).toFixed(1);
const R=(x,y,w,h,c,st='')=>`<rect x="${P(x)}" y="${P(y)}" width="${P(w)}" height="${P(h)}" class="${c}" ${st}/>`;
const T=(t,x,y,c='')=>`<text class="lab ${c}" x="${P(x)}" y="${P(y)}">${t}</text>`;
const TR=(t,x,y,c='')=>`<text class="lab ${c}" transform="translate(${P(x)} ${P(y)}) rotate(-90)">${t}</text>`;
const L=(x1,y1,x2,y2,c,st='')=>`<line class="${c}" pathLength="1" x1="${P(x1)}" y1="${P(y1)}" x2="${P(x2)}" y2="${P(y2)}" ${st}/>`;
const PG=(pts,c)=>`<polygon class="${c}" points="${pts.map(p=>P(p[0])+','+P(p[1])).join(' ')}"/>`;
const G=(c,inner,d=0)=>`<g class="${c}" ${d?`style="animation-delay:${d}s"`:''}>${inner}</g>`;
function nums(x,y,n,side,lab){let s='';for(let i=0;i<n;i++){const t=lab?lab(i):i+1;
  s+=side==='t'?`<text class="num" x="${P(x+i+.5)}" y="${P(y)-7}">${t}</text>`:side==='b'?`<text class="num" x="${P(x+i+.5)}" y="${P(y)+17}">${t}</text>`:side==='r'?`<text class="num" x="${P(x)+13}" y="${P(y+i+.5)+5}">${t}</text>`:`<text class="num" x="${P(x)-12}" y="${P(y+i+.5)+5}">${t}</text>`}return s}
const arrow=(x1,x2,y,t)=>`<line class="arr" x1="${P(x1)}" y1="${P(y)}" x2="${P(x2)-10}" y2="${P(y)}"/><path class="arrh" d="M${P(x2)} ${P(y)} l-15 -9 v18z"/>${t?T(t,(x1+x2)/2,y-.3):''}`;
const ban=(t,x,y,w)=>`<g class="ban"><rect x="${P(x-w/2)}" y="${P(y)-28}" width="${P(w)}" height="40" rx="10"/><text x="${P(x)}" y="${P(y)}">${t}</text></g>`;
const tile=(x,y,w,h,n,c='tile')=>`${R(x,y,w,h,c)}<circle class="tc" cx="${P(x+w/2)}" cy="${P(y+h/2)}" r="14"/><text class="tn" x="${P(x+w/2)}" y="${P(y+h/2)+7}">${n}</text>`;
const tiles=(list,c)=>list.map((t,i)=>G('n-pop',tile(...t,i+1,c),i*.25)).join('');
const cellNums=(x,y,w,h,step=.06)=>{let s='',k=0;for(let j=0;j<h;j++)for(let i=0;i<w;i++){k++;s+=G('n-pop',`<text class="cn" x="${P(x+i+.5)}" y="${P(y+j+.5)+6}">${k}</text>`,k*step)}return s};
const SF=(n,d,x,y,sz)=>`<text class="lab" style="font-size:${sz}px" x="${P(x)}" y="${P(y)-6}">${n}</text><line x1="${P(x)-sz*.9}" x2="${P(x)+sz*.9}" y1="${P(y)+4}" y2="${P(y)+4}" stroke="#2b2118" stroke-width="4"/><text class="lab" style="font-size:${sz}px" x="${P(x)}" y="${P(y)+sz+8}">${d}</text>`;
const pen=(x,y,w,h)=>`${R(x,y,w,h,'sh')}<use href="#pg" x="${P(x)+2}" y="${P(y)+2}" width="${P(w)-4}" height="${P(h)-4}"/>`;
const ck=(x,y,w,h)=>`${R(x,y,w,h,'sh')}<use href="#ck" x="${P(x)+2}" y="${P(y)+2}" width="${P(w)-4}" height="${P(h)-4}"/>`;
const arcP=(cx,cy,a1,a2,r)=>{const p=a=>[cx+r*Math.cos(a),cy+r*Math.sin(a)];const[s1,s2]=[p(a1),p(a2)];return `<path class="arc" d="M${P(s1[0])} ${P(s1[1])} A${P(r)} ${P(r)} 0 0 0 ${P(s2[0])} ${P(s2[1])}"/>`};
const rang=(x,y,dx,dy)=>{const k=.45;return `<path class="ra" d="M${P(x+dx*k)} ${P(y)} L${P(x+dx*k)} ${P(y+dy*k)} L${P(x)} ${P(y+dy*k)}"/>`};
const ring=(x,y)=>`<circle class="dot" cx="${P(x)}" cy="${P(y)}" r="7"/><circle class="ring" cx="${P(x)}" cy="${P(y)}" r="12"/>`;

const DEFS=(()=>{let p='';for(let i=0;i<3;i++){const o=i*40;p+=`<ellipse cx="${o+20}" cy="55" rx="13" ry="30" fill="#22303f"/><ellipse cx="${o+22}" cy="60" rx="8.5" ry="23" fill="#fff"/><circle cx="${o+20}" cy="26" r="10" fill="#22303f"/><ellipse cx="${o+25}" cy="31" rx="3" ry="4.5" fill="#f6b31b"/><circle cx="${o+24}" cy="23" r="1.7" fill="#fff"/><path d="M${o+29} 24l8 3-8 2z" fill="#e8792e"/><ellipse cx="${o+15}" cy="86" rx="5" ry="2.4" fill="#e8792e"/><ellipse cx="${o+27}" cy="86" rx="5" ry="2.4" fill="#e8792e"/>`}
 return `<defs><symbol id="pg" viewBox="0 0 120 90" preserveAspectRatio="none"><rect width="120" height="90" fill="#e3f2fb"/>${p}</symbol>
 <symbol id="ck" viewBox="0 0 100 100" preserveAspectRatio="none"><rect width="100" height="100" fill="#ffd9b0"/><g fill="#fff" stroke="#8a6a50" stroke-width="2" vector-effect="non-scaling-stroke">${[[34,38,18],[55,30,20],[72,46,16],[28,62,16],[50,64,22],[73,66,15]].map(c=>`<circle cx="${c[0]}" cy="${c[1]}" r="${c[2]}" vector-effect="non-scaling-stroke"/>`).join('')}</g><g fill="#fff"><circle cx="34" cy="38" r="16"/><circle cx="55" cy="30" r="18"/><circle cx="72" cy="46" r="14"/><circle cx="28" cy="62" r="14"/><circle cx="50" cy="64" r="20"/><circle cx="73" cy="66" r="13"/><rect x="30" y="38" width="44" height="30"/></g><ellipse cx="42" cy="52" rx="4" ry="6" fill="#2b2118"/><ellipse cx="62" cy="52" rx="4" ry="6" fill="#2b2118"/><ellipse cx="34" cy="62" rx="5" ry="3" fill="#f7a6a6"/><ellipse cx="70" cy="62" rx="5" ry="3" fill="#f7a6a6"/><path d="M47 62q5 5 10 0" fill="none" stroke="#2b2118" stroke-width="2" vector-effect="non-scaling-stroke"/></symbol>

   {q:'爸爸用手機看地圖，想看範圍小、比較詳細的，比例尺要調成？',o:['1：200','1：800'],a:0,hint:'後面的數字小 → 範圍小、比較詳細。',ok:'對！1：200 的範圍小、比較詳細。'}]}
]}];

/* ---------- 狀態 ---------- */
let lesson=-1,cur=0,stars=0,sfx=true,autoRead=false;
const memo=LESSONS.map(()=>null);
let st=null; // {pi,qi,tries:{},done:Set,stars}
const STAR='<svg viewBox="0 0 24 24"><path fill="#f5b800" stroke="#a87400" stroke-width="1.2" d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg>';
const SAY='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6"/></svg>';
const main=$('main');
const total=l=>LESSONS[l].pages.reduce((n,p)=>n+p.qs.length,0);
const key=(pi,qi)=>pi+':'+qi;

function svg(inner){return `<svg viewBox="0 0 ${P(GW)} ${P(GH)}" preserveAspectRatio="xMidYMid meet">${DEFS}${gridLines()}${inner}</svg>`}
function menu(){
  lesson=-1;stopSpeak();$('ttl').textContent='放大圖、縮圖與比例尺';$('prog').style.width='0';$('starN').textContent=memo.reduce((n,m)=>n+(m?m.stars:0),0);
  const thumbs=[pen(1,4,4,3)+arrow(5.6,8.4,5.5,'× 2')+pen(9.5,1,8,6),R(2,3,3,2,'tile l')+arrow(5.6,8.4,4,'× 2')+tiles([[9,2,3,2],[12,2,3,2],[9,4,3,2],[12,4,3,2]]),maps(false,false)];
  main.className='m';main.innerHTML=`<section class="menu"><h2>第 9 單元　放大圖、縮圖與比例尺</h2><p class="sub">選一節課開始練習。每一題答對了，才能往下走喔！</p>${LESSONS.map((L,i)=>`<button class="lesson" data-l="${i}">${svg(thumbs[i]).replace('<svg','<svg aria-hidden="true"')}<span class="no">${L.no}</span><span class="nm">${L.name}</span><span class="ds">${L.desc}・${total(i)} 題</span>${memo[i]?`<span class="res">已完成，第一次就答對 ${memo[i].stars} / ${total(i)} 題</span>`:''}</button>`).join('')}</section>`;
  main.querySelectorAll('.lesson').forEach(b=>b.onclick=()=>{location.hash='lesson-'+(+b.dataset.l+1)});
}
function start(l){lesson=l;st={pi:0,qi:0,tries:{},done:new Set(),stars:0};$('ttl').textContent=LESSONS[l].no+'　'+LESSONS[l].name;$('starN').textContent=0;
  main.className='';main.innerHTML=`<div><div class="photo enter" id="photo"><p class="figt" id="figt"></p><div class="frame" id="fig"></div><div class="replay"><button id="replay">▶ 再看一次動畫</button></div></div></div><section class="card" id="card" aria-live="polite"></section>`;
  $('replay').onclick=()=>drawFig(true);
  page(true)}
function stateOf(){const q=LESSONS[lesson].pages[st.pi].qs[st.qi];if(st.done.has(key(st.pi,st.qi)))return 'ok';return (st.tries[key(st.pi,st.qi)]||[]).length?'hint':'q'}
function drawFig(fresh){const p=LESSONS[lesson].pages[st.pi];$('fig').innerHTML=svg(p.fig({qi:st.qi,st:stateOf(),fr:fresh}))}
function progress(){$('prog').style.width=(st.done.size/total(lesson)*100)+'%'}
function page(isNew){
  const L=LESSONS[lesson],p=L.pages[st.pi],q=p.qs[st.qi],k=key(st.pi,st.qi);
  const done=st.done.has(k),tried=st.tries[k]||[],cue=!done&&tried.length>=2;
  const lastQ=st.qi===p.qs.length-1,lastP=st.pi===L.pages.length-1;
  $('figt').textContent=p.title;
  const card=$('card');card.classList.remove('pop');if(isNew){void card.offsetWidth;card.classList.add('pop')}
  card.innerHTML=`<span class="tag">${L.no}・第 ${st.pi+1} / ${L.pages.length} 頁・第 ${st.qi+1} 題</span>
  <div class="key"><em>重點</em>${p.key}</div>
  <div class="row"><p class="q">${q.q}</p><button class="say" id="say" aria-label="唸給我聽">${SAY}</button></div>
  <div class="opts ${isNew?'fresh':''}">${q.o.map((o,i)=>{const ok=done&&i===q.a,no=tried.includes(i);return `<button class="opt ${ok?'ok':no?'no':''} ${no&&i===tried[tried.length-1]&&!isNew&&!done?'just':''} ${cue&&i===q.a?'cue':''}" data-k="${i}" style="animation-delay:${.25+i*.08}s" ${done||no?'disabled':''}><b>${ok?'✓':no?'✗':i+1}</b><span>${o}</span></button>`}).join('')}</div>
  ${done?`<div class="praise">${q.ok}</div>`:tried.length?`<div class="hint">💡 ${q.hint}</div>`:''}
  <nav>${st.pi||st.qi?'<button class="btn back" id="back">← 上一題</button>':''}<button class="btn next${done?' go':''}" id="next" ${done?'':'disabled'}>${done?(lastQ&&lastP?'完成！':lastQ?'下一頁 →':'下一題 →'):'下一題 →'}</button></nav>
  ${done?'':'<p class="lock">答對了才能往下走喔！</p>'}`;
  $('say').onclick=()=>speak(sayText(p,q),true);
  card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k,b));
  $('next').onclick=()=>{if(!done)return;if(!lastQ){st.qi++;page(true);drawFig(true)}else if(!lastP){st.pi++;st.qi=0;turn()}else finish()};
  const bk=$('back');if(bk)bk.onclick=()=>{if(st.qi>0)st.qi--;else{st.pi--;st.qi=L.pages[st.pi].qs.length-1}page(true);drawFig(true)};
  if(isNew){drawFig(true);if(!done)speak(sayText(p,q))}
  progress();
}
function turn(){const ph=$('photo');ph.classList.remove('enter');void ph.offsetWidth;ph.classList.add('enter');page(true)}
const sayText=(p,q)=>(st.qi===0?'重點，'+p.key+'。':'')+q.q+'。'+q.o.map((o,i)=>`${i+1}，${o}`).join('。');
function pick(i,btn){
  const p=LESSONS[lesson].pages[st.pi],q=p.qs[st.qi],k=key(st.pi,st.qi);
  const t=st.tries[k]=st.tries[k]||[];
  if(i===q.a){
    if(!t.length){st.stars++;$('starN').textContent=st.stars;const e=$('starN').parentNode;e.classList.remove('bump');void e.offsetWidth;e.classList.add('bump')}
    st.done.add(k);tone([660,880,1175],.1);const r=btn.getBoundingClientRect();burst(60,r.left+r.width/2,r.top+r.height/2);
    page(false);drawFig(false);$('card').insertAdjacentHTML('beforeend','<div class="stamp">答對<br>了！</div>');speak(q.ok);
  }else{t.push(i);tone([220,180],.15);page(false);drawFig(false);speak(q.hint)}
}
function finish(){
  const T=total(lesson);memo[lesson]={stars:st.stars};const n=Math.max(1,Math.round(st.stars/T*5));
  $('figt').textContent='完成了！';
  $('card').innerHTML=`<span class="tag">${LESSONS[lesson].no} 練習完成！</span><p class="big">恭喜你！<br>${LESSONS[lesson].name}練習完成！</p>
  <div class="endstars">${Array.from({length:5},(_,i)=>`<span style="opacity:${i<n?1:.25}">${STAR.replace('<svg','<svg style="animation-delay:'+(i*.15)+'s"')}</span>`).join('')}</div>
  <p style="text-align:center;font-weight:900;font-size:20px;margin:0">第一次就答對：${st.stars} / ${T} 題</p>
  <nav><button class="btn back" id="again">再練一次</button><button class="btn next" id="tomenu">回選單</button></nav>`;
  $('again').onclick=()=>start(lesson);$('tomenu').onclick=()=>{location.hash='menu'};
  burst(160);tone([523,659,784,1047],.12);speak('恭喜你！練習完成！');
}

/* ---------- 聲音 ---------- */
const plain=t=>t.replace(/<span class="fr" data-s="([^"]+)">(?:<i>[^<]*<\/i>){2}<\/span>/g,'$1').replace(/<[^>]+>/g,'').replace(/[「」【】（）()]/g,' ');
function stopSpeak(){try{speechSynthesis.cancel()}catch(e){}}
function speak(t,force){try{if(!autoRead&&!force)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(plain(t).replace(/×/g,'乘以').replace(/÷/g,'除以').replace(/＝|=/g,'等於').replace(/：/g,'比').replace(/→/g,'，').replace(/？/g,'多少？'));u.lang='zh-TW';u.rate=.85;
  const v=speechSynthesis.getVoices().find(v=>/zh[-_]TW/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
let ac;function tone(fs,d){if(!sfx)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();fs.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;const t=ac.currentTime+i*d;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d*1.6);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d*1.8)})}catch(e){}}
$('readT').onclick=e=>{autoRead=!autoRead;e.currentTarget.setAttribute('aria-pressed',autoRead);if(!autoRead)stopSpeak()};
$('sfxT').onclick=e=>{sfx=!sfx;e.currentTarget.setAttribute('aria-pressed',sfx)};
$('home').onclick=()=>{location.hash='menu'};

/* ---------- 彩帶 ---------- */
const cv=$('fx'),cx=cv.getContext('2d');let parts=[],raf=0;
function fit(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}addEventListener('resize',fit);
function burst(n,x,y){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;if(cv.width!==innerWidth*devicePixelRatio)fit();
  x=x??innerWidth/2;y=y??innerHeight/3;const Cs=['#ffd93b','#1f6fb8','#21985a','#e3584b','#7cc0f5','#ff9f1c'];
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=4+Math.random()*9;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-5,r:Math.random()*6,c:Cs[i%6],s:5+Math.random()*7,l:70+Math.random()*40,star:Math.random()<.3})}
  if(!raf)raf=requestAnimationFrame(loop)}
function loop(){const d=devicePixelRatio;cx.setTransform(d,0,0,d,0,0);cx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.l-->0);parts.forEach(p=>{p.vy+=.35;p.vx*=.98;p.x+=p.vx;p.y+=p.vy;p.r+=.15;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=Math.min(1,p.l/30);cx.fillStyle=p.c;
   if(p.star){cx.beginPath();for(let k=0;k<10;k++){const rr=k%2?p.s*.45:p.s;cx.lineTo(Math.cos(k*Math.PI/5)*rr,Math.sin(k*Math.PI/5)*rr)}cx.fill()}else cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()});
  raf=parts.length?requestAnimationFrame(loop):0;if(!raf)cx.clearRect(0,0,innerWidth,innerHeight)}

addEventListener('keydown',e=>{if(lesson<0)return;if(/^[1-4]$/.test(e.key)){const b=document.querySelector(`.opt[data-k="${+e.key-1}"]:not(:disabled)`);if(b)b.click()}
  else if(e.key==='ArrowRight'){const n=$('next');if(n&&!n.disabled)n.click()}});
function route(){const m=location.hash.match(/^#lesson-([123])$/);if(m)start(+m[1]-1);else menu()}
addEventListener('hashchange',route);route();
}
</script>
