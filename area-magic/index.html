<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>面積變形魔法</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 溫暖、鼓勵、像魔法冒險遊戲，句子短、字大
   IDEA: 一本拼圖魔法書；每一頁要說出咒語（答對）才會翻到下一頁
   PICTURE: 左邊大舞台上的圖形真的被剪開、複製、旋轉、推在一起
   COLOUR and TYPE: 夜藍木框舞台、金色重點、底=藍、高=紅；Noto Sans TC 粗體
   LAYOUT: 平板橫式：舞台 58% ＋ 右側提問面板；窄螢幕上下堆疊 */
:root{color-scheme:light dark;--bg:light-dark(#efe4cf,#1a1712);--frame:light-dark(#7a5230,#5a3c22);--stage:#1f2c4d;--stage2:#2a3b66;--gold:#f6c445;--ink:light-dark(#2b1f12,#f4ead8);--card:light-dark(#fffaf0,#2a241c);--line:light-dark(#e2d3b4,#4a3f30);--base:#2f7bff;--high:#ff3b5c;--ok:#22a35a;--bad:#e0483d}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.top{display:flex;align-items:center;gap:14px;padding:10px max(3vw,14px)}
.top h1{font-size:22px;font-weight:900;margin:0;white-space:nowrap}
.dots{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--line);transition:.3s}
.dots i.done{background:var(--gold);box-shadow:0 0 0 2px #c9921b inset}
.dots i.now{background:var(--base);transform:scale(1.25)}
.snd{width:44px;height:44px;border-radius:12px;background:var(--card);border:2px solid var(--line);font-size:20px}
.wrap{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px;padding:0 max(3vw,14px) 16px;min-height:calc(100vh - 64px);min-height:calc(100dvh - 64px)}
.stageBox{background:var(--frame);border-radius:22px;padding:12px;box-shadow:0 8px 0 #4a2f18,0 14px 30px #0004;display:flex;flex-direction:column}
.stage{flex:1;border-radius:14px;background:radial-gradient(circle at 50% 40%,var(--stage2),var(--stage) 70%);position:relative;overflow:hidden;min-height:300px}
.stage svg{position:absolute;inset:0;width:100%;height:100%}
.stage .tw{position:absolute;inset:0;background-image:radial-gradient(#fff9 1px,transparent 1.5px);background-size:46px 46px;opacity:.25;pointer-events:none;animation:tw 6s linear infinite}
@keyframes tw{to{background-position:46px 46px}}
.stTitle{color:var(--gold);font-weight:900;font-size:clamp(22px,2.6vw,32px);text-align:center;padding:4px 0 10px;text-shadow:0 2px 0 #0006;line-height:1.2}
.panel{background:var(--card);border-radius:22px;border:3px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:14px}
.who{display:flex;gap:12px;align-items:flex-start}
.ava{flex:none;width:64px;height:64px;border-radius:50%;background:#ffe7a8;display:grid;place-items:center;font-size:38px;box-shadow:0 3px 0 #d9b25a}
.bub{position:relative;background:light-dark(#fff,#3a3226);border:3px solid var(--line);border-radius:18px;padding:10px 14px;font-weight:700;font-size:19px;line-height:1.45}
.bub::before{content:"";position:absolute;left:-12px;top:20px;border:9px solid transparent;border-right-color:var(--line)}
.bub.good{border-color:var(--ok)}.bub.bad{border-color:var(--bad)}
.q{font-size:22px;font-weight:900;line-height:1.4}
.q b.bl{color:var(--base)}.q b.rd{color:var(--high)}
.opts{display:grid;gap:10px}
.opt{min-height:58px;border-radius:16px;background:light-dark(#f4ecdc,#3a3226);border:3px solid var(--line);font-size:21px;font-weight:700;padding:8px 14px;text-align:left;transition:transform .15s,background .2s}
.opt:active{transform:scale(.97)}
.opt.ok{background:#d8f5e2;border-color:var(--ok);color:#135c30}
.opt.no{background:#fde0dc;border-color:var(--bad);color:#8a1f17;opacity:.75}
.shake{animation:sh .45s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.big{min-height:64px;border-radius:18px;font-size:23px;font-weight:900;padding:10px 20px;background:var(--gold);color:#3a2600;box-shadow:0 5px 0 #c9921b}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #c9921b}
.big.magic{background:linear-gradient(#7fb2ff,#3f7cf0);color:#fff;box-shadow:0 5px 0 #2a56b0}
.next{animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.ghost{background:none;border:2px solid var(--line);border-radius:12px;min-height:44px;font-size:16px;padding:6px 12px;align-self:flex-start}
.num{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.disp{min-width:110px;height:60px;border-radius:14px;border:3px solid var(--base);background:light-dark(#fff,#1d1913);font-size:32px;font-weight:900;display:grid;place-items:center;padding:0 12px}
.disp.ok{border-color:var(--ok);color:var(--ok)}
.pad{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.pad button{min-height:54px;border-radius:12px;background:light-dark(#f4ecdc,#3a3226);border:2px solid var(--line);font-size:24px;font-weight:900}
.pad .go{background:var(--ok);color:#fff;border-color:var(--ok)}
.spacer{flex:1}
.cover{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:6px}
.cover img{width:min(100%,900px);border-radius:20px;box-shadow:0 8px 0 #4a2f18,0 14px 30px #0004}
.cover p{margin:0;font-size:21px;font-weight:700;text-align:center}
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px 26px;padding:8px;max-width:760px;margin:auto;width:100%}
.mc{min-height:92px;border-radius:18px;background:#fffaf0;border:4px solid #e2d3b4;color:#2b1f12;font-size:22px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:10px;padding:8px}
.mc svg{position:static;width:110px;height:72px}
.mc.sel{border-color:var(--gold);box-shadow:0 0 0 4px #f6c44588}
.mc.m0{background:#d9f2c9;border-color:#4a9d2c}.mc.m1{background:#ffe1c2;border-color:#e0822f}.mc.m2{background:#e9ddff;border-color:#8a63d2}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.conf i{position:absolute;top:-20px;width:10px;height:16px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media(max-width:760px){.wrap{grid-template-columns:1fr}.stage{min-height:260px;aspect-ratio:400/270}.top h1{font-size:18px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>
<div class="top"><h1>🪄 面積變形魔法</h1><div class="dots" id="dots"></div><button class="snd" id="snd" aria-label="聲音開關">🔊</button></div>
<main class="wrap" id="app"></main>
<div class="conf" id="conf"></div>

const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep=ms=>new Promise(r=>setTimeout(r,RM?Math.min(ms,60):ms));
const $=s=>document.querySelector(s);
let sound=true,actx=null;
function tone(fs,d=.12,type='sine'){if(!sound)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();let t=actx.currentTime;fs.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.18,t+i*d);g.gain.exponentialRampToValueAtTime(.001,t+i*d+d*1.8);o.connect(g).connect(actx.destination);o.start(t+i*d);o.stop(t+i*d+d*2)})}catch(e){}}
const good=()=>tone([660,880,1175]),bad=()=>tone([220,180],.16,'triangle'),magic=()=>tone([523,659,784,1046,1318],.07);
$('#snd').onclick=()=>{sound=!sound;$('#snd').textContent=sound?'🔊':'🔇'};

const P=(pts,fill,extra='')=>`<polygon points="${pts}" fill="${fill}" stroke="#fff8" stroke-width="2" stroke-linejoin="round" ${extra}/>`;
const base=(x1,y,x2,id='')=>`<line ${id?`id="${id}"`:''} x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="#2f7bff" stroke-width="8" stroke-linecap="round"/>`;
const high=(x,y1,y2,id='')=>`<g ${id?`id="${id}"`:''}><line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="#ff3b5c" stroke-width="5" stroke-dasharray="12 8"/><path d="M${x} ${y2-14}h14v14" fill="none" stroke="#ff3b5c" stroke-width="3"/></g>`;
const T=(x,y,s,c='#fff',sz=18,id='')=>`<text ${id?`id="${id}"`:''} x="${x}" y="${y}" fill="${c}" font-size="${sz}" font-weight="900" text-anchor="middle" paint-order="stroke" stroke="#1f2c4d" stroke-width="4">${s}</text>`;
const tween=(dur,fn)=>new Promise(r=>{if(RM){fn(1);return r()}const t0=performance.now();const f=t=>{let k=Math.min(1,(t-t0)/dur);k=k<.5?2*k*k:1-(-2*k+2)**2/2;fn(k);k<1?requestAnimationFrame(f):r()};requestAnimationFrame(f)});
const anim=(el,kf,dur)=>{if(!el)return Promise.resolve();const a=el.animate(kf,{duration:RM?1:dur,fill:'forwards',easing:'cubic-bezier(.5,0,.3,1)'});return a.finished.catch(()=>{})};
const show=(id,dur=500)=>anim($('#'+id),[{opacity:0},{opacity:1}],dur);
const drawIn=async(sel,dur=700)=>{const el=$(sel);if(!el)return;const L=el.getTotalLength?el.getTotalLength():300;el.style.strokeDasharray=L;el.style.strokeDashoffset=L;el.style.opacity=1;await tween(dur,k=>el.style.strokeDashoffset=L*(1-k))};
const sparkle=async(x,y)=>{const s=$('#stg svg');if(!s)return;const ns='http://www.w3.org/2000/svg';for(let i=0;i<10;i++){const c=document.createElementNS(ns,'circle');c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',4);c.setAttribute('fill',i%2?'#f6c445':'#fff');s.appendChild(c);const a=Math.PI*2*i/10;anim(c,[{transform:'translate(0,0)',opacity:1},{transform:`translate(${Math.cos(a)*60}px,${Math.sin(a)*60}px)`,opacity:0}],700).then(()=>c.remove())}};

const M=[{n:'平行四邊形',f:'底 × 高',svg:'<svg viewBox="0 0 110 72"><polygon points="8,64 78,64 102,8 32,8" fill="#7cc35a"/></svg>'},

/* ---------- 流程引擎 ---------- */
let si=0,qi=0,firstTry=0,totalQ=0,tried=false;
const lessons=S.filter(s=>!s.cover&&!s.end).length;
function dots(){$('#dots').innerHTML=S.map((s,i)=>s.cover||s.end?'':`<i class="${i<si?'done':i===si?'now':''}"></i>`).join('')}
function go(i){si=i;qi=0;dots();$('#conf').innerHTML='';const s=S[i];scrollTo(0,0);
 if(s.cover){$('#app').innerHTML=`<section class="cover"><img src="${COVER}" alt="圖形的變形魔法：面積大解密"><p>只要學會兩招魔法，所有形狀都能輕鬆破解！<br>每一關答對了，才能進到下一關喔！</p><button class="big next" id="start">開始冒險 ➜</button></section>`;$('#start').onclick=()=>{firstTry=totalQ=0;go(1)};return}
 if(s.end)return ending();
 if(s.match)return matching(s);
 $('#app').innerHTML=`<section class="stageBox"><div class="stTitle">${s.t}</div><div class="stage" id="stg"><div class="tw"></div><svg viewBox="${s.sv||'0 0 400 260'}">${s.svg}</svg></div></section><section class="panel"><div class="who"><div class="ava">${s.ava}</div><div class="bub" id="bub">${s.say}</div></div><div id="qa" style="display:flex;flex-direction:column;gap:12px"></div><div class="spacer"></div><div id="foot"></div></section>`;
 (async()=>{if(s.intro)await s.intro();
  if(s.act){$('#qa').innerHTML=`<button class="big magic next" id="actb">${s.act.label}</button>`;$('#actb').onclick=async()=>{$('#qa').innerHTML='';await s.act.run();replayBtn(s);ask()}}else ask()})()}
function replayBtn(s){$('#foot').innerHTML=`<button class="ghost" id="rp">↻ 再看一次魔法</button>`;$('#rp').onclick=async()=>{const sv=$('#stg svg');sv.innerHTML=s.svg;$('#rp').disabled=true;await s.act.run();$('#rp').disabled=false}}
function say(t,c=''){const b=$('#bub');b.className='bub '+c;b.innerHTML=t}
function ask(){const s=S[si],q=s.qs[qi];tried=false;totalQ++;
 const box=$('#qa');box.innerHTML=`<div class="q">${s.qs.length>1?`<small>（${qi+1}/${s.qs.length}）</small> `:''}${q.q}</div>`;
 if(q.type==='num'){box.insertAdjacentHTML('beforeend',`<div class="num"><div class="disp" id="disp"></div></div><div class="pad">${[1,2,3,4,5,6,7,8,9,0].map(n=>`<button data-n="${n}">${n}</button>`).join('')}<button data-n="del" aria-label="刪除">⌫</button><button class="go" data-n="ok" style="grid-column:span 4">確定 ✓</button></div>`);
  let v='';const d=$('#disp');
  box.querySelectorAll('.pad button').forEach(b=>b.onclick=()=>{const n=b.dataset.n;if(n==='del')v=v.slice(0,-1);else if(n==='ok'){if(!v)return;if(!check(+v===q.a,q,d)){v='';setTimeout(()=>d.textContent='',600);return}}else if(v.length<3)v+=n;d.textContent=v})}
 else{box.insertAdjacentHTML('beforeend',`<div class="opts">${q.o.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div>`);
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(b.classList.contains('no'))return;const ok=+b.dataset.i===q.a;if(ok)b.classList.add('ok');else b.classList.add('no');check(ok,q,b)})}}
const praise=['答對了！太厲害了！','魔法成功！✨','完全正確！你好棒！','沒錯！咒語唸對了！'];
function check(ok,q,el){if(ok){if(!tried)firstTry++;good();el.classList.add('ok');say(praise[Math.floor(Math.random()*praise.length)],'good');$('#qa').querySelectorAll('button').forEach(b=>b.disabled=true);
  const s=S[si];if(qi<s.qs.length-1){setTimeout(()=>{qi++;ask()},1100)}else{const nb=document.createElement('button');nb.className='big next';nb.textContent=si===S.length-2?'看看我的成績 ➜':'下一關 ➜';nb.onclick=()=>go(si+1);$('#qa').appendChild(nb);nb.scrollIntoView({block:'nearest',behavior:'smooth'})}return ok}
 else{tried=true;bad();el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');say('再想一想 🤔 '+q.hint,'bad')}return ok}
function matching(s){
 const order=[0,1,2].sort(()=>Math.random()-.5);let sel=null,done=0;totalQ++;tried=false;
 $('#app').innerHTML=`<section class="stageBox" style="grid-column:1/-1"><div class="stTitle">${s.t}</div><div class="stage" style="display:flex;flex-direction:column;gap:12px;padding:14px"><div class="who" style="max-width:760px;margin:0 auto;width:100%"><div class="ava">${s.ava}</div><div class="bub" id="bub">${s.say}</div></div><div class="match">${[0,1,2].map(r=>`<button class="mc" data-s="${r}">${M[r].svg}${M[r].n}</button><button class="mc" data-f="${order[r]}">${M[order[r]].f}</button>`).join('')}</div><div id="qa" style="text-align:center"></div></div></section>`;
 document.querySelectorAll('.mc[data-s]').forEach(b=>b.onclick=()=>{if(b.dataset.m)return;document.querySelectorAll('.mc[data-s]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=+b.dataset.s;tone([520],.05)});
 document.querySelectorAll('.mc[data-f]').forEach(b=>b.onclick=()=>{if(b.dataset.m)return;if(sel===null){say('先點左邊的一個形狀喔！','bad');return}
  const sb=$(`.mc[data-s="${sel}"]`);if(+b.dataset.f===sel){good();sb.classList.remove('sel');sb.classList.add('m'+sel);b.classList.add('m'+sel);sb.dataset.m=b.dataset.m=1;done++;sel=null;say(`${M[+b.dataset.f].n}的咒語：${M[+b.dataset.f].f}！`,'good');
   if(done===3){if(!tried)firstTry++;say('全部配對成功！你已經是面積魔法師了！','good');$('#qa').innerHTML='<button class="big next" id="fin">看看我的成績 ➜</button>';$('#fin').onclick=()=>go(si+1)}}
  else{tried=true;bad();b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');say('再想一想 🤔 '+(sel===0?'平行四邊形用剪刀變成長方形，不用除以 2。':sel===1?'三角形用魔鏡複製了一個，要除以 2。':'梯形有上底和下底，要先把它們加起來。'),'bad')}})}
function ending(){const st=totalQ?Math.round(firstTry/totalQ*3+.49):3;
 $('#app').innerHTML=`<section class="cover"><img src="${END}" alt="你已經是面積魔法師了！"><p style="font-size:44px;letter-spacing:6px">${'⭐'.repeat(Math.max(1,Math.min(3,st)))}</p><p>一次就答對：${firstTry} / ${totalQ} 題<br>下次看到奇怪的形狀不要怕！找找<b style="color:#2f7bff">藍色的底</b>和<b style="color:#ff3b5c">紅色的高</b>，拿出 ✂️ 和 🪞！</p><button class="big" id="again">↻ 再玩一次</button></section>`;
 $('#again').onclick=()=>go(0);tone([523,659,784,1046,784,1046],.12);
 const c=$('#conf');c.innerHTML='';const col=['#f6c445','#2f7bff','#ff3b5c','#7cc35a','#a47de0','#ff9a3d'];if(!RM)for(let i=0;i<70;i++){const e=document.createElement('i');e.style.left=Math.random()*100+'vw';e.style.background=col[i%6];e.style.animationDuration=2+Math.random()*2+'s';e.style.animationDelay=Math.random()*1.2+'s';c.appendChild(e)}setTimeout(()=>c.innerHTML='',5000)}
go(0);
}
