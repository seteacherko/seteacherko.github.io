<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>構音練習室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.26.0/dist/index.js"></script>
<style>
/* 版面：首頁＝依發音部位分組的注音卡；練習＝單一大字卡＋回饋區；紀錄＝摘要→聲母格→趨勢圖→練習清單 */
:root{
  --paper:#EEF3F2; --surface:#FFFFFF; --sunk:#F5F8F8; --ink:#17262E; --muted:#5A6B73; --line:#D3DEDD;
  --teal:#0E6E66; --teal-ink:#FFFFFF; --teal-soft:#DCEFEC;
  --zhu:#C2410C; --zhu-soft:#FCE9DF; --star:#E0A100; --star-soft:#FFF3CC; --star-ink:#7A5A00;
  --tongue:#E58C92; --tongue-edge:#B4545E; --lip:#E8A595; --lip-edge:#B56C5E;
  --ok:#157A3C; --ok-soft:#DDF2E4; --warn:#A35A06; --warn-soft:#FBEFD9; --bad:#B42318; --bad-soft:#FBE3E0; --none:#8A989E;
  --f-word:"LXGW WenKai TC","Kaiti TC","BiauKai","DFKai-SB","Noto Serif TC",serif;
  --f-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0F1719; --surface:#172225; --sunk:#1C292C; --ink:#E5EEEE; --muted:#9AAEB2; --line:#2C3D41;
  --teal:#3FB8AA; --teal-ink:#06201D; --teal-soft:#183A37;
  --zhu:#F2894E; --zhu-soft:#3A2418; --star:#F4C542; --star-soft:#3A3114; --star-ink:#F4C542;
  --tongue:#C9656E; --tongue-edge:#F09AA2; --lip:#B9786C; --lip-edge:#E3A396;
  --ok:#5CCB84; --ok-soft:#173424; --warn:#E9A94B; --warn-soft:#3A2B14; --bad:#F2796D; --bad-soft:#3E1D1A; --none:#6F8086;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --paper:#0F1719; --surface:#172225; --sunk:#1C292C; --ink:#E5EEEE; --muted:#9AAEB2; --line:#2C3D41;
  --teal:#3FB8AA; --teal-ink:#06201D; --teal-soft:#183A37;
  --zhu:#F2894E; --zhu-soft:#3A2418; --star:#F4C542; --star-soft:#3A3114; --star-ink:#F4C542;
  --tongue:#C9656E; --tongue-edge:#F09AA2; --lip:#B9786C; --lip-edge:#E3A396;
  --ok:#5CCB84; --ok-soft:#173424; --warn:#E9A94B; --warn-soft:#3A2B14; --bad:#F2796D; --bad-soft:#3E1D1A; --none:#6F8086;
  color-scheme:dark; }

*{box-sizing:border-box}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.5em .7em;min-height:44px}
h1,h2,h3{text-wrap:balance;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px;display:grid;gap:18px}
.eyebrow{font-size:.78rem;letter-spacing:.12em;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.5em 1.1em;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:.4em;min-height:44px}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.btn.small{min-height:36px;padding:.25em .9em;font-size:.9rem}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* 上方列 */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .in{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--f-word);font-weight:700;font-size:1.35rem;letter-spacing:.06em;margin-right:auto}
.brand span{color:var(--zhu)}
.stu{display:flex;gap:6px;align-items:center}
.stu select{min-width:8em}
.starcount{font-weight:700;color:var(--star-ink);font-variant-numeric:tabular-nums;white-space:nowrap}

/* 首頁 */
.hello{display:flex;justify-content:space-between;gap:12px;align-items:end;flex-wrap:wrap}
.hello h1{font-family:var(--f-word);font-size:clamp(1.8rem,4vw,2.4rem)}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;align-content:start}
.group h2{font-size:1.1rem;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.group h2 small{font-weight:400;color:var(--muted);font-size:.8rem}
.group p{margin:0;font-size:.86rem;color:var(--muted)}
.phs{display:flex;flex-wrap:wrap;gap:8px}
.ph{width:78px;height:86px;border-radius:14px;border:1px solid var(--line);background:var(--sunk);display:grid;place-items:center;align-content:center;gap:2px;padding:4px}
.ph b{font-family:var(--f-word);font-size:2.1rem;line-height:1;color:var(--zhu)}
.ph span{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ph:hover{border-color:var(--teal)}
.ph.g3{background:var(--ok-soft);border-color:var(--ok)} .ph.g3 span{color:var(--ok)}
.ph.g2{background:var(--warn-soft);border-color:var(--warn)} .ph.g2 span{color:var(--warn)}
.ph.g1{background:var(--bad-soft);border-color:var(--bad)} .ph.g1 span{color:var(--bad)}
.settings{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;gap:10px 22px;flex-wrap:wrap;align-items:center;font-size:.92rem}
.settings label{display:flex;gap:8px;align-items:center}
.settings input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--teal)}
.settings select{min-height:36px;padding:.2em .5em}
.notice{padding:10px 14px;border-radius:12px;font-size:.9rem}
.notice.bad{background:var(--warn-soft);color:var(--warn)}
.inline-form{display:flex;gap:6px;flex-wrap:wrap}

/* 練習 */
.stage{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.stage{grid-template-columns:1fr}}
.dots{display:flex;gap:8px;align-items:center}
.dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:1rem;background:var(--surface)}
.dot.cur{border-color:var(--teal)}
.dot.s1{background:var(--star-soft);border-color:var(--star)}
.dot.s2{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.dot.s3{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px;display:grid;gap:12px;justify-items:center;align-content:center;min-height:460px;position:relative;overflow:hidden}
.card .tag{position:absolute;top:14px;left:16px;display:flex;gap:8px;align-items:center}
.card .tag b{font-family:var(--f-word);font-size:1.6rem;color:var(--zhu);background:var(--zhu-soft);border-radius:10px;padding:0 10px}
.pic{font-size:clamp(4.5rem,13vw,7.5rem);line-height:1.1;min-height:1.1em}
.word{font-family:var(--f-word);font-size:clamp(3rem,10vw,5.6rem);font-weight:700;letter-spacing:.08em;line-height:1.5;text-align:center}
.word rt{font-family:var(--f-ui);font-size:.3em;color:var(--muted);letter-spacing:0;font-weight:500}
.word .tg{color:var(--zhu)}
.word .tg rt{color:var(--zhu)}
.actions{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap}
.listen{width:72px;height:72px;border-radius:50%;border:1px solid var(--line);background:var(--sunk);display:grid;place-items:center}
.listen svg{width:30px;height:30px}
.mic{width:120px;height:120px;border-radius:50%;border:none;background:var(--teal);color:var(--teal-ink);display:grid;place-items:center;position:relative;box-shadow:0 8px 20px -10px var(--teal)}
.mic svg{width:48px;height:48px}
.mic.on{background:var(--zhu)}
.mic.on::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--zhu);animation:pulse 1.2s ease-out infinite}
@keyframes pulse{from{transform:scale(.9);opacity:1}to{transform:scale(1.25);opacity:0}}
.mic:disabled{background:var(--none);box-shadow:none}
.hint{color:var(--muted);min-height:1.6em;text-align:center}
.burst{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-size:7rem;animation:pop .9s ease-out forwards}
@keyframes pop{0%{transform:scale(.3);opacity:0}40%{transform:scale(1.1);opacity:1}100%{transform:scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){.mic.on::after,.burst{animation:none}.burst{opacity:0}}

.fb{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px;display:grid;gap:12px;align-content:start}
.say{border-radius:16px;padding:14px 16px;display:grid;gap:6px}
.say.idle{background:var(--sunk);color:var(--muted)}
.say.ok{background:var(--ok-soft);color:var(--ok)}
.say.err{background:var(--bad-soft);color:var(--bad)}
.say.wait{background:var(--warn-soft);color:var(--warn)}
.say h3{font-size:1.5rem;font-family:var(--f-word)}
.say .heard{font-family:var(--f-word);font-size:1.25rem;color:var(--ink)}
.say .heard small{font-family:var(--f-ui);font-size:.8rem;color:var(--muted)}
.compare{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:1rem;color:var(--ink)}
.compare .z{font-family:var(--f-word);font-size:2rem;font-weight:700;border-radius:10px;padding:0 10px;line-height:1.4}
.compare .z.t{background:var(--ok-soft);color:var(--ok)}
.compare .z.p{background:var(--bad-soft);color:var(--bad);text-decoration:line-through;text-decoration-thickness:2px}
.tip{background:var(--zhu-soft);border-radius:14px;padding:12px 14px;display:grid;gap:4px;font-size:1.02rem}
.tip b{color:var(--zhu)}
.tries{font-size:.88rem;color:var(--muted)}
.teacher{border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:8px}
.teacher .row .btn{flex:1 1 auto}
.navrow{display:flex;gap:10px}
.navrow .btn.primary{flex:1;font-size:1.05rem;min-height:52px}

/* 回合結果 */
.done{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:24px;display:grid;gap:16px;justify-items:center;text-align:center}
.done h1{font-family:var(--f-word);font-size:clamp(2rem,5vw,2.8rem)}
.bigstars{font-size:2.6rem;letter-spacing:.1em}
.bigstars .off{filter:grayscale(1);opacity:.25}
.rlist{width:100%;max-width:640px;display:grid;gap:8px;text-align:left}
.ritem{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--sunk)}
.ritem .ic{font-size:1.6rem;text-align:center}
.ritem .w{font-family:var(--f-word);font-size:1.4rem}
.ritem .d{font-size:.85rem;color:var(--muted)}
.ritem .st{font-size:.85rem;font-weight:700;white-space:nowrap}
.st.s1{color:var(--star-ink)} .st.s2{color:var(--ok)} .st.s3{color:var(--bad)}

/* 紀錄 */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:2px}
.tile .n{font-size:1.8rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.tile .n small{font-size:.5em;color:var(--muted);font-weight:400}
.tile .k{font-size:.82rem;color:var(--muted)}
.sect{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.sect h2{font-size:1.08rem;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.sect h2 small{font-size:.8rem;color:var(--muted);font-weight:400}
.phgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:6px}
.pc{border-radius:12px;border:1px solid var(--line);background:var(--sunk);padding:6px 4px;display:grid;justify-items:center;gap:0}
.pc b{font-family:var(--f-word);font-size:1.5rem;line-height:1.2}
.pc span{font-size:.72rem;font-variant-numeric:tabular-nums;color:var(--muted)}
.pc.g3{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)} .pc.g3 span{color:var(--ok)}
.pc.g2{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)} .pc.g2 span{color:var(--warn)}
.pc.g1{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)} .pc.g1 span{color:var(--bad)}
.pc.sel{outline:3px solid var(--teal);outline-offset:1px}
.detail{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.detail{grid-template-columns:1fr}}
.chart{position:relative;min-width:0}
.chart svg{width:100%;height:auto;display:block}
.chart .ax{fill:var(--muted);font-size:12px;font-family:var(--f-ui)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{stroke:var(--teal);stroke-width:2;fill:none}
.chart .area{fill:var(--teal);opacity:.10}
.chart .pt{fill:var(--teal);stroke:var(--surface);stroke-width:2}
.chart .pt.last{r:6}
.chart .lbl{fill:var(--ink);font-size:13px;font-weight:700;font-family:var(--f-ui)}
.tipbox{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font-size:.82rem;padding:6px 10px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-115%)}
.facts{display:grid;gap:10px;align-content:start}
.facts h3{font-size:.9rem;color:var(--muted);font-weight:500}
.facts ul{margin:0;padding-left:1.1em;display:grid;gap:2px}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{border-bottom:1px solid var(--line);padding:8px 8px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500;white-space:nowrap;font-size:.84rem}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
td .w{font-family:var(--f-word);font-size:1.05rem}
details summary{cursor:pointer;color:var(--teal)}
.chipline{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.wchip{border-radius:8px;padding:2px 8px;font-size:.85rem;border:1px solid var(--line);background:var(--sunk)}
.wchip.s1{border-color:var(--star);background:var(--star-soft)}
.wchip.s2{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.wchip.s3{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.confirm{background:var(--bad-soft);border-radius:12px;padding:10px 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.mouth{width:100%;max-width:360px;justify-self:center}
.mouth-svg{width:100%;height:auto;display:block}
.m-cav{fill:var(--sunk)}
.m-skin-line,.m-wall{fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.m-palate{fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round}
.m-velum{fill:none;stroke:var(--ink);stroke-width:7;stroke-linecap:round;opacity:.75}
.m-tongue{fill:var(--tongue);stroke:var(--tongue-edge);stroke-width:2}
.m-ghost{fill:none;stroke:var(--bad);stroke-width:2.5;stroke-dasharray:5 4}
.m-tooth{fill:var(--surface);stroke:var(--muted);stroke-width:1.5}
.m-lip{fill:var(--lip);stroke:var(--lip-edge);stroke-width:1.5}
.m-contact{fill:none;stroke:var(--ok);stroke-width:3}
.m-flow{fill:none;stroke:var(--teal);stroke-width:3;stroke-dasharray:6 7;stroke-linecap:round;animation:mflow .6s linear infinite}
.m-flow.nasal{stroke:var(--zhu)}
@keyframes mflow{to{stroke-dashoffset:-13}}
.m-puff path{stroke:var(--teal);stroke-width:3;stroke-linecap:round;fill:none}
.m-vib path{stroke:var(--zhu);stroke-width:2.5;fill:none;stroke-linecap:round}
.m-tag{font:700 15px var(--f-ui);fill:var(--ink)}
.m-tag2{font:400 11px var(--f-ui);fill:var(--muted)}
@media (prefers-reduced-motion:reduce){.m-flow{animation:none}}

.tip.withmouth{grid-template-columns:minmax(0,1fr)}
.mouthbtn{width:72px;height:72px;border-radius:50%;border:1px solid var(--line);background:var(--sunk);display:grid;place-items:center;font-size:.8rem;gap:0;line-height:1.1}
.mouthbtn b{font-size:1.5rem}
.mictest{padding:10px 14px;border-radius:12px;font-size:.92rem;background:var(--sunk)}
.mictest.ok{background:var(--ok-soft);color:var(--ok)}
.mictest.bad{background:var(--warn-soft);color:var(--warn)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:99px;z-index:30;font-size:.92rem}
</style>
</head>
<body>

<div class="bar"><div class="in">
  <a href="../" class="btn small" aria-label="回潛能教室首頁" style="text-decoration:none">← 首頁</a>
  <div class="brand">構音<span>練習室</span></div>
  <div class="stu"><label for="stuSel" class="muted" style="font-size:.85rem">學生</label><select id="stuSel"></select><button class="btn small" type="button" id="btnAddStu">＋</button></div>
  <span class="starcount" id="starCount" title="累積星星"></span>
  <button class="btn small" type="button" id="navHome">練習</button>
  <button class="btn small" type="button" id="navLog">學習紀錄</button>
</div></div>

<!-- 首頁 -->
<section id="scr-home"><div class="wrap">
  <div id="addStuBox" class="settings" hidden>
    <div class="inline-form"><input id="newStu" placeholder="學生姓名或代號" autocomplete="off" enterkeyhint="done"><button class="btn primary" type="button" id="okStu">新增</button><button class="btn" type="button" id="cancelStu">取消</button></div>
  </div>
  <div class="hello">
    <div><div class="eyebrow">選一個注音開始</div><h1 id="helloName">今天要練哪個音？</h1></div>
    <div class="muted" style="font-size:.85rem">每次隨機 5 個語詞・答對過關・說錯聽示範再試</div>
  </div>
  <div id="srNotice" class="notice bad" hidden></div>
  <div class="groups" id="groups"></div>
  <div class="settings">
    <label>每個詞最多試<select id="sMax"><option value="2">2 次</option><option value="3" selected>3 次</option><option value="5">5 次</option></select></label>
    <label><input type="checkbox" id="sZy" checked>國字加注音</label>
    <label><input type="checkbox" id="sPic" checked>顯示圖片</label>
    <label><input type="checkbox" id="sModel">每題先播示範</label>
    <label><input type="checkbox" id="sAuto" checked>說錯時自動播正確讀音</label>
    <button class="btn small" type="button" id="btnMicTest">🎤 測試麥克風</button>
  </div>
  <div id="micTestOut" class="mictest" hidden></div>

<script>
/* ===== 判讀引擎：拼音→注音、對齊比對、音韻歷程 ===== */
const INI = ['zh','ch','sh','b','p','m','f','d','t','n','l','g','k','h','j','q','x','r','z','c','s'];
const INI_ZY = {b:'ㄅ',p:'ㄆ',m:'ㄇ',f:'ㄈ',d:'ㄉ',t:'ㄊ',n:'ㄋ',l:'ㄌ',g:'ㄍ',k:'ㄎ',h:'ㄏ',j:'ㄐ',q:'ㄑ',x:'ㄒ',zh:'ㄓ',ch:'ㄔ',sh:'ㄕ',r:'ㄖ',z:'ㄗ',c:'ㄘ',s:'ㄙ'};
const FIN_ZY = {'':'',a:'ㄚ',o:'ㄛ',e:'ㄜ','ê':'ㄝ',eh:'ㄝ',ai:'ㄞ',ei:'ㄟ',ao:'ㄠ',ou:'ㄡ',an:'ㄢ',en:'ㄣ',ang:'ㄤ',eng:'ㄥ',er:'ㄦ',ong:'ㄨㄥ',
  i:'ㄧ',ia:'ㄧㄚ',io:'ㄧㄛ',ie:'ㄧㄝ',iao:'ㄧㄠ',iou:'ㄧㄡ',ian:'ㄧㄢ',in:'ㄧㄣ',iang:'ㄧㄤ',ing:'ㄧㄥ',iong:'ㄩㄥ',
  u:'ㄨ',ua:'ㄨㄚ',uo:'ㄨㄛ',uai:'ㄨㄞ',uei:'ㄨㄟ',uan:'ㄨㄢ',uen:'ㄨㄣ',uang:'ㄨㄤ',ueng:'ㄨㄥ',
  v:'ㄩ',ve:'ㄩㄝ',van:'ㄩㄢ',vn:'ㄩㄣ'};
const YW = {yi:'i',ya:'ia',yo:'io',ye:'ie',yao:'iao',you:'iou',yan:'ian',yin:'in',yang:'iang',ying:'ing',yong:'iong',
  yu:'v',yue:'ve',yuan:'van',yun:'vn',wu:'u',wa:'ua',wo:'uo',wai:'uai',wei:'uei',wan:'uan',wen:'uen',wang:'uang',weng:'ueng'};
const TONE = {'1':'','2':'ˊ','3':'ˇ','4':'ˋ','0':'˙','5':'˙'};

function parsePy(raw){
  let s = String(raw||'').toLowerCase().replace(/ü/g,'v').trim();
  const m = s.match(/^([a-zê]+)([0-5])?$/);
  if(!m) return null;
  let base = m[1], tone = m[2]||'0';
  let ini = '', fin = base;
  if(['n','ng','m','hm','hng'].includes(base)) { fin = base==='m'||base==='hm' ? 'u' : (base==='n'?'en':'eng'); }
  else if(YW[base] !== undefined) fin = YW[base];
  else {
    for(const c of INI){ if(base.startsWith(c)){ ini=c; fin=base.slice(c.length); break; } }
    if('jqx'.includes(ini) && ini && fin.startsWith('u')) fin = 'v'+fin.slice(1);
    if(['zh','ch','sh','r','z','c','s'].includes(ini) && fin==='i') fin='';
    if(fin==='iu') fin='iou'; else if(fin==='ui') fin='uei'; else if(fin==='un') fin='uen';
  }
  const iz = ini ? INI_ZY[ini] : '';
  const fz = FIN_ZY[fin] !== undefined ? FIN_ZY[fin] : fin;
  const t = TONE[tone]||'';
  const zy = tone==='0'||tone==='5' ? '˙'+iz+fz : iz+fz+t;
  return { ini: iz, fin: fz, key: iz+'|'+fz, zy };
}

/* 把辨識文字轉成音節陣列（只取漢字） */
function textToSyl(text, pyFn){
  const chars = Array.from(String(text||'')).filter(c=>/\p{Script=Han}/u.test(c));
  if(!chars.length) return [];
  let pys = [];
  try { pys = pyFn(chars.join('')); } catch(e){ pys = []; }
  return chars.map((c,i)=>({ ch:c, ...(parsePy(pys[i])||{ini:'?',fin:'?',key:'?',zy:'?'}) }));
}
function targetSyl(word, py){
  const chars = Array.from(word), ps = py.split(' ');
  return chars.map((c,i)=>({ ch:c, ...parsePy(ps[i]) }));
}

/* 音節對齊（編輯距離） */
function align(T, P){
  const n=T.length, m=P.length, INF=1e9;
  const cost=(a,b)=> a.ch===b.ch||a.key===b.key ? 0 : (a.ini===b.ini ? 0.4 : (a.fin===b.fin ? 0.6 : 1));
  const D=Array.from({length:n+1},()=>Array(m+1).fill(INF));
  D[0][0]=0;
  for(let i=0;i<=n;i++)for(let j=0;j<=m;j++){
    if(i&&j) D[i][j]=Math.min(D[i][j], D[i-1][j-1]+cost(T[i-1],P[j-1]));
    if(i) D[i][j]=Math.min(D[i][j], D[i-1][j]+1);
    if(j) D[i][j]=Math.min(D[i][j], D[i][j-1]+ ((i===0||i===n)?0.2:1)); // 頭尾多說的字（如「這是…」）幾乎不扣
  }
  const ops=[]; let i=n,j=m;
  while(i>0||j>0){
    if(i&&j && Math.abs(D[i][j]-(D[i-1][j-1]+cost(T[i-1],P[j-1])))<1e-9){ ops.push({t:i-1,p:j-1}); i--; j--; }
    else if(i && Math.abs(D[i][j]-(D[i-1][j]+1))<1e-9){ ops.push({t:i-1,p:-1}); i--; }
    else { ops.push({t:-1,p:j-1,edge:(i===0||i===n)}); j--; }
  }
  return ops.reverse();
}

/* 詞彙判讀 */
function judgeWord(item, heardText, pyFn){
  const T = targetSyl(item.w, item.py), P = textToSyl(heardText, pyFn);
  if(!P.length) return { v:'none' };
  const ops = align(T,P);
  const byT = {}; ops.forEach(o=>{ if(o.t>=0) byT[o.t]=o; });
  let v='ok', prod='', note=[], finErr=null;
  for(const k of item.t){
    const o=byT[k], ts=T[k];
    if(!o || o.p<0){ v='omit'; note.push('「'+ts.ch+'」音節沒有說出'); prod='∅'; break; }
    const ps=P[o.p];
    if(ps.ch===ts.ch || ps.ini===ts.ini){
      if(ps.ch!==ts.ch && ps.fin!==ts.fin){ finErr={t:ts.fin,p:ps.fin,ch:ts.ch}; note.push('「'+ts.ch+'」韻母聽起來像 '+ps.zy); }
      continue;
    }
    if(ps.ini===''){ v='omit'; prod='∅'; note.push('「'+ts.ch+'」聲母省略，聽起來像 '+ps.zy); break; }
    v='sub'; prod=ps.ini; note.push('「'+ts.ch+'」'+ts.zy+' → '+ps.zy); break;
  }
  const whole = ops.every(o=> o.t<0 ? o.edge : (o.p>=0 && (T[o.t].ch===P[o.p].ch || T[o.t].key===P[o.p].key)));
  if(v==='ok' && !whole && !finErr){
    const others = ops.filter(o=>o.t>=0 && !item.t.includes(o.t) && (o.p<0 || (T[o.t].ch!==P[o.p].ch && T[o.t].key!==P[o.p].key)));
    if(others.length) note.push('目標音正確；其他字有差異：'+others.map(o=>o.p<0?('「'+T[o.t].ch+'」未說'):(T[o.t].ch+'→'+P[o.p].zy)).join('、'));
  }
  return { v, prod, note:note.join('；'), finErr, heardZy:P.map(s=>s.zy).join(' ') };
}

/* 韻母判讀 */
const VOWEL_ACCEPT = { 'ㄛ':['ㄛ','ㄨㄛ'], 'ㄝ':['ㄝ'], 'ㄥ':['ㄥ'] };
const VOWEL_CHARS = { 'ㄝ':['欸','誒'], 'ㄛ':['喔','噢','哦'], 'ㄥ':['嗯','鞥'] };
const VOWEL_SHAKY = ['ㄛ','ㄝ','ㄥ'];
function judgeVowel(item, heardText, pyFn){
  const P = textToSyl(heardText, pyFn);
  if(!P.length) return { v:'none' };
  const s = P[0], target = item.w;
  const acc = VOWEL_ACCEPT[target] || [target];
  if((VOWEL_CHARS[target]||[]).includes(s.ch) || (s.ini==='' && acc.includes(s.fin))) return { v:'ok', prod:'', note:'', heardZy:s.zy };
  if(s.ini!=='' && acc.includes(s.fin)) return { v:'add', prod:s.ini, note:'韻母正確，但前面多了聲母 '+s.ini+'（聽起來像 '+s.zy+'）', heardZy:s.zy };
  return { v:'sub', prod:s.fin||s.ini, note:target+' → '+s.zy, heardZy:s.zy };
}

/* 短句判讀 */
function judgeSentence(item, heardText, pyFn){
  const T = targetSyl(item.w, item.py), P = textToSyl(heardText, pyFn);
  if(!P.length) return { v:'none' };
  const ops = align(T,P), errs=[];
  for(const o of ops){
    if(o.t<0){ if(!o.edge) errs.push({type:'add', ch:'', p:P[o.p].zy}); continue; }
    const ts=T[o.t];
    if(o.p<0){ errs.push({type:'omit', ch:ts.ch, t:ts.zy}); continue; }
    const ps=P[o.p];
    if(ps.ch===ts.ch || ps.key===ts.key) continue;
    if(ps.ini!==ts.ini) errs.push({type: ps.ini===''?'omitIni':'sub', ch:ts.ch, t:ts.zy, p:ps.zy, ti:ts.ini, pi:ps.ini});
    else errs.push({type:'fin', ch:ts.ch, t:ts.zy, p:ps.zy, tf:ts.fin, pf:ps.fin});
  }
  const txt = errs.map(e=> e.type==='omit' ? '「'+e.ch+'」未說' : e.type==='add' ? '多說 '+e.p : '「'+e.ch+'」'+e.t+'→'+e.p).join('、');
  return { v: errs.length?'err':'ok', errs, note: txt, heardZy:P.map(s=>s.zy).join(' ') };
}

/* 音韻歷程分類 */
const G = {
  stop:'ㄅㄆㄉㄊㄍㄎ', fric:'ㄈㄏㄒㄙㄕㄖ', affr:'ㄐㄑㄗㄘㄓㄔ', velar:'ㄍㄎㄏ', alv:'ㄉㄊㄋㄌ',
  dent:'ㄗㄘㄙ', retro:'ㄓㄔㄕ', pal:'ㄐㄑㄒ'
};
const ASP = {'ㄆ':'ㄅ','ㄊ':'ㄉ','ㄎ':'ㄍ','ㄑ':'ㄐ','ㄘ':'ㄗ','ㄔ':'ㄓ'};
const UNASP = Object.fromEntries(Object.entries(ASP).map(([a,b])=>[b,a]));
const PLACE = {'ㄅ':'b','ㄆ':'b','ㄇ':'b','ㄈ':'f','ㄉ':'a','ㄊ':'a','ㄋ':'a','ㄌ':'a','ㄍ':'v','ㄎ':'v','ㄏ':'v','ㄐ':'p','ㄑ':'p','ㄒ':'p','ㄗ':'d','ㄘ':'d','ㄙ':'d','ㄓ':'r','ㄔ':'r','ㄕ':'r','ㄖ':'r'};
function processes(T, P){
  const has=(g,x)=>x && G[g].includes(x);
  if(!P || P==='∅') return ['聲母省略'];
  const out=[];
  if('ㄍㄎ'.includes(T) && (has('alv',P)||has('dent',P))) out.push('舌根音前置化');
  if('ㄉㄊ'.includes(T) && 'ㄍㄎ'.includes(P)) out.push('舌尖音後置化');
  if((has('fric',T)||has('affr',T)) && has('stop',P)) out.push('塞音化');
  if(ASP[T]===P) out.push('不送氣化');
  if(UNASP[T]===P) out.push('送氣化');
  if(has('retro',T) && has('dent',P)) out.push('捲舌音去捲舌化');
  if(has('dent',T) && has('retro',P)) out.push('舌尖前音捲舌化');
  if(T==='ㄖ' && P==='ㄌ') out.push('ㄖ音邊音化');
  if(has('fric',T) && has('affr',P) && PLACE[T]===PLACE[P]) out.push('擦音塞擦音化');
  if(has('affr',T) && has('fric',P) && PLACE[T]===PLACE[P]) out.push('塞擦音擦音化');
  if((has('pal',T) && (has('dent',P)||has('retro',P))) || ((has('dent',T)||has('retro',T)) && has('pal',P))) out.push('舌面音混淆');
  if((T==='ㄋ'&&P==='ㄌ')||(T==='ㄌ'&&P==='ㄋ')) out.push('鼻音邊音混淆');
  if((T==='ㄈ'&&P==='ㄏ')||(T==='ㄏ'&&P==='ㄈ')) out.push('ㄈㄏ混淆');
  if(!out.length) out.push('其他替代');
  return out;
}
function finProcess(t,p){
  const nas = {'ㄣ':'ㄥ','ㄥ':'ㄣ','ㄢ':'ㄤ','ㄤ':'ㄢ','ㄧㄣ':'ㄧㄥ','ㄧㄥ':'ㄧㄣ','ㄨㄣ':'ㄨㄥ','ㄨㄥ':'ㄨㄣ','ㄧㄢ':'ㄧㄤ','ㄧㄤ':'ㄧㄢ','ㄨㄢ':'ㄨㄤ','ㄨㄤ':'ㄨㄢ'};
  if(nas[t]===p) return '前後鼻音混淆';
  return '韻母替代';
}

if(typeof module!=='undefined') module.exports={parsePy,textToSyl,targetSyl,align,judgeWord,judgeVowel,judgeSentence,processes,finProcess};

/* ===== 嘴型動畫：側面口腔剖面圖（臉朝左） ===== */
const MOUTH = (()=>{

  const FIXED = { root:[240,212], rootB:[236,252], floor:[150,232], under:[94,182] };
  const T = {

  // 每個注音：舌位(接觸/留縫)、唇形、方式、氣流通過點
  const P = {

    'ㄐ':{t:'pal',lip:'spread',m:'aff',c:[126,96]}, 'ㄑ':{t:'pal',lip:'spread',m:'aff',asp:1,c:[126,96]}, 'ㄒ':{t:'pal',lip:'spread',m:'fric',c:[126,100]},

    'ㄗ':{t:'den',m:'aff',c:[69,128]}, 'ㄘ':{t:'den',m:'aff',asp:1,c:[69,128]}, 'ㄙ':{t:'den',m:'fric',c:[70,132]},

    const n=pts.length; let d=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;

      const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6], c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
      d+=` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`; }
    return d+'Z';
  }
  function open(pts){ let d=`M${pts[0][0]},${pts[0][1]}`; for(let i=0;i<pts.length-1;i++){ const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];

  function tonguePath(t){ return loop([t.tip,t.blade,t.front,t.dorsum,t.back,FIXED.root,FIXED.rootB,FIXED.floor,FIXED.under]); }

const TIPS = {
 'ㄅ':'雙唇閉緊，輕輕打開，不要噴氣。','ㄆ':'雙唇閉緊，打開時用力噴氣，手放嘴巴前會感覺到風。','ㄇ':'雙唇閉起來，讓聲音從鼻子出來，摸鼻子會震動。',

 'ㄐ':'嘴角往兩邊拉像微笑，舌面貼近上面，不要噴氣。','ㄑ':'嘴角拉開像微笑，舌面貼近上面，用力噴氣。','ㄒ':'嘴角拉開像微笑，舌面靠近上面，讓氣吹出來。',

function cueFor(T,P){
  const ps=processes(T,P); const c=[];
  for(const p of ps){
    if(p==='舌根音前置化') c.push('舌頭要往後縮，用舌頭後面發音。');
    else if(p==='舌尖音後置化') c.push('舌尖往前，頂在上牙齦。');
    else if(p==='塞音化') c.push('不要把氣堵住，讓氣慢慢吹出來。');
    else if(p==='不送氣化') c.push('要用力噴氣喔！手放在嘴巴前面試試看。');
    else if(p==='送氣化') c.push('輕輕的，不要噴氣。');
    else if(p==='捲舌音去捲舌化') c.push('舌尖要翹起來！');
    else if(p==='舌尖前音捲舌化') c.push('舌頭平平的，不要翹起來。');
    else if(p==='ㄖ音邊音化') c.push('舌尖翹起來，靠近但不要碰到。');
    else if(p==='擦音塞擦音化') c.push('舌頭不要碰到，讓氣一直吹出來。');
    else if(p==='塞擦音擦音化') c.push('舌頭先碰一下，再放開。');
    else if(p==='舌面音混淆') c.push('ㄐㄑㄒ'.includes(T)?'嘴角拉開像微笑，用舌面發音。':'舌尖用力，不要用舌面。');
    else if(p==='鼻音邊音混淆') c.push(T==='ㄋ'?'聲音要從鼻子出來。':'聲音不要從鼻子出來，捏住鼻子試試看。');
    else if(p==='ㄈㄏ混淆') c.push(T==='ㄈ'?'上牙齒要輕碰下嘴唇。':'嘴唇不要碰牙齒，從喉嚨哈氣。');
  }
  return c[0]||'';
}

const UA = navigator.userAgent||'';
const IS_IOS = /iPad|iPhone|iPod/.test(UA) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
function srEnvProblem(){
  const SRc = window.SpeechRecognition||window.webkitSpeechRecognition;
  const standalone = window.navigator.standalone===true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  if(IS_IOS && standalone) return '目前是從「主畫面圖示」開啟的，iPad 在這種模式下不能語音辨識。請改用 Safari 直接開啟這個網址。';
  if(/Line\//i.test(UA)) return '目前是在 LINE 裡面開啟的，不能使用麥克風。請點右下角「⋯」→「用 Safari 開啟」。';
  if(/FBAN|FBAV|Instagram|MicroMessenger/i.test(UA)) return '目前是在 App 內建瀏覽器開啟的，不能使用麥克風。請改用 Safari 開啟這個網址。';
  if(IS_IOS && /CriOS|FxiOS|EdgiOS/.test(UA)) return 'iPad 上的 Chrome／Firefox／Edge 不支援語音辨識，請改用 Safari 開啟。';
  if(!SRc) return '這個瀏覽器不支援語音辨識（iPad 請用 Safari，Android／電腦請用 Chrome）。';
  if(!window.isSecureContext) return '請用 https 網址開啟（GitHub Pages），才能使用麥克風。';
  return '';
}
function srErrorText(code){

    'not-allowed': ios ? '麥克風被拒絕：請點網址列左邊的「大小」(ㄚA) 圖示 →「網站設定」→ 麥克風選「允許」；或到 設定 → Safari → 麥克風 → 允許。改完重新整理頁面。' : '麥克風被拒絕：請點網址列的鎖頭圖示，允許麥克風後重新整理。',
    'service-not-allowed': ios ? '語音辨識服務沒有開：請到「設定 → Siri」開啟 Siri（iPad 的網頁語音辨識需要 Siri），並確認「設定 → 一般 → 鍵盤 → 啟用聽寫」已開。學校管理的 iPad 若鎖住 Siri，請洽資訊組。' : '語音辨識服務沒有開啟。',
    'language-not-supported': '這台裝置沒有國語辨識：請到 設定 → 一般 → 鍵盤，加入「繁體中文」鍵盤與聽寫語言。',
    'audio-capture': '抓不到麥克風：請關掉其他正在使用麥克風的 App（視訊、錄音）後再試。',
    'network': '語音辨識需要網路，請確認 Wi-Fi 已連線。',
    'no-speech': '沒有聽到聲音，請靠近一點再說一次。'
  })[code] || ('辨識發生問題（代碼：'+code+'）');
}
function micTest(out){
  const SRc = window.SpeechRecognition||window.webkitSpeechRecognition;
  const env=srEnvProblem(); if(env){ out.className='mictest bad'; out.textContent=env; return; }
  let r; try{ r=new SRc(); }catch(e){ out.className='mictest bad'; out.textContent='無法建立語音辨識：'+e.message; return; }
  r.lang='zh-TW'; r.interimResults=true; r.continuous=false;
  let got='', err='';
  out.className='mictest'; out.textContent='正在聽…請說「蘋果」';
  r.onstart=()=>{ out.textContent='麥克風已開啟，請說「蘋果」'; };
  r.onresult=e=>{ got=[...e.results].map(x=>x[0].transcript).join(''); out.textContent='聽到：'+got; };
  r.onerror=e=>{ err=e.error; };
  r.onend=()=>{ if(got){ out.className='mictest ok'; out.textContent='✓ 麥克風和語音辨識都正常，聽到：「'+got+'」'; } else { out.className='mictest bad'; out.textContent= err ? srErrorText(err) : '麥克風有開，但沒有收到辨識結果。請確認「設定 → Siri」已開啟、網路正常，再試一次。'; } };
  try{ r.start(); }catch(e){ out.className='mictest bad'; out.textContent='無法啟動：'+e.message; }
  setTimeout(()=>{ try{ r.stop(); }catch(e){} },6000);
}

let R=null;
function pickWords(phs){
  const pool=[]; phs.forEach(p=>(BANKMAP[p]||[]).forEach(([w,py,pic])=>pool.push({ph:p,w,py,pic})));
  // 避開上一次同目標用過的詞
  const last=stuSessions().filter(s=>s.target===(phs.length>1?null:phs[0])||s.items.some(i=>phs.includes(i.ph))).slice(-1)[0];
  const used=new Set(last?last.items.map(i=>i.w):[]);
  let fresh=shuffle(pool.filter(x=>!used.has(x.w))), rest=shuffle(pool.filter(x=>used.has(x.w)));
  const seen=new Set(), out=[];
  for(const x of fresh.concat(rest)){ if(seen.has(x.w)) continue; seen.add(x.w); out.push(x); if(out.length===5) break; }
  return out.map(x=>{ const t=targetSyl(x.w,x.py).map((s,i)=>s.ini===x.ph?i:-1).filter(i=>i>=0); return {...x,t,tries:[],done:false,pass:false,first:false,skip:false}; });
}

/* ===== 聲音 ===== */
let AC=null;
function tone(seq){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); let t=AC.currentTime; seq.forEach(([f,d])=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.18,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g).connect(AC.destination); o.start(t); o.stop(t+d+.02); t+=d*.8; }); }catch(e){} }
const chime=()=>tone([[660,.14],[880,.14],[1320,.3]]);
const buzz=()=>tone([[440,.16],[370,.26]]);
let voice=null;
function pickVoice(){ try{ const vs=speechSynthesis.getVoices(); voice=vs.find(v=>/zh[-_]TW/i.test(v.lang))||vs.find(v=>/zh/i.test(v.lang))||null; }catch(e){} }
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function speak(text,rate){
  return new Promise(res=>{
    if(!('speechSynthesis' in window)){ res(); return; }
    try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='zh-TW'; if(voice) u.voice=voice; u.rate=rate||0.75;
      setMic(false); u.onend=u.onerror=()=>{ setMic(!it().done); res(); }; speechSynthesis.speak(u); setTimeout(()=>{ setMic(!it().done); res(); },4000);
    }catch(e){ res(); }
  });
}

/* ===== 語音辨識 ===== */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null, recTimer=null, nextTimer=null;
function stopAll(){
  if(MH){ MH.stop(); MH=null; }
  clearTimeout(recTimer); clearTimeout(nextTimer);
  if(rec){ try{ rec.onend=null; rec.onresult=null; rec.onerror=null; rec.abort(); }catch(e){} rec=null; }
  $('btnMic').classList.remove('on');
  try{ speechSynthesis.cancel(); }catch(e){}
}
function startRec(){
  if(!SR||!R) return;
  if(rec){ try{ rec.stop(); }catch(e){} return; }
  try{ speechSynthesis.cancel(); }catch(e){}
  const x=it(), r=new SR(); rec=r;
  r.lang='zh-TW'; r.interimResults=true; r.continuous=false; r.maxAlternatives=3;
  let fin=null, lastInter='';
  r.onresult=e=>{ let inter=''; for(let i=e.resultIndex;i<e.results.length;i++){ const res=e.results[i]; if(res.isFinal) fin=[...res].map(a=>a.transcript.trim()).filter(Boolean); else inter+=res[0].transcript; } if(inter) lastInter=inter.trim(); $('hint').textContent=inter?('聽到：'+inter):'正在聽…'; };
  r.onerror=e=>{ if(e.error==='aborted') return; $('hint').textContent=srErrorText(e.error); };
  r.onend=()=>{ clearTimeout(recTimer); rec=null; $('btnMic').classList.remove('on'); if(fin&&fin.length) judge(x,fin); else if(lastInter) judge(x,[lastInter]); else if($('hint').textContent==='正在聽…') $('hint').textContent='沒聽清楚，再按一次麥克風'; };
  try{ r.start(); }catch(e){ rec=null; $('hint').textContent='無法啟動麥克風'; return; }
  $('btnMic').classList.add('on'); $('hint').textContent='正在聽…';
  recTimer=setTimeout(()=>{ try{ r.stop(); }catch(e){} },6000);
}
$('btnMic').onclick=startRec;

function judge(x, alts){
  if(!R || it()!==x || x.done) return;
  let a={v:'none'};
  if(PY_OK){ try{ a=judgeWord(x,alts[0],pyFn); }catch(e){} } else if(alts[0].includes(x.w)) a={v:'ok'};
  if(a.v==='none'){ $('say').className='say wait'; $('say').innerHTML=`<h3>再說一次</h3><div class="heard">聽到：${esc(alts[0])}</div>`; $('hint').textContent='沒有聽清楚，請靠近一點再說'; return; }
  x.tries.push({heard:alts[0], zy:a.heardZy||'', ok:a.v==='ok', v:a.v, prod:a.prod||''});
  if(a.v==='ok') onCorrect(x); else onWrong(x,a);
}
function onCorrect(x){
  x.done=true; x.pass=true; x.first = x.tries.length===1 && x.tries[0].ok;
  chime();
  const card=$('card'); const b=document.createElement('div'); b.className='burst'; b.textContent=x.first?'⭐':'👍'; card.appendChild(b); setTimeout(()=>b.remove(),1000);
  const last=x.tries[x.tries.length-1];
  $('say').className='say ok'; $('say').innerHTML=`<h3>${x.first?'太棒了！一次就說對':'改正了！過關'}</h3>${last.heard?`<div class="heard">聽到：${esc(last.heard)} <small>${esc(last.zy)}</small></div>`:''}`;
  $('tipBox').innerHTML=''; $('tries').textContent='';
  setMic(false); $('hint').textContent='';
  renderDots(); afterDone();
}
function onWrong(x,a){
  buzz();
  const left = DB.opts.max - x.tries.length;
  const T=x.ph;
  let cmp='', cue='';
  if(a.v==='sub'){ cmp=`<div class="compare">要說 <span class="z t">${T}</span> 你說成 <span class="z p">${esc(a.prod)}</span></div>`; cue=cueFor(T,a.prod); }
  else if(a.v==='omit'){ cmp=`<div class="compare">開頭的 <span class="z t">${T}</span> 不見了</div>`; cue='先把「'+T+'」的位置擺好，再說出來。'; }
  else if(a.v==='teacher'){ cmp=`<div class="compare">老師說：這個 <span class="z t">${T}</span> 還不夠清楚</div>`; }
  $('say').className='say err';
  $('say').innerHTML=`<h3>${left>0?'差一點！聽聽看再試一次':'沒關係，下次再練這個詞'}</h3>${x.tries.length&&x.tries[x.tries.length-1].heard?`<div class="heard">聽到：${esc(x.tries[x.tries.length-1].heard)} <small>${esc(x.tries[x.tries.length-1].zy)}</small></div>`:''}${cmp}`;
  $('tipBox').innerHTML=`<div class="tip withmouth">${cue?`<div><b>小提醒：</b>${esc(cue)}</div>`:''}<div><b>${T} 怎麼發：</b>${esc(TIPS[T]||'')}</div></div>`;
  showMouth($('tipBox').firstElementChild, T, a.v==='sub'?a.prod:null);
  if(left>0){
    $('tries').textContent=`還可以再試 ${left} 次`;
    $('hint').textContent='先聽正確讀音，再按麥克風說一次';
    if(DB.opts.auto) setTimeout(()=>{ if(R && it()===x && !x.done) speak(x.w); },700);
  } else {
    x.done=true; x.pass=false; x.first=false;
    $('tries').textContent=`已試 ${x.tries.length} 次`;
    setMic(false); $('hint').textContent='';
    if(DB.opts.auto) setTimeout(()=>{ if(R && it()===x) speak(x.w); },700);
    renderDots(); afterDone(true);
  }
}
function afterDone(noAuto){
  const lastOne = R.i===R.items.length-1;
  $('btnNext').hidden=false; $('btnNext').textContent= lastOne?'看看今天的成績 →':'下一題 →';
  if(!noAuto) nextTimer=setTimeout(()=>next(),1800);
}
function next(){ clearTimeout(nextTimer); if(R.i<R.items.length-1){ R.i++; renderItem(); } else finishRound(); }
$('btnNext').onclick=next;
$('tOk').onclick=()=>{ const x=it(); if(x.done&&x.pass) return; if(x.done){ x.done=false; } x.tries.push({heard:'',zy:'',ok:true,v:'teacher',prod:''}); x.teacher=true; stopAll(); onCorrect(x); };
$('tBad').onclick=()=>{ const x=it(); stopAll(); if(x.done&&x.pass){ x.done=false; x.pass=false; x.first=false; const l=x.tries[x.tries.length-1]; if(l){ l.ok=false; l.v='teacher'; } x.teacher=true; onWrong(x,{v:'teacher'}); } else if(!x.done){ x.tries.push({heard:'',zy:'',ok:false,v:'teacher',prod:''}); x.teacher=true; onWrong(x,{v:'teacher'}); } };
$('tSkip').onclick=()=>{ const x=it(); stopAll(); x.done=true; x.skip=true; x.pass=false; x.first=false; renderDots(); next(); };
$('btnQuit').onclick=()=>{ stopAll(); if(R.items.some(i=>i.done)) finishRound(true); else { R=null; show('home'); renderHome(); } };

function finishRound(partial){
  stopAll();
  const items=R.items.filter(i=>i.done).map(i=>({ph:i.ph,w:i.w,first:i.first,pass:i.pass,skip:i.skip,teacher:!!i.teacher,tries:i.tries}));
  if(items.length){ DB.sessions.push({id:R.id,sid:R.sid,ts:R.ts,mode:R.mode,target:R.target,items}); saveDB(); }
  renderStu();
  const sess=R; R=null;
  if(partial){ toast('已儲存這次練習'); return; }
  const firsts=items.filter(i=>i.first).length, passed=items.filter(i=>i.pass).length;
  const title= firsts===5?'全部一次過關！': passed>=4?'好厲害！': passed>=2?'有進步喔！':'繼續加油！';
  $('doneBox').innerHTML=`<div class="eyebrow">${esc(sess.mode==='group'?sess.target:sess.target+' 練習')}</div>
    <h1>${title}</h1>
    <div class="bigstars" aria-label="${firsts} 顆星">${[0,1,2,3,4].map(i=>`<span class="${i<firsts?'':'off'}">⭐</span>`).join('')}</div>
    <div class="muted">一次就說對 ${firsts} 個・最後過關 ${passed} 個（共 ${items.length} 個）</div>
    <div class="rlist">${items.map(i=>{ const s=itemStatus(i); const errs=i.tries.filter(t=>!t.ok&&t.prod&&t.prod!=='∅').map(t=>t.prod); const d= s===1?'第一次就說對': s===2?`試了 ${i.tries.length} 次${errs.length?'，曾說成 '+[...new Set(errs)].join('、'):''}`: s===0?'跳過':`${errs.length?'常說成 '+[...new Set(errs)].join('、'):'還需要練習'}`;
      return `<div class="ritem"><span class="ic">${s===1?'⭐':s===2?'✅':s===0?'➖':'🔁'}</span><span><span class="w">${esc(i.w)}</span><br><span class="d">${esc(d)}</span></span><span class="st s${s}">${s===1?'一次過關':s===2?'改正過關':s===0?'跳過':'待加強'}</span></div>`; }).join('')}</div>
    <div class="row" style="justify-content:center">
      <button class="btn primary" type="button" id="dAgain">再練一次</button>
      <button class="btn" type="button" id="dHome">換一個音</button>
      <button class="btn" type="button" id="dLog">看學習紀錄</button>
    </div>`;
  show('done');
  $('dAgain').onclick=()=>startRound({mode:sess.mode,target:sess.target,phs:sess.phs});
  $('dHome').onclick=()=>{ show('home'); renderHome(); };
  $('dLog').onclick=()=>{ show('log'); selPh = sess.mode==='ph'?sess.target:selPh; renderLog(); };
}

const ALLPH=BANK.map(b=>b[0]);
function renderLog(){

    <div class="tile"><span class="k">練習語詞</span><span class="n">${all.length}<small> 個</small></span><span class="k">${new Set(all.map(i=>i.ph)).size} 個注音</span></div>
    <div class="tile"><span class="k">一次就說對</span><span class="n">${firstRate==null?'—':firstRate}<small>${firstRate==null?'':' %'}</small></span><span class="k">全部語詞平均</span></div>
    <div class="tile"><span class="k">最後過關</span><span class="n">${passRate==null?'—':passRate}<small>${passRate==null?'':' %'}</small></span><span class="k">含聽示範後改正</span></div>
  </div>
  <div class="sect"><h2>各注音表現<small>最近 10 個詞「一次就說對」比例・綠 ≥80%　黃 50–79%　紅 &lt;50%・點選看趨勢</small></h2>
    <div class="phgrid">${ALLPH.map(p=>{ const r=recentRate(st[p]||[]); return `<button type="button" class="pc ${grade(r)} ${p===selPh?'sel':''}" data-p="${p}"><b>${p}</b><span>${r==null?'—':r+'%'}</span><span>${st[p]?st[p].length+' 詞':''}</span></button>`; }).join('')}</div>

  h+=`<div class="sect"><h2>練習歷程<small>新到舊</small></h2>${ss.length?`<div class="tblwrap"><table><thead><tr><th>日期</th><th>練習內容</th><th>一次說對</th><th>過關</th><th>語詞</th><th></th></tr></thead><tbody>${ss.map(s=>{ const its=s.items.filter(i=>!i.skip); const f=its.filter(i=>i.first).length, p=its.filter(i=>i.pass).length;
      return `<tr><td class="num">${fmtDate(s.ts,true)}</td><td>${esc(s.mode==='group'?s.target+'（混合）':s.target)}</td><td class="num">${f} / ${its.length}</td><td class="num">${p} / ${its.length}</td>
      <td><details><summary>${s.items.map(i=>esc(i.w)).join('、')}</summary><div class="chipline">${s.items.map(i=>{ const st=itemStatus(i); const tr=i.tries.map(t=>t.heard?(t.ok?'✓':'✗')+t.heard:(t.ok?'✓老師':'✗老師')).join(' → '); return `<span class="wchip s${st}" title="${esc(tr)}">${esc(i.w)}：${esc(tr||'跳過')}</span>`; }).join('')}</div></details></td>

    <div id="delConfirm" class="confirm" hidden><span>確定刪除這一筆練習紀錄？</span><span class="row"><button class="btn small" type="button" id="delNo">取消</button><button class="btn small danger" type="button" id="delYes">刪除</button></span></div>

  bindChart(); bindTools();

function phDetail(p, list){
  // 每次練習一個點：該次中這個音的一次說對比例
  const bySes=[]; const idx={};
  list.forEach(i=>{ if(!(i.sesId in idx)){ idx[i.sesId]=bySes.length; bySes.push({ts:i.ts,n:0,f:0,ps:0}); } const s=bySes[idx[i.sesId]]; s.n++; if(i.first)s.f++; if(i.pass)s.ps++; });
  const pts=bySes.map(s=>({ts:s.ts,v:Math.round(s.f/s.n*100),n:s.n,f:s.f,p:s.ps}));
  const subs={}; list.forEach(i=>i.tries.forEach(t=>{ if(!t.ok && t.prod && t.prod!=='∅'){ subs[t.prod]=(subs[t.prod]||0)+1; } else if(!t.ok && t.prod==='∅'){ subs['省略']=(subs['省略']||0)+1; } }));
  const words={}; list.forEach(i=>{ const w=words[i.w]||(words[i.w]={n:0,f:0}); w.n++; if(i.first)w.f++; });
  const hard=Object.entries(words).filter(([,v])=>v.f<v.n).sort((a,b)=>(a[1].f/a[1].n)-(b[1].f/b[1].n)).slice(0,6);
  const subList=Object.entries(subs).sort((a,b)=>b[1]-a[1]);
  const procs={}; subList.forEach(([s,c])=>{ if(s==='省略') return; processes(p,s).forEach(n=>procs[n]=(procs[n]||0)+c); });
  return `<div class="sect"><h2>${p} 的進步趨勢<small>每一點＝一次練習中「一次就說對」的比例</small></h2>
    <div class="detail">
      <div class="chart" id="chart" data-pts='${JSON.stringify(pts)}'></div>
      <div class="facts">
        <div><h3>常見錯誤</h3>${subList.length?`<ul>${subList.map(([s,c])=>`<li>${s==='省略'?'聲母省略':'說成 <b>'+s+'</b>'}：${c} 次</li>`).join('')}</ul>`:'<p class="muted" style="margin:0">沒有記錄到替代音</p>'}</div>
        ${Object.keys(procs).length?`<div><h3>可能的音韻歷程</h3><ul>${Object.entries(procs).map(([n,c])=>`<li>${n}（${c}）</li>`).join('')}</ul></div>`:''}
        <div><h3>還需要多練的詞</h3>${hard.length?`<div class="chipline">${hard.map(([w,v])=>`<span class="wchip s3">${esc(w)} ${v.f}/${v.n}</span>`).join('')}</div>`:'<p class="muted" style="margin:0">目前都能一次說對</p>'}</div>
        <div><h3>發音提示</h3><div class="mouth" id="logMouth" data-p="${p}"></div><p style="margin:0">${esc(TIPS[p]||'')}</p></div>
      </div>
    </div></div>`;
}
function bindChart(){
  const el=$('chart'); if(!el) return;
  const pts=JSON.parse(el.dataset.pts);
  const W=600,H=230,L=40,Rr=20,T=18,B=34;
  const iw=W-L-Rr, ih=H-T-B;
  const x=i=> pts.length===1? L+iw/2 : L+i*(iw/(pts.length-1));
  const y=v=> T+ih-(v/100)*ih;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="一次就說對比例趨勢">`;
  [0,50,100].forEach(v=>{ s+=`<line class="grid" x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-8}" y="${y(v)+4}" text-anchor="end">${v}%</text>`; });
  const step=Math.max(1,Math.ceil(pts.length/7));
  pts.forEach((p,i)=>{ if(i%step===0||i===pts.length-1) s+=`<text class="ax" x="${x(i)}" y="${H-10}" text-anchor="middle">${fmtDate(p.ts)}</text>`; });
  if(pts.length>1){
    const d=pts.map((p,i)=>(i?'L':'M')+x(i)+' '+y(p.v)).join(' ');
    s+=`<path class="area" d="${d} L${x(pts.length-1)} ${y(0)} L${x(0)} ${y(0)} Z"/><path class="ln" d="${d}"/>`;
  }
  pts.forEach((p,i)=>{ s+=`<circle class="pt ${i===pts.length-1?'last':''}" cx="${x(i)}" cy="${y(p.v)}" r="${i===pts.length-1?6:4.5}"/>`; });
  const lp=pts[pts.length-1]; s+=`<text class="lbl" x="${Math.min(x(pts.length-1),W-Rr-4)}" y="${y(lp.v)-12}" text-anchor="${pts.length>1?'end':'middle'}">${lp.v}%</text>`;
  pts.forEach((p,i)=>{ s+=`<rect data-i="${i}" x="${x(i)-Math.max(12,iw/pts.length/2)}" y="${T}" width="${Math.max(24,iw/pts.length)}" height="${ih}" fill="transparent"/>`; });
  s+='</svg><div class="tipbox" id="ctip" hidden></div>';
  el.innerHTML=s;
  const tip=$('ctip'), svg=el.querySelector('svg');
  el.querySelectorAll('rect[data-i]').forEach(r=>{
    const showTip=()=>{ const i=+r.dataset.i, p=pts[i]; const k=svg.getBoundingClientRect().width/W;
      tip.innerHTML=`${fmtDate(p.ts,true)}・一次說對 ${p.f}/${p.n}（${p.v}%）・過關 ${p.p}/${p.n}`; tip.style.left=(x(i)*k)+'px'; tip.style.top=(y(p.v)*k)+'px'; tip.hidden=false; };
    r.addEventListener('pointerenter',showTip); r.addEventListener('click',showTip);
    r.addEventListener('pointerleave',()=>tip.hidden=true);
  });
}

function download(name, text, type){ const blob=new Blob([text],{type}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); }

  $('exJson').onclick=()=>download(`構音練習備份_${today}.json`, JSON.stringify({app:'artic-practice',v:1,students:DB.students,sessions:DB.sessions}), 'application/json');

      if(!DB.cur && DB.students[0]) DB.cur=DB.students[0].id; saveDB(); renderStu(); renderLog(); toast(`已匯入 ${ns} 位學生、${nr} 筆練習`); }catch(err){ toast('這個檔案不是構音練習的備份檔'); } }; rd.readAsText(f); };
  if($('delStu')){ $('delStu').onclick=()=>$('stuConfirm').hidden=false; $('stuNo').onclick=()=>$('stuConfirm').hidden=true;
    $('stuYes').onclick=()=>{ const id=DB.cur; DB.students=DB.students.filter(s=>s.id!==id); DB.sessions=DB.sessions.filter(s=>s.sid!==id); DB.cur=DB.students[0]?DB.students[0].id:null; saveDB(); renderStu(); renderLog(); toast('已刪除'); }; }
