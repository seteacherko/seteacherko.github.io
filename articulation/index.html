<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>構音冒險島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.26.0/dist/index.js"></script>
<style>
/* 版面：海圖（9 座島沿航線排列）→ 島嶼（關卡石）→ 關卡（四步驟：聽、跟、說、挑戰） */
:root{
  --paper:#E4F2F1; --surface:#FFFFFF; --sunk:#F2F8F7; --ink:#14303A; --muted:#557079; --line:#CBE0DE;
  --teal:#0B7A72; --teal-ink:#FFFFFF; --teal-soft:#D6EEEB;
  --zhu:#C2410C; --zhu-soft:#FCE9DF; --star:#E0A100; --star-ink:#7A5A00; --star-soft:#FFF3CC;
  --sand:#F3E3C0; --route:#C9A86A; --sea:#BFE3E6;
  --ok:#157A3C; --ok-soft:#DDF2E4; --warn:#A35A06; --warn-soft:#FBEFD9; --bad:#B42318; --bad-soft:#FBE3E0; --none:#8A989E;
  --tongue:#E58C92; --tongue-edge:#B4545E; --lip:#E3998B; --lip-edge:#B56C5E; --skin:#F6DCC8; --skin-line:#C9A48C; --mouth-dark:#5A1F28;
  --f-word:"LXGW WenKai TC","Kaiti TC","BiauKai","DFKai-SB","Noto Serif TC",serif;
  --f-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0C1A1F; --surface:#14252B; --sunk:#1A2E35; --ink:#E3F0EF; --muted:#93AEB3; --line:#284047;
  --teal:#3FBFB2; --teal-ink:#05211E; --teal-soft:#16393A;
  --zhu:#F2894E; --zhu-soft:#3A2418; --star:#F4C542; --star-ink:#F4C542; --star-soft:#3A3114;
  --sand:#3A3320; --route:#8F7A4E; --sea:#123A42;
  --ok:#5CCB84; --ok-soft:#173424; --warn:#E9A94B; --warn-soft:#3A2B14; --bad:#F2796D; --bad-soft:#3E1D1A; --none:#6F8086;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --paper:#0C1A1F; --surface:#14252B; --sunk:#1A2E35; --ink:#E3F0EF; --muted:#93AEB3; --line:#284047;
  --teal:#3FBFB2; --teal-ink:#05211E; --teal-soft:#16393A;
  --zhu:#F2894E; --zhu-soft:#3A2418; --star:#F4C542; --star-ink:#F4C542; --star-soft:#3A3114;
  --sand:#3A3320; --route:#8F7A4E; --sea:#123A42;
  --ok:#5CCB84; --ok-soft:#173424; --warn:#E9A94B; --warn-soft:#3A2B14; --bad:#F2796D; --bad-soft:#3E1D1A; --none:#6F8086;
  color-scheme:dark; }

*{box-sizing:border-box}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.45em .7em;min-height:44px}
h1,h2,h3{text-wrap:balance;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 56px;display:grid;gap:18px}
.eyebrow{font-size:.78rem;letter-spacing:.12em;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.45em 1.1em;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:.4em;min-height:44px;text-decoration:none}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.btn.small{min-height:36px;padding:.2em .9em;font-size:.9rem}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.big{min-height:56px;font-size:1.15rem;padding:.4em 1.6em}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* 上方列 */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .in{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--f-word);font-weight:700;font-size:1.3rem;letter-spacing:.06em;margin-right:auto;display:flex;gap:8px;align-items:center}
.brand span{color:var(--zhu)}
.stu{display:flex;gap:6px;align-items:center}
.stu select{min-width:7em;min-height:38px}
.starcount{font-weight:700;color:var(--star-ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.panelbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.inline-form{display:flex;gap:6px;flex-wrap:wrap}
.notice{padding:10px 14px;border-radius:12px;font-size:.9rem;background:var(--warn-soft);color:var(--warn)}

/* ===== 海圖 ===== */
.maphead{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.maphead h1{font-family:var(--f-word);font-size:clamp(1.8rem,4.4vw,2.6rem);letter-spacing:.04em}
.treasures{display:flex;gap:4px;flex-wrap:wrap;font-size:1.5rem}
.treasures span{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--sunk);border:1px dashed var(--line)}
.treasures span.got{background:var(--star-soft);border:1px solid var(--star)}
.treasures span:not(.got){filter:grayscale(1);opacity:.35}
.sea{position:relative;border-radius:28px;background:
  radial-gradient(circle at 18% 12%, color-mix(in srgb,var(--surface) 55%,transparent) 0 2px, transparent 3px) 0 0/46px 46px,
  linear-gradient(180deg,var(--sea),color-mix(in srgb,var(--sea) 60%,var(--paper)));
  border:1px solid var(--line);overflow:hidden}
.sea svg.route{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.route path{fill:none;stroke:var(--route);stroke-width:5;stroke-dasharray:2 14;stroke-linecap:round}
.isle{position:absolute;transform:translate(-50%,-50%);display:grid;justify-items:center;gap:4px;width:170px;background:none;border:none;padding:0}
.isle .blob{width:112px;height:96px;border-radius:52% 48% 46% 54% / 58% 54% 46% 42%;display:grid;place-items:center;font-size:3rem;position:relative;
  background:radial-gradient(ellipse at 50% 70%, var(--sand) 0 58%, transparent 59%), var(--isle);
  box-shadow:0 10px 0 -4px color-mix(in srgb,var(--isle) 55%,#000 10%), 0 0 0 6px color-mix(in srgb,var(--surface) 70%,transparent)}
.isle .num{position:absolute;top:-8px;left:-8px;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:.85rem;font-weight:700;display:grid;place-items:center}
.isle .nm{font-family:var(--f-word);font-weight:700;font-size:1.08rem;background:var(--surface);padding:2px 10px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.isle .st{font-size:.8rem;color:var(--star-ink);font-weight:700;font-variant-numeric:tabular-nums;background:var(--surface);border-radius:99px;padding:0 8px}
.isle.locked .blob{filter:grayscale(.9);opacity:.55}
.isle.locked .blob::after{content:"🔒";position:absolute;font-size:1.6rem;bottom:-6px;right:-6px}
.isle.done .blob::after{content:"✔";position:absolute;font-size:1rem;bottom:-4px;right:-4px;background:var(--ok);color:#fff;border-radius:50%;width:28px;height:28px;display:grid;place-items:center}
.isle.here .blob{animation:bob 2.4s ease-in-out infinite}
.isle.here .flag{position:absolute;top:-30px;font-size:1.6rem}
@keyframes bob{50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.isle.here .blob{animation:none}}

/* ===== 島嶼 ===== */
.isle-hero{border-radius:28px;padding:22px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;background:linear-gradient(135deg,color-mix(in srgb,var(--isle) 30%,var(--surface)),var(--surface));border:1px solid var(--line)}
.isle-hero .em{font-size:4.4rem;line-height:1}
.isle-hero h1{font-family:var(--f-word);font-size:clamp(1.8rem,4.6vw,2.6rem)}
.isle-hero p{margin:4px 0 0;color:var(--muted)}
.stones{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.stone{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px 10px;display:grid;justify-items:center;gap:4px;position:relative;min-height:150px;align-content:center}
.stone .n{position:absolute;top:8px;left:12px;font-size:.78rem;color:var(--muted)}
.stone b{font-family:var(--f-word);font-size:2.4rem;color:var(--zhu);line-height:1.2}
.stone .lb{font-size:.88rem;color:var(--muted)}
.stone .stars{font-size:1.15rem;letter-spacing:.06em}
.stone .stars .off{filter:grayscale(1);opacity:.25}
.stone.boss{background:linear-gradient(160deg,var(--zhu-soft),var(--surface))}
.stone.locked{opacity:.5}
.stone.locked::after{content:"🔒";position:absolute;top:8px;right:10px}
.stone.next{border:2px solid var(--teal);box-shadow:0 0 0 4px var(--teal-soft)}

/* ===== 關卡介紹 ===== */
.intro{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:center}
@media (max-width:820px){.intro{grid-template-columns:1fr}}
.intro h1{font-family:var(--f-word);font-size:clamp(2.2rem,6vw,3.4rem)}
.steps-plan{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.steps-plan li{display:flex;gap:10px;align-items:center;background:var(--sunk);border-radius:12px;padding:8px 12px}
.steps-plan li b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--teal);color:var(--teal-ink);font-size:.9rem;flex:none}

/* ===== 嘴型 ===== */
.mouths{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:center}
.mouths .mouth{max-width:300px}
.mouth{width:100%;max-width:360px;justify-self:center}
.mouth-svg{width:100%;height:auto;display:block}
.m-cav{fill:var(--sunk)}
.m-skin-line,.m-wall{fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.m-palate{fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round}
.m-velum{fill:none;stroke:var(--ink);stroke-width:7;stroke-linecap:round;opacity:.75}
.m-tongue{fill:var(--tongue);stroke:var(--tongue-edge);stroke-width:2}
.m-ghost{fill:none;stroke:var(--bad);stroke-width:2.5;stroke-dasharray:5 4}
.m-tooth{fill:var(--surface);stroke:var(--muted);stroke-width:1.5}
.m-lip{fill:var(--lip);stroke:var(--lip-edge);stroke-width:1.5}
.m-contact{fill:none;stroke:var(--ok);stroke-width:3}
.m-flow{fill:none;stroke:var(--teal);stroke-width:3;stroke-dasharray:6 7;stroke-linecap:round;animation:mflow .6s linear infinite}
.m-flow.nasal{stroke:var(--zhu)}
@keyframes mflow{to{stroke-dashoffset:-13}}
.m-puff path{stroke:var(--teal);stroke-width:3;stroke-linecap:round;fill:none}
.m-vib path{stroke:var(--zhu);stroke-width:2.5;fill:none;stroke-linecap:round}
.m-tag{font:700 15px var(--f-ui);fill:var(--ink)}
.m-tag2{font:400 11px var(--f-ui);fill:var(--muted)}
@media (prefers-reduced-motion:reduce){.m-flow{animation:none}}

.lips-svg{width:100%;height:auto;display:block}
.l-skin{fill:var(--skin)}
.l-nose{fill:none;stroke:var(--skin-line);stroke-width:2.5;stroke-linecap:round}
.l-open{fill:var(--mouth-dark)}
.l-tongue{fill:var(--tongue)}
.l-teeth{fill:#FBFBF7;stroke:var(--skin-line);stroke-width:.8}
.l-gap{stroke:#D9D6CC;stroke-width:.8}
.l-lip{fill:var(--lip);stroke:var(--lip-edge);stroke-width:1.5;stroke-linejoin:round}
.l-air path{stroke:var(--teal);stroke-width:3;stroke-linecap:round;stroke-dasharray:4 5;fill:none;animation:mflow .6s linear infinite}
.l-hold{stroke:var(--muted);stroke-width:3;stroke-linecap:round}
.l-paper{fill:#FFFFFF;stroke:var(--muted);stroke-width:1.2}
.l-nasal path{stroke:var(--zhu);stroke-width:2.5;fill:none;stroke-linecap:round}
.l-tag{font:700 13px var(--f-ui);fill:var(--ink)}

@keyframes mflow{to{stroke-dashoffset:-13}}

/* ===== 遊玩 ===== */
.playtop{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.playtop .pills{flex:1;justify-content:center}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border-radius:99px;padding:4px 12px;font-size:.88rem;background:var(--sunk);border:1px solid var(--line);color:var(--muted)}
.pill.cur{background:var(--teal);border-color:var(--teal);color:var(--teal-ink);font-weight:700}
.pill.pdone{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.stage{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.stage{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:20px;display:grid;gap:12px;justify-items:center;align-content:center;min-height:470px;position:relative;overflow:hidden}
.card .tag{position:absolute;top:14px;left:16px;display:flex;gap:8px;align-items:center}
.card .tag b{font-family:var(--f-word);font-size:1.5rem;color:var(--zhu);background:var(--zhu-soft);border-radius:10px;padding:0 10px}
.card .dots{position:absolute;top:16px;right:16px;display:flex;gap:6px}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.78rem;background:var(--surface)}
.dot.cur{border-color:var(--teal)}
.dot.s1{background:var(--star-soft);border-color:var(--star)} .dot.s2{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)} .dot.s3{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.banner{font-family:var(--f-word);font-size:1.3rem;font-weight:700;color:var(--teal)}
.pic{font-size:clamp(4.4rem,12vw,7rem);line-height:1.1;min-height:1.1em}
.word{font-family:var(--f-word);font-size:clamp(2.8rem,9vw,5.2rem);font-weight:700;letter-spacing:.08em;line-height:1.5;text-align:center}
.word.sent{font-size:clamp(2rem,6vw,3.4rem)}
.word rt{font-family:var(--f-ui);font-size:.3em;color:var(--muted);letter-spacing:0;font-weight:500}
.word .tg,.word .tg rt{color:var(--zhu)}
.choices{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.choice{width:140px;height:140px;border-radius:28px;border:3px solid var(--line);background:var(--sunk);font-family:var(--f-word);font-size:4.6rem;font-weight:700;color:var(--zhu);display:grid;place-items:center}
.choice:hover{border-color:var(--teal)}
.choice.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.choice.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.actions{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap}
.round{width:72px;height:72px;border-radius:50%;border:1px solid var(--line);background:var(--sunk);display:grid;place-items:center;font-size:.78rem;gap:0;line-height:1.1}
.round b{font-size:1.5rem}
.mic{width:118px;height:118px;border-radius:50%;border:none;background:var(--teal);color:var(--teal-ink);display:grid;place-items:center;position:relative;box-shadow:0 8px 20px -10px var(--teal)}
.mic svg{width:46px;height:46px}
.mic.on{background:var(--zhu)}
.mic.on::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--zhu);animation:pulse 1.2s ease-out infinite}
@keyframes pulse{from{transform:scale(.9);opacity:1}to{transform:scale(1.25);opacity:0}}
.mic:disabled{background:var(--none);box-shadow:none}
.hint{color:var(--muted);min-height:1.6em;text-align:center}
.burst{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-size:7rem;animation:pop .9s ease-out forwards}
@keyframes pop{0%{transform:scale(.3);opacity:0}40%{transform:scale(1.1);opacity:1}100%{transform:scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){.mic.on::after,.burst{animation:none}.burst{opacity:0}}
.fb{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:12px}
#tipBox{display:grid;gap:10px}
.pic-svg{width:1.15em;height:1.15em;display:block}
.say{border-radius:16px;padding:12px 14px;display:grid;gap:6px}
.say.idle{background:var(--sunk);color:var(--muted)}
.say.ok{background:var(--ok-soft);color:var(--ok)}
.say.err{background:var(--bad-soft);color:var(--bad)}
.say.wait{background:var(--warn-soft);color:var(--warn)}
.say h3{font-size:1.4rem;font-family:var(--f-word)}
.say .heard{font-family:var(--f-word);font-size:1.2rem;color:var(--ink)}
.say .heard small{font-family:var(--f-ui);font-size:.8rem;color:var(--muted)}
.compare{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--ink)}
.compare .z{font-family:var(--f-word);font-size:1.9rem;font-weight:700;border-radius:10px;padding:0 10px;line-height:1.4}
.compare .z.t{background:var(--ok-soft);color:var(--ok)}
.compare .z.p{background:var(--bad-soft);color:var(--bad);text-decoration:line-through;text-decoration-thickness:2px}
.tip{background:var(--zhu-soft);border-radius:14px;padding:12px 14px;display:grid;gap:6px;font-size:1rem}
.tip b{color:var(--zhu)}
.teacher{margin-top:auto;display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.gear{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--sunk);color:var(--muted);font-size:1.1rem;display:grid;place-items:center;flex:none}
.gear[aria-expanded="true"]{background:var(--teal-soft);border-color:var(--teal);color:var(--teal)}
#btnNext{min-width:220px}
.navrow{display:flex;gap:10px}
.navrow .btn.primary{flex:1;font-size:1.05rem;min-height:52px}

/* ===== 結算 ===== */
.done{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:24px;display:grid;gap:14px;justify-items:center;text-align:center}
.done h1{font-family:var(--f-word);font-size:clamp(2rem,5vw,2.8rem)}
.bigstars{font-size:3rem;letter-spacing:.12em}
.bigstars .off{filter:grayscale(1);opacity:.22}
.gem{font-size:1rem;display:flex;gap:6px;align-items:center;justify-content:center}
.rlist{width:100%;max-width:660px;display:grid;gap:8px;text-align:left}
.ritem{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--sunk)}
.ritem .ic{font-size:1.4rem;text-align:center}
.ritem .w{font-family:var(--f-word);font-size:1.3rem}
.ritem .d{font-size:.84rem;color:var(--muted)}
.ritem .st{font-size:.84rem;font-weight:700;white-space:nowrap}
.st.s1{color:var(--star-ink)} .st.s2{color:var(--ok)} .st.s3{color:var(--bad)}
.treasure{font-size:5rem;animation:pop2 1.2s ease-out}
@keyframes pop2{0%{transform:scale(.2) rotate(-20deg)}60%{transform:scale(1.2) rotate(8deg)}100%{transform:scale(1)}}

/* ===== 紀錄 ===== */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:2px}
.tile .n{font-size:1.8rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}

<script>
/* ===== 判讀引擎：拼音→注音、對齊比對、音韻歷程 ===== */
const INI = ['zh','ch','sh','b','p','m','f','d','t','n','l','g','k','h','j','q','x','r','z','c','s'];
const INI_ZY = {b:'ㄅ',p:'ㄆ',m:'ㄇ',f:'ㄈ',d:'ㄉ',t:'ㄊ',n:'ㄋ',l:'ㄌ',g:'ㄍ',k:'ㄎ',h:'ㄏ',j:'ㄐ',q:'ㄑ',x:'ㄒ',zh:'ㄓ',ch:'ㄔ',sh:'ㄕ',r:'ㄖ',z:'ㄗ',c:'ㄘ',s:'ㄙ'};
const FIN_ZY = {'':'',a:'ㄚ',o:'ㄛ',e:'ㄜ','ê':'ㄝ',eh:'ㄝ',ai:'ㄞ',ei:'ㄟ',ao:'ㄠ',ou:'ㄡ',an:'ㄢ',en:'ㄣ',ang:'ㄤ',eng:'ㄥ',er:'ㄦ',ong:'ㄨㄥ',
  i:'ㄧ',ia:'ㄧㄚ',io:'ㄧㄛ',ie:'ㄧㄝ',iao:'ㄧㄠ',iou:'ㄧㄡ',ian:'ㄧㄢ',in:'ㄧㄣ',iang:'ㄧㄤ',ing:'ㄧㄥ',iong:'ㄩㄥ',
  u:'ㄨ',ua:'ㄨㄚ',uo:'ㄨㄛ',uai:'ㄨㄞ',uei:'ㄨㄟ',uan:'ㄨㄢ',uen:'ㄨㄣ',uang:'ㄨㄤ',ueng:'ㄨㄥ',
  v:'ㄩ',ve:'ㄩㄝ',van:'ㄩㄢ',vn:'ㄩㄣ'};
const YW = {yi:'i',ya:'ia',yo:'io',ye:'ie',yao:'iao',you:'iou',yan:'ian',yin:'in',yang:'iang',ying:'ing',yong:'iong',
  yu:'v',yue:'ve',yuan:'van',yun:'vn',wu:'u',wa:'ua',wo:'uo',wai:'uai',wei:'uei',wan:'uan',wen:'uen',wang:'uang',weng:'ueng'};
const TONE = {'1':'','2':'ˊ','3':'ˇ','4':'ˋ','0':'˙','5':'˙'};

function parsePy(raw){
  let s = String(raw||'').toLowerCase().replace(/ü/g,'v').trim();
  const m = s.match(/^([a-zê]+)([0-5])?$/);
  if(!m) return null;
  let base = m[1], tone = m[2]||'0';
  let ini = '', fin = base;
  if(['n','ng','m','hm','hng'].includes(base)) { fin = base==='m'||base==='hm' ? 'u' : (base==='n'?'en':'eng'); }
  else if(YW[base] !== undefined) fin = YW[base];
  else {
    for(const c of INI){ if(base.startsWith(c)){ ini=c; fin=base.slice(c.length); break; } }
    if('jqx'.includes(ini) && ini && fin.startsWith('u')) fin = 'v'+fin.slice(1);
    if(['zh','ch','sh','r','z','c','s'].includes(ini) && fin==='i') fin='';
    if(fin==='iu') fin='iou'; else if(fin==='ui') fin='uei'; else if(fin==='un') fin='uen';
  }
  const iz = ini ? INI_ZY[ini] : '';
  const fz = FIN_ZY[fin] !== undefined ? FIN_ZY[fin] : fin;
  const t = TONE[tone]||'';
  const zy = tone==='0'||tone==='5' ? '˙'+iz+fz : iz+fz+t;
  return { ini: iz, fin: fz, key: iz+'|'+fz, zy };
}

/* 把辨識文字轉成音節陣列（只取漢字） */
function textToSyl(text, pyFn){
  const chars = Array.from(String(text||'')).filter(c=>/\p{Script=Han}/u.test(c));
  if(!chars.length) return [];
  let pys = [];
  try { pys = pyFn(chars.join('')); } catch(e){ pys = []; }
  return chars.map((c,i)=>({ ch:c, ...(parsePy(pys[i])||{ini:'?',fin:'?',key:'?',zy:'?'}) }));
}
function targetSyl(word, py){
  const chars = Array.from(word), ps = py.split(' ');
  return chars.map((c,i)=>({ ch:c, ...parsePy(ps[i]) }));
}

/* 音節對齊（編輯距離） */
function align(T, P){
  const n=T.length, m=P.length, INF=1e9;
  const cost=(a,b)=> a.ch===b.ch||a.key===b.key ? 0 : (a.ini===b.ini ? 0.4 : (a.fin===b.fin ? 0.6 : 1));
  const D=Array.from({length:n+1},()=>Array(m+1).fill(INF));
  D[0][0]=0;
  for(let i=0;i<=n;i++)for(let j=0;j<=m;j++){
    if(i&&j) D[i][j]=Math.min(D[i][j], D[i-1][j-1]+cost(T[i-1],P[j-1]));
    if(i) D[i][j]=Math.min(D[i][j], D[i-1][j]+1);
    if(j) D[i][j]=Math.min(D[i][j], D[i][j-1]+ ((i===0||i===n)?0.2:1)); // 頭尾多說的字（如「這是…」）幾乎不扣
  }
  const ops=[]; let i=n,j=m;
  while(i>0||j>0){
    if(i&&j && Math.abs(D[i][j]-(D[i-1][j-1]+cost(T[i-1],P[j-1])))<1e-9){ ops.push({t:i-1,p:j-1}); i--; j--; }
    else if(i && Math.abs(D[i][j]-(D[i-1][j]+1))<1e-9){ ops.push({t:i-1,p:-1}); i--; }
    else { ops.push({t:-1,p:j-1,edge:(i===0||i===n)}); j--; }
  }
  return ops.reverse();
}

/* 詞彙判讀 */
function judgeWord(item, heardText, pyFn){
  const T = targetSyl(item.w, item.py), P = textToSyl(heardText, pyFn);
  if(!P.length) return { v:'none' };
  const ops = align(T,P);
  const byT = {}; ops.forEach(o=>{ if(o.t>=0) byT[o.t]=o; });
  let v='ok', prod='', note=[], finErr=null;
  for(const k of item.t){
    const o=byT[k], ts=T[k];
    if(!o || o.p<0){ v='omit'; note.push('「'+ts.ch+'」音節沒有說出'); prod='∅'; break; }
    const ps=P[o.p];
    if(ps.ch===ts.ch || ps.ini===ts.ini){
      if(ps.ch!==ts.ch && ps.fin!==ts.fin){ finErr={t:ts.fin,p:ps.fin,ch:ts.ch}; note.push('「'+ts.ch+'」韻母聽起來像 '+ps.zy); }
      continue;
    }
    if(ps.ini===''){ v='omit'; prod='∅'; note.push('「'+ts.ch+'」聲母省略，聽起來像 '+ps.zy); break; }
    v='sub'; prod=ps.ini; note.push('「'+ts.ch+'」'+ts.zy+' → '+ps.zy); break;
  }
  const whole = ops.every(o=> o.t<0 ? o.edge : (o.p>=0 && (T[o.t].ch===P[o.p].ch || T[o.t].key===P[o.p].key)));
  if(v==='ok' && !whole && !finErr){
    const others = ops.filter(o=>o.t>=0 && !item.t.includes(o.t) && (o.p<0 || (T[o.t].ch!==P[o.p].ch && T[o.t].key!==P[o.p].key)));
    if(others.length) note.push('目標音正確；其他字有差異：'+others.map(o=>o.p<0?('「'+T[o.t].ch+'」未說'):(T[o.t].ch+'→'+P[o.p].zy)).join('、'));
  }
  return { v, prod, note:note.join('；'), finErr, heardZy:P.map(s=>s.zy).join(' ') };
}

/* 韻母判讀 */
const VOWEL_ACCEPT = { 'ㄛ':['ㄛ','ㄨㄛ'], 'ㄝ':['ㄝ'], 'ㄥ':['ㄥ'] };
const VOWEL_CHARS = { 'ㄝ':['欸','誒'], 'ㄛ':['喔','噢','哦'], 'ㄥ':['嗯','鞥'] };
const VOWEL_SHAKY = ['ㄛ','ㄝ','ㄥ'];
function judgeVowel(item, heardText, pyFn){
  const P = textToSyl(heardText, pyFn);
  if(!P.length) return { v:'none' };
  const s = P[0], target = item.w;
  const acc = VOWEL_ACCEPT[target] || [target];
  if((VOWEL_CHARS[target]||[]).includes(s.ch) || (s.ini==='' && acc.includes(s.fin))) return { v:'ok', prod:'', note:'', heardZy:s.zy };
  if(s.ini!=='' && acc.includes(s.fin)) return { v:'add', prod:s.ini, note:'韻母正確，但前面多了聲母 '+s.ini+'（聽起來像 '+s.zy+'）', heardZy:s.zy };
  return { v:'sub', prod:s.fin||s.ini, note:target+' → '+s.zy, heardZy:s.zy };
}

/* 短句判讀 */
function judgeSentence(item, heardText, pyFn){
  const T = targetSyl(item.w, item.py), P = textToSyl(heardText, pyFn);
  if(!P.length) return { v:'none' };
  const ops = align(T,P), errs=[];
  for(const o of ops){
    if(o.t<0){ if(!o.edge) errs.push({type:'add', ch:'', p:P[o.p].zy}); continue; }
    const ts=T[o.t];
    if(o.p<0){ errs.push({type:'omit', ch:ts.ch, t:ts.zy}); continue; }
    const ps=P[o.p];
    if(ps.ch===ts.ch || ps.key===ts.key) continue;
    if(ps.ini!==ts.ini) errs.push({type: ps.ini===''?'omitIni':'sub', ch:ts.ch, t:ts.zy, p:ps.zy, ti:ts.ini, pi:ps.ini});
    else errs.push({type:'fin', ch:ts.ch, t:ts.zy, p:ps.zy, tf:ts.fin, pf:ps.fin});
  }
  const txt = errs.map(e=> e.type==='omit' ? '「'+e.ch+'」未說' : e.type==='add' ? '多說 '+e.p : '「'+e.ch+'」'+e.t+'→'+e.p).join('、');
  return { v: errs.length?'err':'ok', errs, note: txt, heardZy:P.map(s=>s.zy).join(' ') };
}

/* 音韻歷程分類 */
const PGRP = {
  stop:'ㄅㄆㄉㄊㄍㄎ', fric:'ㄈㄏㄒㄙㄕㄖ', affr:'ㄐㄑㄗㄘㄓㄔ', velar:'ㄍㄎㄏ', alv:'ㄉㄊㄋㄌ',
  dent:'ㄗㄘㄙ', retro:'ㄓㄔㄕ', pal:'ㄐㄑㄒ'
};
const ASP = {'ㄆ':'ㄅ','ㄊ':'ㄉ','ㄎ':'ㄍ','ㄑ':'ㄐ','ㄘ':'ㄗ','ㄔ':'ㄓ'};
const UNASP = Object.fromEntries(Object.entries(ASP).map(([a,b])=>[b,a]));
const PLACE = {'ㄅ':'b','ㄆ':'b','ㄇ':'b','ㄈ':'f','ㄉ':'a','ㄊ':'a','ㄋ':'a','ㄌ':'a','ㄍ':'v','ㄎ':'v','ㄏ':'v','ㄐ':'p','ㄑ':'p','ㄒ':'p','ㄗ':'d','ㄘ':'d','ㄙ':'d','ㄓ':'r','ㄔ':'r','ㄕ':'r','ㄖ':'r'};
function processes(T, P){
  const has=(g,x)=>x && PGRP[g].includes(x);
  if(!P || P==='∅') return ['聲母省略'];
  const out=[];
  if('ㄍㄎ'.includes(T) && (has('alv',P)||has('dent',P))) out.push('舌根音前置化');

 'ㄗ':'舌頭平平的，舌尖頂住上門牙後面，不要噴氣。','ㄘ':'舌頭平平的，舌尖頂住上門牙後面，用力噴氣。','ㄙ':'舌頭平平的，舌尖靠近上門牙後面，像蛇一樣嘶嘶吹氣。'
};
function cueFor(T,P){
  const ps=processes(T,P); const c=[];
  for(const p of ps){
    if(p==='舌根音前置化') c.push('舌頭要往後縮，用舌頭後面發音。');
    else if(p==='舌尖音後置化') c.push('舌尖往前，頂在上牙齦。');
    else if(p==='塞音化') c.push('不要把氣堵住，讓氣慢慢吹出來。');
    else if(p==='不送氣化') c.push('要用力噴氣喔！手放在嘴巴前面試試看。');
    else if(p==='送氣化') c.push('輕輕的，不要噴氣。');
    else if(p==='捲舌音去捲舌化') c.push('舌尖要翹起來！');
    else if(p==='舌尖前音捲舌化') c.push('舌頭平平的，不要翹起來。');
    else if(p==='ㄖ音邊音化') c.push('舌尖翹起來，靠近但不要碰到。');
    else if(p==='擦音塞擦音化') c.push('舌頭不要碰到，讓氣一直吹出來。');
    else if(p==='塞擦音擦音化') c.push('舌頭先碰一下，再放開。');
    else if(p==='舌面音混淆') c.push('ㄐㄑㄒ'.includes(T)?'嘴角拉開像微笑，用舌面發音。':'舌尖用力，不要用舌面。');
    else if(p==='鼻音邊音混淆') c.push(T==='ㄋ'?'聲音要從鼻子出來。':'聲音不要從鼻子出來，捏住鼻子試試看。');
    else if(p==='ㄈㄏ混淆') c.push(T==='ㄈ'?'上牙齒要輕碰下嘴唇。':'嘴唇不要碰牙齒，從喉嚨哈氣。');
  }
  return c[0]||'';
}

const UA = navigator.userAgent||'';
const IS_IOS = /iPad|iPhone|iPod/.test(UA) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
function srEnvProblem(){
  const SRc = window.SpeechRecognition||window.webkitSpeechRecognition;
  const standalone = window.navigator.standalone===true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  if(IS_IOS && standalone) return '目前是從「主畫面圖示」開啟的，iPad 在這種模式下不能語音辨識。請改用 Safari 直接開啟這個網址。';
  if(/Line\//i.test(UA)) return '目前是在 LINE 裡面開啟的，不能使用麥克風。請點右下角「⋯」→「用 Safari 開啟」。';
  if(/FBAN|FBAV|Instagram|MicroMessenger/i.test(UA)) return '目前是在 App 內建瀏覽器開啟的，不能使用麥克風。請改用 Safari 開啟這個網址。';
  if(IS_IOS && /CriOS|FxiOS|EdgiOS/.test(UA)) return 'iPad 上的 Chrome／Firefox／Edge 不支援語音辨識，請改用 Safari 開啟。';
  if(!SRc) return '這個瀏覽器不支援語音辨識（iPad 請用 Safari，Android／電腦請用 Chrome）。';
  if(!window.isSecureContext) return '請用 https 網址開啟（GitHub Pages），才能使用麥克風。';
  return '';
}
function srErrorText(code){
  const ios=IS_IOS;
  return ({
    'not-allowed': ios ? '麥克風被拒絕：請點網址列左邊的「大小」(ㄚA) 圖示 →「網站設定」→ 麥克風選「允許」；或到 設定 → Safari → 麥克風 → 允許。改完重新整理頁面。' : '麥克風被拒絕：請點網址列的鎖頭圖示，允許麥克風後重新整理。',
    'service-not-allowed': ios ? '語音辨識服務沒有開：請到「設定 → Siri」開啟 Siri（iPad 的網頁語音辨識需要 Siri），並確認「設定 → 一般 → 鍵盤 → 啟用聽寫」已開。學校管理的 iPad 若鎖住 Siri，請洽資訊組。' : '語音辨識服務沒有開啟。',

    'network': '語音辨識需要網路，請確認 Wi-Fi 已連線。',
    'no-speech': '沒有聽到聲音，請靠近一點再說一次。'
  })[code] || ('辨識發生問題（代碼：'+code+'）');
}
function micTest(out){
  const SRc = window.SpeechRecognition||window.webkitSpeechRecognition;
  const env=srEnvProblem(); if(env){ out.className='mictest bad'; out.textContent=env; return; }
  let r; try{ r=new SRc(); }catch(e){ out.className='mictest bad'; out.textContent='無法建立語音辨識：'+e.message; return; }
  r.lang='zh-TW'; r.interimResults=true; r.continuous=false;
  let got='', err='';
  out.className='mictest'; out.textContent='正在聽…請說「蘋果」';
  r.onstart=()=>{ out.textContent='麥克風已開啟，請說「蘋果」'; };
  r.onresult=e=>{ got=[...e.results].map(x=>x[0].transcript).join(''); out.textContent='聽到：'+got; };
  r.onerror=e=>{ err=e.error; };
  r.onend=()=>{ if(got){ out.className='mictest ok'; out.textContent='✓ 麥克風和語音辨識都正常，聽到：「'+got+'」'; } else { out.className='mictest bad'; out.textContent= err ? srErrorText(err) : '麥克風有開，但沒有收到辨識結果。請確認「設定 → Siri」已開啟、網路正常，再試一次。'; } };
  try{ r.start(); }catch(e){ out.className='mictest bad'; out.textContent='無法啟動：'+e.message; }
  setTimeout(()=>{ try{ r.stop(); }catch(e){} },6000);
}

const STAGES=[]; // 依序攤平
ISLANDS.forEach((isl,ii)=>isl.stages.forEach((s,si)=>{
  const boss=s.includes('boss'), phs=s.filter(x=>x!=='boss');
  const kind = boss?'boss':(phs.length>1?'pair':'single');
  const label = kind==='boss' ? '魔王關' : phs.join(kind==='pair'?'↔':'');
  STAGES.push({id:isl.id+'-'+(si+1), isl:ii, si, phs, kind, label, gi:STAGES.length});
}));
const FRONT_ONLY='ㄅㄆㄇㄈ', BOTH='ㄐㄑㄒㄗㄘㄙ';
function viewFor(ph, stage){ if(stage && ISLANDS[stage.isl].id==='i9') return 'both'; if(FRONT_ONLY.includes(ph)) return 'front'; if(BOTH.includes(ph)) return 'both'; return 'side'; }

/* ===== 資料 ===== */
const KEY='artic-practice-v1', PIN='9898';
let DB={students:[],cur:null,sessions:[],opts:{zy:true,pic:true,autoListen:true},prog:{}};
function loadDB(){ try{ const t=localStorage.getItem(KEY); if(t){ const d=JSON.parse(t); DB=Object.assign(DB,d); DB.opts=Object.assign({zy:true,pic:true,autoListen:true},d.opts||{}); DB.prog=d.prog||{}; } }catch(e){} }
function saveDB(){ try{ localStorage.setItem(KEY,JSON.stringify(DB)); }catch(e){ toast('無法儲存紀錄（瀏覽器儲存空間被關閉）'); } }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function curStu(){ return DB.students.find(s=>s.id===DB.cur)||null; }
function prog(sid){ sid=sid||DB.cur; return DB.prog[sid]||(DB.prog[sid]={best:{},passed:{},gems:{},open:{}}); }
function stuSessions(sid){ return DB.sessions.filter(s=>s.sid===(sid||DB.cur)); }
function stageUnlocked(st){
  if(!curStu()) return st.gi===0;
  const P=prog(); if(P.open[ISLANDS[st.isl].id]) return true;
  return st.gi===0 || !!P.passed[STAGES[st.gi-1].id];
}
function islandUnlocked(ii){ return stageUnlocked(STAGES.find(s=>s.isl===ii)); }
function islandDone(ii){ const P=prog(); return STAGES.filter(s=>s.isl===ii).every(s=>P.passed[s.id]); }
function islandStars(ii){ const P=prog(); return STAGES.filter(s=>s.isl===ii).reduce((a,s)=>a+(P.best[s.id]||0),0); }
function totalStars(){ const P=curStu()?prog():{best:{}}; return Object.values(P.best).reduce((a,b)=>a+b,0); }
function nextStage(){ const P=curStu()?prog():{passed:{}}; return STAGES.find(s=>!P.passed[s.id] && stageUnlocked(s)) || null; }

/* ===== 海圖 ===== */
const MAP_V=[[24,0],[72,1],[30,2],[74,3],[26,4],[70,5],[30,6],[72,7],[44,8]];
const MAP_H=[[16,0],[50,0],[84,0],[84,1],[50,1],[16,1],[16,2],[50,2],[84,2]];
function mapLayout(){ // 橫向（寬螢幕）：3 排蛇形航線一頁看完；窄螢幕：直向
  const sea=$('sea'), W=sea.clientWidth||window.innerWidth;
  if(W>=700){ const top=sea.getBoundingClientRect().top+window.scrollY; const avail=Math.max(480, window.innerHeight-top-30);
    const rowH=Math.max(160, Math.min(220, (avail-20)/3)); return {pos:MAP_H, rowH, off:rowH/2+18, H:rowH*3+30, horiz:true}; }
  return {pos:MAP_V, rowH:150, off:120, H:MAP_V.length*150+90, horiz:false};
}
function goMap(){ show('map'); renderMap(); }
function renderMap(){
  const stu=curStu();
  $('mapTitle').textContent = stu ? `${stu.name} 的冒險海圖` : '構音冒險島';
  $('mapEyebrow').textContent = stu ? '點一座島，開始闖關' : '先按上方「＋」新增學生';
  $('treasures').innerHTML = ISLANDS.map((isl,i)=>`<span class="${stu&&islandDone(i)?'got':''}" title="${isl.prizeName}">${isl.prize}</span>`).join('');
  const sea=$('sea'), L=mapLayout();
  sea.style.height=L.H+'px';
  const nx=nextStage();
  sea.innerHTML = `<svg class="route" aria-hidden="true"></svg>` + ISLANDS.map((isl,i)=>{
    const [x,r]=L.pos[i], y=r*L.rowH+L.off, un=islandUnlocked(i), dn=stu&&islandDone(i), here= nx && nx.isl===i;
    const total=STAGES.filter(s=>s.isl===i).length*3;
    return `<button type="button" class="isle ${un?'':'locked'} ${dn?'done':''} ${here?'here':''}" data-i="${i}" style="left:${x}%;top:${y}px;--isle:${isl.color}" aria-label="${isl.name}${un?'':'（未解鎖）'}">
      ${here?'<span class="flag" aria-hidden="true">🚩</span>':''}
      <span class="blob"><span class="num">${i+1}</span>${isl.em}</span>
      <span class="nm">${isl.name}</span>
      <span class="st">${stu?'★ '+islandStars(i)+' / '+total:isl.sub}</span>
    </button>`; }).join('');
  requestAnimationFrame(drawRoute);
}
function drawRoute(){
  const sea=$('sea'), svg=sea.querySelector('svg.route'); if(!svg) return;
  const W=sea.clientWidth, L=mapLayout(); const pts=L.pos.map(([x,r])=>[x/100*W, r*L.rowH+L.off]);
  let d=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=1;i<pts.length;i++){ const a=pts[i-1], b=pts[i];
    if(L.horiz && Math.abs(a[0]-b[0])<2){ const bulge=(a[0]>W/2?1:-1)*Math.min(90,W*.1); d+=` C${a[0]+bulge},${a[1]} ${b[0]+bulge},${b[1]} ${b[0]},${b[1]}`; }
    else if(L.horiz){ const mx=(a[0]+b[0])/2; d+=` C${mx},${a[1]} ${mx},${b[1]} ${b[0]},${b[1]}`; }
    else { const my=(a[1]+b[1])/2; d+=` C${a[0]},${my} ${b[0]},${my} ${b[0]},${b[1]}`; } }
  svg.setAttribute('viewBox',`0 0 ${W} ${sea.clientHeight}`); svg.innerHTML=`<path d="${d}"/>`;
}
let rzT=null; window.addEventListener('resize',()=>{ clearTimeout(rzT); rzT=setTimeout(()=>{ if(!$('scr-map').hidden) renderMap(); },150); });

/* ===== 嘴型 ===== */
let MH=[];
function stopMouths(){ MH.forEach(h=>h.stop()); MH=[]; }
function mountMouths(box, ph, wrong, stage){
  stopMouths(); const v=viewFor(ph,stage);
  const wrap=document.createElement('div'); wrap.className='mouths';
  if(v==='front'||v==='both'){ const d=document.createElement('div'); d.className='mouth'; wrap.appendChild(d); MH.push(LIPS.mount(d,ph)); }
  if(v==='side'||v==='both'){ const d=document.createElement('div'); d.className='mouth'; wrap.appendChild(d); MH.push(MOUTH.mount(d,{target:ph,wrong})); }
  box.prepend(wrap);
}

function listenPair(st){ if(st.kind==='single') return [st.phs[0], CONTRAST[st.phs[0]]]; if(st.kind==='pair') return st.phs.slice(0,2); return st.phs; }

/* ===== 出題 ===== */
function mkItem(ph,[w,py,pic]){ const t=targetSyl(w,py).map((s,i)=>s.ini===ph?i:-1).filter(i=>i>=0); return {ph,w,py,pic,t,tries:[],done:false,pass:false,first:false,skip:false}; }
function pickItems(st){
  const used=new Set(), say=[], follow=[];
  let order;
  if(st.kind==='single') order=Array(7).fill(st.phs[0]);
  else { const base=shuffle(st.phs); order=[]; for(let i=0;i<7;i++) order.push(base[i%base.length]); order=shuffle(order); }
  const pools={}; st.phs.forEach(p=>pools[p]=shuffle(BANK[p]||[]));
  for(const ph of order){ const pool=pools[ph]; const x=pool.find(x=>!used.has(x[0])); if(!x) continue; used.add(x[0]); (follow.length<2?follow:say).push(mkItem(ph,x)); }
  return {follow, say:say.slice(0,5)};
}
function pickListen(st){
  let pair=listenPair(st); if(pair.length>2) pair=shuffle(pair).slice(0,2);
  const qs=[]; const sides=shuffle([0,1]);
  for(let i=0;i<2;i++){ const ph=pair[sides[i%2]]; const cand=shuffle((BANK[ph]||[]).filter(([w,py])=>parsePy(py.split(' ')[0]).ini===ph)); const x=cand[0]||BANK[ph][0]; qs.push({ph,w:x[0],opts:pair.slice()}); }
  return qs;
}
function pickSentence(st){ const all=st.phs.flatMap(p=>(SENTS[p]||[]).map(([w,py])=>({ph:p,w,py}))); const s=shuffle(all)[0]; const syl=targetSyl(s.w,s.py); s.t=syl.map((x,i)=>st.phs.includes(x.ini)?i:-1).filter(i=>i>=0); s.tries=[]; s.ok=false; return s; }

/* ===== 遊玩狀態 ===== */
let G=null; // {st, step, listen, li, lok, follow, fi, say, si, review, ri, inReview, sent}
const STEPS=['聽聽看','跟我說','自己說','挑戰句'];
function startStage(st){
  const {follow,say}=pickItems(st);
  G={st, step:0, listen:pickListen(st), li:0, lok:0, follow, fi:0, say, si:0, review:[], ri:0, inReview:false, sent:pickSentence(st), ts:Date.now(), id:uid()};
  if(!HAS_TTS){ G.step=1; toast('這台裝置沒有語音朗讀，略過「聽聽看」'); }
  show('play'); renderStep();
}
function curItem(){ if(!G) return null; if(G.step===1) return G.follow[G.fi]; if(G.step===2) return G.inReview? G.review[G.ri] : G.say[G.si]; if(G.step===3) return G.sent; return null; }
function renderPills(){ $('playStars').textContent='⭐ '+totalStars(); $('pills').innerHTML=STEPS.map((n,i)=>`<span class="pill ${i===G.step?'cur':i<G.step?'pdone':''}">${i+1} ${n}</span>`).join(''); }
function renderDots(){
  if(G.step!==2){ $('dots').innerHTML=''; return; }
  $('dots').innerHTML=G.say.map((x,i)=>{ const s=x.done?(x.skip?0:x.first?1:x.pass?2:3):-1; const ic=s===1?'★':s===2?'✓':s===3?'✗':s===0?'–':(i+1); return `<span class="dot ${!G.inReview&&i===G.si?'cur':''} ${s>0?'s'+s:''}">${ic}</span>`; }).join('');
}
function setHint(t){ $('hint').textContent=t||''; }
function setSay(cls,html){ $('say').className='say '+cls; $('say').innerHTML=html; }
function ruby(w,py,t){ const syl=targetSyl(w,py); return Array.from(w).map((c,i)=>{ const cls=t&&t.includes(i)?' class="tg"':''; return DB.opts.zy? `<ruby${cls}>${esc(c)}<rt>${esc(syl[i].zy)}</rt></ruby>` : `<span${cls}>${esc(c)}</span>`; }).join(''); }
function setMic(on){ $('btnMic').disabled = !on || !SR || !!srEnvProblem(); }

function renderStep(){
  stopAll(); renderPills(); renderDots();
  $('tipBox').innerHTML=''; $('btnNext').hidden=true; $('choices').hidden=true; $('actions').hidden=false;
  $('teacherTools').hidden = G.step===0; $('tBtns').hidden=true; $('tGear').setAttribute('aria-expanded','false');

  if(G.step===0){ // 聽聽看
    const q=G.listen[G.li];
    $('tag').innerHTML=`<b>👂</b><span class="eyebrow">聽聽看 ${G.li+1} / ${G.listen.length}</span>`;
    $('banner').textContent='仔細聽，是哪一個音？';
    $('pic').hidden=true; $('word').className='word'; $('word').innerHTML='';
    $('actions').hidden=true;

    setSay('idle','<span>聽到的詞，開頭是哪一個注音？按下答案。</span>');
    $('replay').onclick=()=>speak(q.w,.8);
    c.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answerListen(b));
    setTimeout(()=>{ if(G&&G.step===0) speak(q.w,.8); },400);
    return;
  }
  const x=curItem();
  if(G.step===3){
    $('tag').innerHTML=`<b>💎</b><span class="eyebrow">挑戰句</span>`;
    $('banner').textContent='挑戰句：完整唸出這句話';
    $('pic').hidden=true; $('word').className='word sent'; $('word').innerHTML=ruby(x.w,x.py,x.t);
    setSay('idle','<span>按麥克風，把整句話唸出來。說對可以拿到寶石！</span>');
  } else {
    $('word').className='word';
    $('tag').innerHTML=`<b>${x.ph}</b><span class="eyebrow">${G.step===1?`跟我說 ${G.fi+1} / ${G.follow.length}`:G.inReview?`複習泡泡 ${G.ri+1} / ${G.review.length}`:`自己說 ${G.si+1} / 5`}</span>`;
    $('banner').textContent = G.step===1 ? '先聽、看嘴型，再跟著說' : G.inReview ? '🫧 複習泡泡：再挑戰一次！' : '';
    $('pic').hidden=!(DB.opts.pic && (x.pic||PICS[x.w])); $('pic').innerHTML=picHTML(x.w,x.pic);
    $('word').innerHTML=ruby(x.w,x.py,x.t);
    setSay('idle', G.step===1? '<span>聽完示範後，按麥克風跟著說。</span>' : '<span>看著卡片，按麥克風大聲唸出來。</span>');
  }

  if(G.step===1){ showTip(x, null, true); setTimeout(()=>{ if(G && curItem()===x) modelThenListen(x,.75); },500); }
}
function answerListen(b){
  const q=G.listen[G.li]; if(q.answered) return; q.answered=true;
  const ok=b.dataset.p===q.ph; q.ok=ok; if(ok) G.lok++;
  $('choices').querySelectorAll('.choice').forEach(c=>{ if(c.dataset.p===q.ph) c.classList.add('right'); else if(c===b) c.classList.add('wrong'); });
  $('word').innerHTML=ruby(q.w, (BANK[q.ph].find(x=>x[0]===q.w)||[q.w,''])[1]||'', [0]);
  if(ok){ chime(); setSay('ok',`<h3>答對了！</h3><div class="heard">是「${esc(q.w)}」的 ${q.ph}</div>`); }
  else { buzz(); setSay('err',`<h3>再聽一次</h3><div class="compare">是 <span class="z t">${q.ph}</span> 不是 <span class="z p">${esc(b.dataset.p)}</span></div>`); setTimeout(()=>speak(q.w,.6),500); }

function showNext(autoMs){ $('btnNext').hidden=false; $('btnNext').textContent='下一題 →'; if(autoMs) nextTimer=setTimeout(next,autoMs); }
function next(){
  clearTimeout(nextTimer); if(!G) return;
  if(G.step===0){ if(G.li<G.listen.length-1){ G.li++; } else { G.step=1; } return renderStep(); }
  if(G.step===1){ if(G.fi<G.follow.length-1){ G.fi++; } else { G.step=2; } return renderStep(); }
  if(G.step===2){
    if(!G.inReview){ if(G.si<4){ G.si++; return renderStep(); }
      G.review=G.say.filter(x=>!x.pass&&!x.skip); if(G.review.length){ G.review.forEach(x=>{ x.done=false; }); G.inReview=true; G.ri=0; return renderStep(); } }
    else if(G.ri<G.review.length-1){ G.ri++; return renderStep(); }
    G.inReview=false; G.step=3; return renderStep();
  }
  if(G.step===3) return finishStage();
}

/* 回饋 */
function showTip(x, a, intro){
  const box=$('tipBox'); const T=x.ph;
  let cue=''; if(a&&a.v==='sub') cue=cueFor(T,a.prod); else if(a&&a.v==='omit') cue='先把「'+T+'」的位置擺好，再說出來。';
  box.innerHTML=`<div class="tip">${cue?`<div><b>小提醒：</b>${esc(cue)}</div>`:''}<div><b>${T} 怎麼發：</b>${esc(TIPS[T]||'')}</div></div>`;
  mountMouths(box, T, a&&a.v==='sub'?a.prod:null, G&&G.st);
}
function burst(e){ const b=document.createElement('div'); b.className='burst'; b.textContent=e; $('card').appendChild(b); setTimeout(()=>b.remove(),1000); }
function judgeHeard(x, alts){
  if(!G || curItem()!==x || x.done) return;
  let a={v:'none'};
  if(G.step===3){ try{ a=PY_OK? judgeSentence(x,alts[0],pyFn) : {v: alts[0].replace(/[\s，。！？,.!?]/g,'').includes(x.w)?'ok':'err'}; }catch(e){} }
  else { try{ a=PY_OK? judgeWord(x,alts[0],pyFn) : (alts[0].includes(x.w)?{v:'ok'}:{v:'none'}); }catch(e){} }
  if(a.v==='none'){ setSay('wait',`<h3>再說一次</h3><div class="heard">聽到：${esc(alts[0])}</div>`); setHint('沒有聽清楚，請靠近一點再說'); return; }
  x.tries.push({heard:alts[0], zy:a.heardZy||'', ok:a.v==='ok', v:a.v, prod:a.prod||'', note:a.note||''});
  if(a.v==='ok') onRight(x); else onWrong(x,a);
}
function onRight(x){
  x.done=true; x.pass=true; x.first = x.tries.length===1 && x.tries[0].ok && !G.inReview;
  if(G.inReview) x.review=true;
  if(G.step===3) x.ok=true;
  chime(); burst(G.step===3?'💎':x.first?'⭐':'👍');
  const last=x.tries[x.tries.length-1]||{};
  const title = G.step===3?'挑戰成功！拿到寶石 💎' : G.step===1?'跟得很好！' : x.first?'太棒了！一次就說對':'改正了！過關';
  setSay('ok',`<h3>${title}</h3>${last.heard?`<div class="heard">聽到：${esc(last.heard)} <small>${esc(last.zy)}</small></div>`:''}`);
  stopMouths(); $('tipBox').innerHTML=''; setMic(false); setHint('');
  renderDots(); showNext(1500);
}
function onWrong(x,a){
  buzz();
  const n=x.tries.length, step=G.step;
  const maxT = step===2 && !G.inReview ? 3 : (step===2 ? 1 : 2);
  const T=x.ph||'';
  let cmp='';
  if(step===3){ cmp = a.note? `<div class="heard">${esc(a.note)}</div>`:''; }
  else if(a.v==='sub') cmp=`<div class="compare">要說 <span class="z t">${T}</span> 你說成 <span class="z p">${esc(a.prod)}</span></div>`;
  else if(a.v==='omit') cmp=`<div class="compare">開頭的 <span class="z t">${T}</span> 不見了</div>`;
  else if(a.v==='teacher') cmp=`<div class="compare">老師說：這個 <span class="z t">${T||'句子'}</span> 還不夠清楚</div>`;
  const last=x.tries[n-1]||{};
  const heard = last.heard?`<div class="heard">聽到：${esc(last.heard)} <small>${esc(last.zy)}</small></div>`:'';
  if(n<maxT){
    if(step===2 && !G.inReview && n===2){
      setSay('err',`<h3>聽一聽，跟著說一次</h3>${heard}${cmp}`);
      if(step!==3) showTip(x,a);
      setHint('先聽慢速示範，再按麥克風跟著說');
      setTimeout(()=>{ if(G && curItem()===x && !x.done) modelThenListen(x,.55); },600);
    } else {
      setSay('err',`<h3>差一點！再試一次</h3>${heard}${cmp}`);
      if(step!==3) showTip(x,a); else $('tipBox').innerHTML='';
      setHint(step===1||step===3?'先聽正確讀音，再試一次':'看看嘴型，再按麥克風說一次');
      if(step===1||step===3) setTimeout(()=>{ if(G && curItem()===x && !x.done) modelThenListen(x, step===3?.7:.6); },600);
    }
  } else {
    x.done=true; x.pass=false; x.first=false;
    const msg = step===2 && !G.inReview ? '沒關係，等一下複習泡泡再挑戰' : '沒關係，下次再練';
    setSay('err',`<h3>${msg}</h3>${heard}${cmp}`);
    if(step!==3) showTip(x,a);
    setMic(false); setHint('');
    setTimeout(()=>{ if(G && curItem()===x) speak(x.w,.6); },600);
    renderDots(); showNext(0);
  }
}
$('tOk').onclick=()=>{ const x=curItem(); if(!x||G.step===0) return; stopAll(); if(x.done&&x.pass) return; x.done=false; x.tries.push({heard:'',zy:'',ok:true,v:'teacher',prod:''}); x.teacher=true; onRight(x); };
$('tBad').onclick=()=>{ const x=curItem(); if(!x||G.step===0) return; stopAll();
  if(x.done&&x.pass){ x.done=false; x.pass=false; x.first=false; if(G.step===3) x.ok=false; const l=x.tries[x.tries.length-1]; if(l){ l.ok=false; l.v='teacher'; } x.teacher=true; onWrong(x,{v:'teacher'}); }
  else if(!x.done){ x.tries.push({heard:'',zy:'',ok:false,v:'teacher',prod:''}); x.teacher=true; onWrong(x,{v:'teacher'}); } };
$('tSkip').onclick=()=>{ const x=curItem(); if(!x||G.step===0) return; stopAll(); x.done=true; x.pass=false; x.first=false; if(!G.inReview) x.skip=true; renderDots(); next(); };
$('tGear').onclick=()=>{ const open=$('tBtns').hidden; $('tBtns').hidden=!open; $('tGear').setAttribute('aria-expanded',String(open)); };
$('btnListen').onclick=()=>{ const x=curItem(); if(x) speak(x.w,.75); };
$('btnMouth').onclick=()=>{ const x=curItem(); if(!x) return; if(G.step===3){ const ph=G.st.phs[0]; $('tipBox').innerHTML=`<div class="tip"><div><b>${ph} 怎麼發：</b>${esc(TIPS[ph]||'')}</div></div>`; mountMouths($('tipBox'),ph,null,G.st); return; } if($('tipBox').querySelector('.mouths')) return; showTip(x,null); };
$('btnQuit').onclick=()=>{ const st=G&&G.st; leavePlay(true); if(st) openIsle(st.isl); else goMap(); };
function leavePlay(saveIt){ stopAll(); if(G && saveIt && G.say.some(x=>x.done)){ saveSession(false); toast('已儲存這次練習（未完成）'); } G=null; }

/* ===== 結算 ===== */
function stageResult(){
  const say=G.say.filter(x=>!x.skip), passed=say.filter(x=>x.pass).length, firsts=say.filter(x=>x.first).length;
  const pass = passed>=3, stars = !pass?0: firsts>=5?3: firsts>=3?2:1;
  return {passed, firsts, pass, stars, gem: !!G.sent.ok};
}
function saveSession(complete){
  const R=stageResult(), st=G.st, isl=ISLANDS[st.isl];
  const items=G.say.filter(x=>x.done).map(i=>({ph:i.ph,w:i.w,first:i.first,pass:i.pass,skip:i.skip,teacher:!!i.teacher,review:!!i.review,tries:i.tries}));
  if(items.length) DB.sessions.push({id:G.id,sid:DB.cur,ts:G.ts,mode:'stage',stage:st.id,target:`${isl.name}・${st.kind==='boss'?'魔王關':st.label}`,
    items, listen:{n:G.listen.filter(q=>q.answered).length, ok:G.lok}, follow:G.follow.filter(x=>x.done).map(x=>({w:x.w,ok:x.pass,tries:x.tries.length})),
    sent: G.sent.tries.length?{w:G.sent.w,ok:!!G.sent.ok,tries:G.sent.tries.length}:null, stars:complete?R.stars:0, pass:complete&&R.pass, complete});
  if(complete){ const P=prog(); if(R.pass){ P.passed[st.id]=true; P.best[st.id]=Math.max(P.best[st.id]||0,R.stars); } if(R.gem) P.gems[st.id]=true; }
  saveDB(); renderStu();
}
function finishStage(){
  stopAll();
  const st=G.st, isl=ISLANDS[st.isl], wasDone=islandDone(st.isl);
  const R=stageResult(); saveSession(true);
  const nowDone=islandDone(st.isl);
  const items=G.say;
  const nxt = STAGES[st.gi+1];
  const title = !R.pass ? '差一點點！再挑戰一次' : R.stars===3 ? '完美過關！' : R.stars===2 ? '好厲害，過關了！' : '過關了！';
  $('doneBox').innerHTML=`<div class="eyebrow">${esc(isl.name)}・${st.kind==='boss'?'魔王關':esc(st.label)+' 關'}</div>
    <h1>${title}</h1>
    <div class="bigstars" aria-label="${R.stars} 顆星">${starHTML(R.stars)}</div>
    <div class="muted">自己說：一次就說對 ${R.firsts} 個・最後說對 ${R.passed} 個（說對 3 個就過關）</div>
    <div class="gem">聽聽看 ${G.lok}/${G.listen.length}　・　挑戰句 ${R.gem?'💎 成功':'還沒拿到寶石'}</div>
    ${nowDone&&!wasDone?`<div class="treasure" aria-hidden="true">${isl.prize}</div><h2>獲得「${esc(isl.prizeName)}」！${ISLANDS[st.isl+1]?'下一座島「'+esc(ISLANDS[st.isl+1].name)+'」開放了！':'你完成了全部的島嶼！'}</h2>`:''}
    <div class="rlist">${items.map(i=>{ const s=i.skip?0:i.first?1:i.pass?2:3; const errs=[...new Set(i.tries.filter(t=>!t.ok&&t.prod&&t.prod!=='∅').map(t=>t.prod))];
      const d= s===1?'第一次就說對': s===2?(i.review?'複習泡泡時說對了':`試了 ${i.tries.length} 次`)+(errs.length?'，曾說成 '+errs.join('、'):''): s===0?'跳過': (errs.length?'常說成 '+errs.join('、'):'還需要練習');
      return `<div class="ritem"><span class="ic">${s===1?'⭐':s===2?'✅':s===0?'➖':'🔁'}</span><span><span class="w">${esc(i.w)}</span><br><span class="d">${esc(d)}</span></span><span class="st s${s}">${s===1?'一次過關':s===2?'改正過關':s===0?'跳過':'待加強'}</span></div>`; }).join('')}</div>
    <div class="row" style="justify-content:center">
      ${R.pass && nxt && stageUnlocked(nxt) ? `<button class="btn primary big" type="button" id="dNext">下一關 →</button>`:''}
      <button class="btn ${R.pass?'':'primary big'}" type="button" id="dAgain">再挑戰一次</button>
      <button class="btn" type="button" id="dIsle">回${esc(isl.name)}</button>
      <button class="btn" type="button" id="dMap">回海圖</button>
    </div>`;
  G=null; show('done');
  if($('dNext')) $('dNext').onclick=()=>{ if(nxt.isl!==st.isl) openIsle(nxt.isl); else openIntro(nxt); };
  $('dAgain').onclick=()=>openIntro(st);
  $('dIsle').onclick=()=>openIsle(st.isl);
  $('dMap').onclick=goMap;
}

/* ===== 聲音 ===== */
let AC=null, nextTimer=null;
function tone(seq){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); let t=AC.currentTime; seq.forEach(([f,d])=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.18,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g).connect(AC.destination); o.start(t); o.stop(t+d+.02); t+=d*.8; }); }catch(e){} }
const chime=()=>tone([[660,.14],[880,.14],[1320,.3]]);
const buzz=()=>tone([[440,.16],[370,.26]]);
const HAS_TTS='speechSynthesis' in window;
let voice=null;
function pickVoice(){ try{ const vs=speechSynthesis.getVoices(); voice=vs.find(v=>/zh[-_]TW/i.test(v.lang))||vs.find(v=>/zh/i.test(v.lang))||null; }catch(e){} }
if(HAS_TTS){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function speak(text,rate){
  return new Promise(res=>{
    if(!HAS_TTS){ res(); return; }
    try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='zh-TW'; if(voice) u.voice=voice; u.rate=rate||.8;
      const x=curItem(); setMic(false); let done=false; const back=()=>{ if(done) return; done=true; const c=curItem(); if(G && c && !c.done) setMic(true); res(); };
      u.onend=u.onerror=back; speechSynthesis.speak(u); setTimeout(back,4500);
    }catch(e){ res(); }
  });
}

/* ===== 語音辨識 ===== */
let PY_OK=false;
function pyFn(t){ return pinyinPro.pinyin(t,{toneType:'num',type:'array',v:true}); }
try{ if(window.pinyinPro){ PY_OK=true; try{ pinyinPro.customPinyin({'車':'chē','餅乾':'bǐng gān','長頸鹿':'cháng jǐng lù','蘋果':'píng guǒ','咖啡':'kā fēi'}); }catch(e){} } }catch(e){}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null, recTimer=null;
function stopAll(){
  clearTimeout(recTimer); clearTimeout(nextTimer); stopMouths();
  if(rec){ try{ rec.onend=null; rec.onresult=null; rec.onerror=null; rec.abort(); }catch(e){} rec=null; }
  $('btnMic').classList.remove('on');
  try{ if(HAS_TTS) speechSynthesis.cancel(); }catch(e){}
}
let autoBlocked=false;
function canAutoListen(){ return DB.opts.autoListen && !autoBlocked && SR && !srEnvProblem(); }
function modelThenListen(x,rate){
  return speak(x.w,rate).then(()=>{ if(!canAutoListen()) return; setTimeout(()=>{ if(G && curItem()===x && !x.done && !rec) startRec(true); },350); });
}
function startRec(auto){
  if(!SR||!G) return;
  if(rec){ try{ rec.stop(); }catch(e){} return; }
  try{ if(HAS_TTS) speechSynthesis.cancel(); }catch(e){}
  const x=curItem(); if(!x||x.done) return;
  const r=new SR(); rec=r;
  r.lang='zh-TW'; r.interimResults=true; r.continuous=false; r.maxAlternatives=3;
  let fin=null, lastInter='';
  r.onresult=e=>{ let inter=''; for(let i=e.resultIndex;i<e.results.length;i++){ const res=e.results[i]; if(res.isFinal) fin=[...res].map(a=>a.transcript.trim()).filter(Boolean); else inter+=res[0].transcript; } if(inter) lastInter=inter.trim(); setHint(inter?('聽到：'+inter):'正在聽…'); };
  r.onerror=e=>{ if(e.error==='aborted') return; if(auto && (e.error==='not-allowed'||e.error==='service-not-allowed')){ autoBlocked=true; setHint('按麥克風開始說'); return; } if(auto && e.error==='no-speech'){ setHint('按麥克風再說一次'); return; } setHint(srErrorText(e.error)); };
  r.onend=()=>{ clearTimeout(recTimer); rec=null; $('btnMic').classList.remove('on'); if(fin&&fin.length) judgeHeard(x,fin); else if(lastInter) judgeHeard(x,[lastInter]); else if(/正在聽/.test($('hint').textContent)) setHint('沒聽清楚，再按一次麥克風'); };
  try{ r.start(); }catch(e){ rec=null; if(auto){ autoBlocked=true; setHint('按麥克風開始說'); } else setHint('無法啟動麥克風'); return; }
  $('btnMic').classList.add('on'); setHint(auto?'換你說了，正在聽…':'正在聽…');
  recTimer=setTimeout(()=>{ try{ r.stop(); }catch(e){} }, G.step===3?9000:6000);
}
$('btnMic').onclick=()=>startRec(false);
document.addEventListener('keydown',e=>{ if($('scr-play').hidden||e.target.matches('input,select')) return; if(e.code==='Space'){ e.preventDefault(); startRec(false); } else if(e.key==='Enter' && !$('btnNext').hidden){ next(); } });

  $('tBox').querySelectorAll('[data-isl]').forEach(c=>c.onchange=()=>{ const P=prog(); if(c.checked) P.open[c.dataset.isl]=true; else delete P.open[c.dataset.isl]; saveDB(); });
  $('oZy').onchange=e=>{ DB.opts.zy=e.target.checked; saveDB(); }; $('oPic').onchange=e=>{ DB.opts.pic=e.target.checked; saveDB(); }; $('oAuto').onchange=e=>{ DB.opts.autoListen=e.target.checked; autoBlocked=false; saveDB(); };
  $('tMic').onclick=()=>{ const o=$('tMicOut'); o.hidden=false; micTest(o); };
  if($('tReset')){ $('tReset').onclick=()=>$('tResetC').hidden=false; $('tResetN').onclick=()=>$('tResetC').hidden=true;
    $('tResetY').onclick=()=>{ DB.prog[DB.cur]={best:{},passed:{},gems:{},open:{}}; saveDB(); renderStu(); renderTeacher(); toast('已清除闖關進度'); }; }
}

/* ===== 學習紀錄 ===== */
let selPh=null;
const ALLPH=DATA.bank.map(b=>b[0]);
function itemStatus(it){ return it.skip?0 : it.first?1 : it.pass?2 : 3; }
function phStats(sid){ const m={}; stuSessions(sid).slice().sort((a,b)=>a.ts-b.ts).forEach(s=>s.items.forEach(it=>{ if(it.skip) return; (m[it.ph]||(m[it.ph]=[])).push({...it,ts:s.ts,sesId:s.id}); })); return m; }
function recentRate(list){ const l=list.slice(-10); if(!l.length) return null; return Math.round(l.filter(i=>i.first).length/l.length*100); }
function grade(r){ return r==null?'':r>=80?'g3':r>=50?'g2':'g1'; }
function renderLog(){
  const w=$('logWrap'), stu=curStu();
  if(!stu){ w.innerHTML='<div class="sect"><h2>還沒有學生</h2><p class="muted" style="margin:0">先按上方「＋」新增學生並完成一關，這裡就會出現紀錄。</p></div>'+dataTools(); bindTools(); return; }
  const ss=stuSessions().slice().sort((a,b)=>b.ts-a.ts);
  const all=ss.flatMap(s=>s.items.filter(i=>!i.skip));
  const firstRate = all.length? Math.round(all.filter(i=>i.first).length/all.length*100):null;
  const P=prog(), passedN=Object.keys(P.passed).length, gemsN=Object.keys(P.gems).length;
  const st=phStats();
  if(!selPh || !st[selPh]) selPh = Object.keys(st).sort((a,b)=>st[b].length-st[a].length)[0]||null;
  let h=`<div class="maphead"><div><div class="eyebrow">學習紀錄</div><h1>${esc(stu.name)}</h1></div></div>
  <div class="tiles">
    <div class="tile"><span class="k">通過關卡</span><span class="n">${passedN}<small> / ${STAGES.length}</small></span><span class="k">寶物 ${ISLANDS.filter((_,i)=>islandDone(i)).length} / 9・💎 ${gemsN}</span></div>
    <div class="tile"><span class="k">累積星星</span><span class="n">${totalStars()}<small> / ${STAGES.length*3}</small></span><span class="k">${ss.length?'最近 '+fmtDate(ss[0].ts,true):'尚未練習'}</span></div>
    <div class="tile"><span class="k">練習語詞</span><span class="n">${all.length}<small> 個</small></span><span class="k">${ss.length} 次練習</span></div>
    <div class="tile"><span class="k">一次就說對</span><span class="n">${firstRate==null?'—':firstRate}<small>${firstRate==null?'':' %'}</small></span><span class="k">「自己說」平均</span></div>
  </div>
  <div class="sect"><h2>各注音表現<small>最近 10 個詞「一次就說對」比例・綠 ≥80%　黃 50–79%　紅 &lt;50%・點選看趨勢</small></h2>
    <div class="phgrid">${ALLPH.map(p=>{ const r=recentRate(st[p]||[]); return `<button type="button" class="pc ${grade(r)} ${p===selPh?'sel':''}" data-p="${p}"><b>${p}</b><span>${r==null?'—':r+'%'}</span><span>${st[p]?st[p].length+' 詞':''}</span></button>`; }).join('')}</div>
  </div>`;
  if(selPh && st[selPh]) h+=phDetail(selPh, st[selPh]);
  h+=`<div class="sect"><h2>練習歷程<small>新到舊</small></h2>${ss.length?`<div class="tblwrap"><table><thead><tr><th>日期</th><th>關卡</th><th>結果</th><th>一次說對</th><th>過關詞數</th><th>語詞</th><th></th></tr></thead><tbody>${ss.map(s=>{ const its=s.items.filter(i=>!i.skip); const f=its.filter(i=>i.first).length, p=its.filter(i=>i.pass).length;
      const res = s.mode==='stage' ? (s.complete? (s.pass?'⭐'.repeat(s.stars||1):'未過關') : '未完成') + (s.sent&&s.sent.ok?' 💎':'') : '舊版練習';
      return `<tr><td class="num">${fmtDate(s.ts,true)}</td><td>${esc(s.target||'')}</td><td>${res}</td><td class="num">${f} / ${its.length}</td><td class="num">${p} / ${its.length}</td>
      <td><details><summary>${s.items.map(i=>esc(i.w)).join('、')}</summary><div class="chipline">${s.items.map(i=>{ const sc=itemStatus(i); const tr=i.tries.map(t=>t.heard?(t.ok?'✓':'✗')+t.heard:(t.ok?'✓老師':'✗老師')).join(' → '); return `<span class="wchip s${sc}">${esc(i.w)}：${esc(tr||'跳過')}${i.review?'（複習）':''}</span>`; }).join('')}${s.listen?`<span class="wchip">聽聽看 ${s.listen.ok}/${s.listen.n}</span>`:''}${s.sent?`<span class="wchip ${s.sent.ok?'s2':'s3'}">挑戰句「${esc(s.sent.w)}」${s.sent.ok?'成功':'未成功'}</span>`:''}</div></details></td>
      <td><button class="btn small" type="button" data-del="${s.id}">刪除</button></td></tr>`; }).join('')}</tbody></table></div>`:'<p class="muted" style="margin:0">完成第一關後，這裡會列出每一次的結果。</p>'}
    <div id="delConfirm" class="confirm" hidden><span>確定刪除這一筆練習紀錄？（星星與解鎖不受影響）</span><span class="row"><button class="btn small" type="button" id="delNo">取消</button><button class="btn small danger" type="button" id="delYes">刪除</button></span></div>
  </div>`;
  h+=dataTools();
  w.innerHTML=h;
  w.querySelectorAll('.pc').forEach(b=>b.onclick=()=>{ selPh=b.dataset.p; renderLog(); });
  let pendingDel=null;
  w.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ pendingDel=b.dataset.del; $('delConfirm').hidden=false; $('delConfirm').scrollIntoView({block:'nearest'}); });
  if($('delNo')){ $('delNo').onclick=()=>$('delConfirm').hidden=true; $('delYes').onclick=()=>{ DB.sessions=DB.sessions.filter(s=>s.id!==pendingDel); saveDB(); renderLog(); toast('已刪除'); }; }
  bindChart(); bindTools();
  const lm=$('logMouth'); if(lm){ mountMouths(lm, lm.dataset.p, null, null); }
}
function phDetail(p, list){
  const bySes=[]; const idx={};
  list.forEach(i=>{ if(!(i.sesId in idx)){ idx[i.sesId]=bySes.length; bySes.push({ts:i.ts,n:0,f:0,ps:0}); } const s=bySes[idx[i.sesId]]; s.n++; if(i.first)s.f++; if(i.pass)s.ps++; });
  const pts=bySes.map(s=>({ts:s.ts,v:Math.round(s.f/s.n*100),n:s.n,f:s.f,p:s.ps}));
  const subs={}; list.forEach(i=>i.tries.forEach(t=>{ if(!t.ok && t.prod && t.prod!=='∅') subs[t.prod]=(subs[t.prod]||0)+1; else if(!t.ok && t.prod==='∅') subs['省略']=(subs['省略']||0)+1; }));
  const words={}; list.forEach(i=>{ const w=words[i.w]||(words[i.w]={n:0,f:0}); w.n++; if(i.first)w.f++; });
  const hard=Object.entries(words).filter(([,v])=>v.f<v.n).sort((a,b)=>(a[1].f/a[1].n)-(b[1].f/b[1].n)).slice(0,6);
  const subList=Object.entries(subs).sort((a,b)=>b[1]-a[1]);
  const procs={}; subList.forEach(([s,c])=>{ if(s==='省略') return; processes(p,s).forEach(n=>procs[n]=(procs[n]||0)+c); });
  return `<div class="sect"><h2>${p} 的進步趨勢<small>每一點＝一次練習中「一次就說對」的比例</small></h2>
    <div class="detail">
      <div class="chart" id="chart" data-pts='${JSON.stringify(pts)}'></div>
      <div class="facts">
        <div><h3>常見錯誤</h3>${subList.length?`<ul>${subList.map(([s,c])=>`<li>${s==='省略'?'聲母省略':'說成 <b>'+s+'</b>'}：${c} 次</li>`).join('')}</ul>`:'<p class="muted" style="margin:0">沒有記錄到替代音</p>'}</div>
        ${Object.keys(procs).length?`<div><h3>可能的音韻歷程</h3><ul>${Object.entries(procs).map(([n,c])=>`<li>${n}（${c}）</li>`).join('')}</ul></div>`:''}
        <div><h3>還需要多練的詞</h3>${hard.length?`<div class="chipline">${hard.map(([w,v])=>`<span class="wchip s3">${esc(w)} ${v.f}/${v.n}</span>`).join('')}</div>`:'<p class="muted" style="margin:0">目前都能一次說對</p>'}</div>
        <div><h3>發音提示</h3><div id="logMouth" data-p="${p}"></div><p style="margin:0">${esc(TIPS[p]||'')}</p></div>
      </div>
    </div></div>`;
}
function bindChart(){
  const el=$('chart'); if(!el) return;
  const pts=JSON.parse(el.dataset.pts);
  const W=600,H=230,L=40,Rr=20,T=18,B=34, iw=W-L-Rr, ih=H-T-B;
  const x=i=> pts.length===1? L+iw/2 : L+i*(iw/(pts.length-1));
  const y=v=> T+ih-(v/100)*ih;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="一次就說對比例趨勢">`;
  [0,50,100].forEach(v=>{ s+=`<line class="grid" x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-8}" y="${y(v)+4}" text-anchor="end">${v}%</text>`; });
  const step=Math.max(1,Math.ceil(pts.length/7));
  pts.forEach((p,i)=>{ if(i%step===0||i===pts.length-1) s+=`<text class="ax" x="${x(i)}" y="${H-10}" text-anchor="middle">${fmtDate(p.ts)}</text>`; });
  if(pts.length>1){ const d=pts.map((p,i)=>(i?'L':'M')+x(i)+' '+y(p.v)).join(' '); s+=`<path class="area" d="${d} L${x(pts.length-1)} ${y(0)} L${x(0)} ${y(0)} Z"/><path class="ln" d="${d}"/>`; }
  pts.forEach((p,i)=>{ s+=`<circle class="pt" cx="${x(i)}" cy="${y(p.v)}" r="${i===pts.length-1?6:4.5}"/>`; });
  const lp=pts[pts.length-1]; s+=`<text class="lbl" x="${Math.min(x(pts.length-1),W-Rr-4)}" y="${y(lp.v)-12}" text-anchor="${pts.length>1?'end':'middle'}">${lp.v}%</text>`;
  pts.forEach((p,i)=>{ s+=`<rect data-i="${i}" x="${x(i)-Math.max(12,iw/pts.length/2)}" y="${T}" width="${Math.max(24,iw/pts.length)}" height="${ih}" fill="transparent"/>`; });
  s+='</svg><div class="tipbox" id="ctip" hidden></div>';
  el.innerHTML=s;
  const tip=$('ctip'), svg=el.querySelector('svg');
  el.querySelectorAll('rect[data-i]').forEach(r=>{
    const showTip=()=>{ const i=+r.dataset.i, p=pts[i]; const k=svg.getBoundingClientRect().width/W; tip.innerHTML=`${fmtDate(p.ts,true)}・一次說對 ${p.f}/${p.n}（${p.v}%）・過關 ${p.p}/${p.n}`; tip.style.left=(x(i)*k)+'px'; tip.style.top=(y(p.v)*k)+'px'; tip.hidden=false; };
    r.addEventListener('pointerenter',showTip); r.addEventListener('click',showTip); r.addEventListener('pointerleave',()=>tip.hidden=true);
  });
}
function dataTools(){
  return `<div class="sect"><h2>資料備份<small>紀錄只存在這台裝置的瀏覽器，清除瀏覽資料會不見，請定期備份</small></h2>
    <div class="row">
      <button class="btn" type="button" id="exCsv">匯出 Excel（CSV）</button>
      <button class="btn" type="button" id="exJson">備份全部資料</button>
      <label class="btn" style="cursor:pointer">匯入備份<input type="file" id="imJson" accept=".json,application/json" hidden></label>
      ${curStu()?'<button class="btn danger" type="button" id="delStu">刪除這位學生</button>':''}
    </div>
    <div id="stuConfirm" class="confirm" hidden><span>會刪除「${esc(curStu()?curStu().name:'')}」和他的全部紀錄與進度，無法復原。</span><span class="row"><button class="btn small" type="button" id="stuNo">取消</button><button class="btn small danger" type="button" id="stuYes">確定刪除</button></span></div>
  </div>`;
}
function download(name, text, type){ const blob=new Blob([text],{type}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); }
function bindTools(){
  const today=new Date().toISOString().slice(0,10);
  $('exCsv').onclick=()=>{
    const rows=[['學生','日期時間','關卡','注音','語詞','結果','嘗試次數','辨識內容','說成','關卡星星','挑戰句']];
    DB.sessions.slice().sort((a,b)=>a.ts-b.ts).forEach(s=>{ const st=DB.students.find(x=>x.id===s.sid); s.items.forEach(i=>{ const res=['跳過','一次說對','改正過關','未過關'][itemStatus(i)];
      rows.push([st?st.name:'',new Date(s.ts).toLocaleString('zh-TW'),s.target||'',i.ph,i.w,res,i.tries.length,i.tries.map(t=>t.heard||'(老師判定)').join(' / '),[...new Set(i.tries.filter(t=>!t.ok&&t.prod).map(t=>t.prod))].join(' '),s.stars??'',s.sent?(s.sent.ok?'成功':'未成功'):'']); }); });
    download(`構音冒險島紀錄_${today}.csv`, '﻿'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n'), 'text/csv;charset=utf-8');
  };
  $('exJson').onclick=()=>download(`構音冒險島備份_${today}.json`, JSON.stringify({app:'artic-practice',v:2,students:DB.students,sessions:DB.sessions,prog:DB.prog}), 'application/json');
  $('imJson').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ try{ const d=JSON.parse(rd.result); if(!Array.isArray(d.students)||!Array.isArray(d.sessions)) throw 0;
      let ns=0, nr=0; d.students.forEach(s=>{ if(!DB.students.some(x=>x.id===s.id)){ DB.students.push(s); ns++; } }); d.sessions.forEach(s=>{ if(!DB.sessions.some(x=>x.id===s.id)){ DB.sessions.push(s); nr++; } });
      if(d.prog) for(const sid in d.prog){ const a=prog(sid), b=d.prog[sid]; for(const k of ['passed','gems','open']) Object.assign(a[k],b[k]||{}); for(const id in (b.best||{})) a.best[id]=Math.max(a.best[id]||0,b.best[id]); }
      if(!DB.cur && DB.students[0]) DB.cur=DB.students[0].id; saveDB(); renderStu(); renderLog(); toast(`已匯入 ${ns} 位學生、${nr} 筆練習`); }catch(err){ toast('這個檔案不是構音練習的備份檔'); } }; rd.readAsText(f); };
  if($('delStu')){ $('delStu').onclick=()=>$('stuConfirm').hidden=false; $('stuNo').onclick=()=>$('stuConfirm').hidden=true;
    $('stuYes').onclick=()=>{ const id=DB.cur; DB.students=DB.students.filter(s=>s.id!==id); DB.sessions=DB.sessions.filter(s=>s.sid!==id); delete DB.prog[id]; DB.cur=DB.students[0]?DB.students[0].id:null; saveDB(); renderStu(); renderLog(); toast('已刪除'); }; }
}

/* ===== 啟動 ===== */
loadDB();
{ const env=srEnvProblem(); if(env){ $('srNotice').hidden=false; $('srNotice').textContent=env+' 目前仍可闖關，由老師用「算對／算錯」判定。'; } }
renderStu(); renderMap();
